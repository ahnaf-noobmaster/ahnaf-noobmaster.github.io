<meta charset="UTF-8">

<title>Health Pipeline — Terminal</title>
<style>
  :root{
    --bg:#0a0d0a; --fg:#3dff6e; --dim:#2a8a46; --amber:#ffb347;
    --cyan:#6ee7ff; --white:#eafff0; --err:#ff6b6b; --border:#1d3b24;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono","Courier New",monospace;
    font-size:14px; line-height:1.55;
    display:flex; align-items:center; justify-content:center;
    padding:18px;
  }
  .crt{
    position:fixed; inset:0; pointer-events:none; z-index:5; opacity:0.05;
    background:repeating-linear-gradient(0deg, #000 0px, #000 1px, transparent 1px, transparent 3px);
  }
  .term{
    width:100%; max-width:980px; height:88vh; background:#060806;
    border:1px solid var(--border); border-radius:10px; overflow:hidden;
    box-shadow:0 0 0 1px #000, 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(61,255,110,.06);
    display:flex; flex-direction:column;
  }
  .term-bar{
    background:#0e140e; padding:9px 14px; display:flex; align-items:center; gap:8px;
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .dot{width:11px;height:11px;border-radius:50%;}
  .dot.r{background:#ff5f56;} .dot.y{background:#ffbd2e;} .dot.g{background:#27c93f;}
  .term-title{margin-left:10px; color:#5c9c6c; font-size:12.5px; letter-spacing:.03em;}
  .term-output{
    flex:1; overflow-y:auto; padding:16px 18px; white-space:pre-wrap; word-break:break-word;
  }
  .term-output::-webkit-scrollbar{width:10px;}
  .term-output::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}
  .line{margin:0 0 2px;}
  .dim{color:var(--dim);}
  .amber{color:var(--amber);}
  .cyan{color:var(--cyan);}
  .white{color:var(--white);}
  .err{color:var(--err);}
  .ok{color:var(--fg);}
  .block{
    margin:6px 0 14px; padding:10px 14px; border-left:2px solid var(--border);
    color:var(--white); background:#0a110b;
  }
  .article h4{
    margin:12px 0 5px; font-size:12.5px; letter-spacing:.06em; color:var(--cyan);
    text-transform:uppercase; border-bottom:1px solid var(--border); padding-bottom:3px;
  }
  .article h4:first-child{margin-top:0;}
  .article p{margin:0 0 8px;}
  .article ul{margin:0 0 8px; padding-left:20px;}
  .article li{margin-bottom:2px;}
  .lang-tag{color:var(--cyan); font-weight:bold;}
  .list-item{cursor:pointer; color:var(--white);}
  .list-item:hover{color:var(--fg); text-decoration:underline;}
  .input-row{
    display:flex; align-items:center; gap:8px; padding:10px 18px 14px; border-top:1px solid var(--border);
    flex-shrink:0; background:#060806;
  }
  .prompt{color:var(--cyan); white-space:nowrap; font-weight:bold;}
  #cmd{
    flex:1; background:transparent; border:none; outline:none; color:var(--fg);
    font:inherit; caret-color:var(--fg);
  }
</style>
</head>
<body>
<div class="crt"></div>
<div class="term">
  <div class="term-bar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <div class="term-title">health-pipeline — fetch → article → translate → script</div>
  </div>
  <div class="term-output" id="output"></div>
  <div class="input-row">
    <span class="prompt">pipeline@sprint&gt;</span>
    <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
  </div>
</div>

 "Antenatal Care Basics": {
  "en": "Antenatal care means regular check-ups during pregnancy to protect both mother and baby. These visits include blood pressure checks, blood and urine tests, iron and folic acid supplements, and growth monitoring. The World Health Organization recommends at least eight contact points across a pregnancy. Eat a balanced, iron-rich diet, and avoid smoking, alcohol, and self-medication. Seek care immediately for bleeding, severe headache, blurred vision, or reduced movement from the baby.",
  "hi": "प्रसवपूर्व देखभाल का अर्थ है गर्भावस्था के दौरान नियमित जांच, जो मां और बच्चे दोनों की सुरक्षा करती है। इन दौरों में रक्तचाप जांच, रक्त और मूत्र परीक्षण, आयरन और फोलिक एसिड सप्लीमेंट, और विकास की निगरानी शामिल है। विश्व स्वास्थ्य संगठन पूरी गर्भावस्था में कम से कम आठ संपर्क बिंदुओं की सिफारिश करता है। संतुलित, आयरन युक्त आहार लें, और धूम्रपान, शराब और स्व-दवा से बचें। रक्तस्राव, गंभीर सिरदर्द, धुंधला दिखना, या बच्चे की हलचल कम होने पर तुरंत देखभाल लें।",
  "bn": "প্রসবপূর্ব যত্ন মানে গর্ভাবস্থায় নিয়মিত চেকআপ, যা মা ও শিশু উভয়কে সুরক্ষা দেয়। এই পরিদর্শনে রক্তচাপ পরীক্ষা, রক্ত ও প্রস্রাব পরীক্ষা, আয়রন ও ফলিক অ্যাসিড সাপ্লিমেন্ট, এবং বৃদ্ধি পর্যবেক্ষণ অন্তর্ভুক্ত। বিশ্ব স্বাস্থ্য সংস্থা পুরো গর্ভাবস্থায় অন্তত আটটি যোগাযোগের পরামর্শ দেয়। সুষম, আয়রন সমৃদ্ধ খাবার খান, এবং ধূমপান, মদ্যপান ও স্ব-ঔষধ এড়িয়ে চলুন। রক্তপাত, তীব্র মাথাব্যথা, ঝাপসা দৃষ্টি, বা শিশুর নড়াচড়া কমে গেলে অবিলম্বে চিকিৎসা নিন।",
  "ta": "கர்ப்பகால பராமரிப்பு என்பது கர்ப்ப காலத்தில் தாய் மற்றும் குழந்தை இருவரையும் பாதுகாக்கும் வழக்கமான பரிசோதனைகளைக் குறிக்கிறது. இந்த வருகைகளில் இரத்த அழுத்த பரிசோதனை, இரத்தம் மற்றும் சிறுநீர் பரிசோதனைகள், இரும்பு மற்றும் ஃபோலிக் அமில மருந்துகள், மற்றும் வளர்ச்சி கண்காணிப்பு ஆகியவை அடங்கும். உலக சுகாதார அமைப்பு கர்ப்ப காலம் முழுவதும் குறைந்தது எட்டு தொடர்பு புள்ளிகளை பரிந்துரைக்கிறது. சமச்சீரான, இரும்பு நிறைந்த உணவை உண்ணுங்கள், புகைபிடித்தல், மது அருந்துதல் மற்றும் சுய மருந்து பயன்பாட்டைத் தவிர்க்கவும். இரத்தப்போக்கு, கடுமையான தலைவலி, மங்கலான பார்வை, அல்லது குழந்தையின் அசைவு குறைந்தால் உடனடியாக பராமரிப்பு பெறுங்கள்."
 },
 "Anemia in Pregnancy": {
  "en": "Anemia in pregnancy usually means low iron, and it raises risks for both mother and baby if it's not treated. Watch for fatigue, pale skin, shortness of breath, and a fast heartbeat. To prevent it: take iron and folic acid supplements as advised, eat iron-rich foods like leafy greens and legumes, and pair them with vitamin C for better absorption. Get your hemoglobin checked at every antenatal visit. See a doctor promptly if fatigue or breathlessness becomes severe.",
  "hi": "गर्भावस्था में एनीमिया का आमतौर पर मतलब है आयरन की कमी, और उपचार न होने पर यह मां और बच्चे दोनों के लिए जोखिम बढ़ाता है। थकान, पीली त्वचा, सांस फूलना, और तेज दिल की धड़कन पर ध्यान दें। बचाव के लिए: सलाह अनुसार आयरन और फोलिक एसिड सप्लीमेंट लें, पत्तेदार सब्जियों और दालों जैसे आयरन युक्त खाद्य पदार्थ खाएं, और बेहतर अवशोषण के लिए विटामिन सी के साथ लें। हर प्रसवपूर्व जांच में अपना हीमोग्लोबिन जांचवाएं। यदि थकान या सांस फूलना गंभीर हो जाए तो तुरंत डॉक्टर से मिलें।",
  "bn": "গর্ভাবস্থায় রক্তস্বল্পতা সাধারণত আয়রনের ঘাটতি বোঝায়, এবং চিকিৎসা না করালে এটি মা ও শিশু উভয়ের জন্য ঝুঁকি বাড়ায়। ক্লান্তি, ফ্যাকাশে ত্বক, শ্বাসকষ্ট, এবং দ্রুত হৃদস্পন্দন লক্ষ্য করুন। প্রতিরোধের জন্য: পরামর্শ অনুযায়ী আয়রন ও ফলিক অ্যাসিড সাপ্লিমেন্ট নিন, শাকসবজি ও ডালের মতো আয়রন সমৃদ্ধ খাবার খান, এবং ভালো শোষণের জন্য ভিটামিন সি-এর সাথে খান। প্রতিটি প্রসবপূর্ব পরিদর্শনে আপনার হিমোগ্লোবিন পরীক্ষা করান। ক্লান্তি বা শ্বাসকষ্ট তীব্র হলে অবিলম্বে ডাক্তার দেখান।",
  "ta": "கர்ப்ப காலத்தில் இரத்த சோகை பொதுவாக இரும்புச் சத்து குறைவைக் குறிக்கிறது, சிகிச்சை அளிக்கப்படாவிட்டால் இது தாய் மற்றும் குழந்தை இருவருக்கும் ஆபத்தை அதிகரிக்கிறது. சோர்வு, வெளிறிய தோல், மூச்சுத் திணறல், மற்றும் விரைவான இதயத் துடிப்பை கவனியுங்கள். தடுக்க: ஆலோசனைப்படி இரும்பு மற்றும் ஃபோலிக் அமில மருந்துகளை எடுத்துக்கொள்ளுங்கள், கீரைகள் மற்றும் பருப்பு வகைகள் போன்ற இரும்பு நிறைந்த உணவுகளை உண்ணுங்கள், சிறந்த உறிஞ்சுதலுக்கு வைட்டமின் சி உடன் சேர்த்து எடுத்துக்கொள்ளுங்கள். ஒவ்வொரு கர்ப்பகால பரிசோதனையிலும் உங்கள் ஹீமோகுளோபினை சோதிக்கவும். சோர்வு அல்லது மூச்சுத் திணறல் கடுமையானால் உடனடியாக மருத்துவரை அணுகவும்."
 },
 "Diarrhea in Children": {
  "en": "Diarrhea in young children is usually caused by infection, spread through contaminated food or water. Watch for frequent watery stools, vomiting, and signs of dehydration like a dry mouth or reduced urination. The most important treatment is oral rehydration solution and zinc, plus continued feeding or breastfeeding. Wash hands with soap before feeding and after the toilet. Seek urgent care if there's blood in the stool, persistent vomiting, or dehydration that doesn't improve.",
  "hi": "छोटे बच्चों में दस्त आमतौर पर संक्रमण के कारण होता है, जो दूषित भोजन या पानी से फैलता है। बार-बार पतला मल, उल्टी, और निर्जलीकरण के संकेत जैसे सूखा मुंह या कम पेशाब पर ध्यान दें। सबसे महत्वपूर्ण उपचार है ओरल रिहाइड्रेशन सॉल्यूशन और जिंक, साथ ही स्तनपान या भोजन जारी रखना। खिलाने से पहले और शौचालय के बाद साबुन से हाथ धोएं। मल में खून, लगातार उल्टी, या निर्जलीकरण में सुधार न होने पर तुरंत देखभाल लें।",
  "bn": "ছোট শিশুদের ডায়রিয়া সাধারণত সংক্রমণের কারণে হয়, যা দূষিত খাবার বা পানি থেকে ছড়ায়। ঘন ঘন পাতলা মল, বমি, এবং পানিশূন্যতার লক্ষণ যেমন শুকনো মুখ বা কম প্রস্রাব লক্ষ্য করুন। সবচেয়ে গুরুত্বপূর্ণ চিকিৎসা হলো ওরাল রিহাইড্রেশন সলিউশন ও জিঙ্ক, পাশাপাশি স্তন্যপান বা খাওয়ানো চালিয়ে যাওয়া। খাওয়ানোর আগে এবং টয়লেট ব্যবহারের পরে সাবান দিয়ে হাত ধুয়ে নিন। মলে রক্ত, ক্রমাগত বমি, বা পানিশূন্যতার উন্নতি না হলে জরুরি চিকিৎসা নিন।",
  "ta": "சிறு குழந்தைகளில் வயிற்றுப்போக்கு பொதுவாக தொற்றினால் ஏற்படுகிறது, இது அசுத்தமான உணவு அல்லது நீரில் இருந்து பரவுகிறது. அடிக்கடி நீர்த்த மலம், வாந்தி, மற்றும் உலர்ந்த வாய் அல்லது குறைந்த சிறுநீர் போன்ற நீரிழப்பு அறிகுறிகளை கவனியுங்கள். மிக முக்கியமான சிகிச்சை ஓரல் ரீஹைட்ரேஷன் கரைசல் மற்றும் ஜிங்க், அத்துடன் தாய்ப்பால் அல்லது உணவை தொடர்வது. உணவளிப்பதற்கு முன்னும் கழிப்பறைக்குப் பின்னும் சோப்புடன் கைகளைக் கழுவுங்கள். மலத்தில் இரத்தம், தொடர்ந்த வாந்தி, அல்லது நீரிழப்பு மேம்படவில்லை என்றால் உடனடியாக சிகிச்சை பெறுங்கள்."
 },
 "Childhood Pneumonia": {
  "en": "Pneumonia is a lung infection and one of the leading causes of death in young children worldwide — but it's preventable and treatable. Watch for fast or difficult breathing, cough, fever, and the chest pulling in with each breath. Prevention starts with completing childhood vaccines, especially pneumococcal and measles, along with exclusive breastfeeding for six months and reducing smoke exposure. Seek urgent medical care if a child is breathing fast, struggling to breathe, or unusually drowsy.",
  "hi": "निमोनिया एक फेफड़ों का संक्रमण है और विश्व भर में छोटे बच्चों में मृत्यु के प्रमुख कारणों में से एक है — लेकिन यह रोकथाम योग्य और उपचार योग्य है। तेज या कठिन सांस लेना, खांसी, बुखार, और हर सांस के साथ छाती का धंसना पर ध्यान दें। बचाव बचपन के टीके पूरे करने से शुरू होता है, विशेष रूप से न्यूमोकोकल और खसरा, साथ ही छह महीने तक विशेष स्तनपान और धुएं के संपर्क को कम करना। यदि बच्चा तेजी से सांस ले रहा हो, सांस लेने में संघर्ष कर रहा हो, या असामान्य रूप से सुस्त हो तो तुरंत चिकित्सा देखभाल लें।",
  "bn": "নিউমোনিয়া একটি ফুসফুসের সংক্রমণ এবং বিশ্বব্যাপী ছোট শিশুদের মৃত্যুর প্রধান কারণগুলির একটি — তবে এটি প্রতিরোধযোগ্য ও চিকিৎসাযোগ্য। দ্রুত বা কষ্টকর শ্বাস-প্রশ্বাস, কাশি, জ্বর, এবং প্রতিটি শ্বাসের সাথে বুক দেবে যাওয়া লক্ষ্য করুন। প্রতিরোধ শুরু হয় শৈশবের টিকা সম্পূর্ণ করা দিয়ে, বিশেষত নিউমোকক্কাল ও হাম, পাশাপাশি ছয় মাস পর্যন্ত একচেটিয়া স্তন্যপান এবং ধোঁয়ার সংস্পর্শ কমানো। শিশু দ্রুত শ্বাস নিচ্ছে, শ্বাস নিতে কষ্ট হচ্ছে, বা অস্বাভাবিক নিস্তেজ হলে অবিলম্বে চিকিৎসা নিন।",
  "ta": "நிமோனியா ஒரு நுரையீரல் தொற்று மற்றும் உலகளவில் சிறு குழந்தைகளின் மரணத்திற்கு முக்கிய காரணங்களில் ஒன்றாகும் — ஆனால் இது தடுக்கக்கூடியது மற்றும் குணப்படுத்தக்கூடியது. வேகமான அல்லது கடினமான சுவாசம், இருமல், காய்ச்சல், மற்றும் ஒவ்வொரு சுவாசத்திலும் மார்பு உள்ளிழுப்பதை கவனியுங்கள். தடுப்பு குழந்தைப் பருவ தடுப்பூசிகளை முழுமையாக்குவதில் தொடங்குகிறது, குறிப்பாக நிமோகோக்கல் மற்றும் தட்டம்மை தடுப்பூசிகள், அத்துடன் ஆறு மாதங்கள் வரை தனி தாய்ப்பால் மற்றும் புகை வெளிப்பாட்டைக் குறைத்தல். குழந்தை வேகமாக சுவாசித்தால், சுவாசிக்க சிரமப்பட்டால், அல்லது அசாதாரணமாக சோர்வாக இருந்தால் உடனடியாக மருத்துவ உதவி பெறுங்கள்."
 },
 "Iron Deficiency Anemia": {
  "en": "Iron deficiency anemia happens when your body doesn't have enough iron to make healthy red blood cells — one of the most common deficiencies in South Asia. Watch for fatigue, pale skin, shortness of breath, and trouble concentrating. Prevent it by eating iron-rich foods like leafy vegetables, legumes, and meat, paired with vitamin C for better absorption. Treating underlying causes, like worm infections, matters too. See a doctor if fatigue or paleness persists, especially in children and pregnant women.",
  "hi": "आयरन की कमी से होने वाला एनीमिया तब होता है जब शरीर में स्वस्थ लाल रक्त कोशिकाएं बनाने के लिए पर्याप्त आयरन नहीं होता — दक्षिण एशिया में सबसे आम कमियों में से एक। थकान, पीली त्वचा, सांस फूलना, और ध्यान केंद्रित करने में कठिनाई पर ध्यान दें। पत्तेदार सब्जियों, दालों और मांस जैसे आयरन युक्त खाद्य पदार्थ खाकर, और बेहतर अवशोषण के लिए विटामिन सी के साथ लेकर इसे रोकें। कृमि संक्रमण जैसे मूल कारणों का इलाज करना भी महत्वपूर्ण है। यदि थकान या पीलापन बना रहे, विशेष रूप से बच्चों और गर्भवती महिलाओं में, तो डॉक्टर से मिलें।",
  "bn": "আয়রনের ঘাটতিজনিত রক্তস্বল্পতা তখন হয় যখন শরীরে সুস্থ লোহিত রক্তকণিকা তৈরির জন্য পর্যাপ্ত আয়রন থাকে না — দক্ষিণ এশিয়ায় সবচেয়ে সাধারণ ঘাটতিগুলির একটি। ক্লান্তি, ফ্যাকাশে ত্বক, শ্বাসকষ্ট, এবং মনোযোগ দিতে অসুবিধা লক্ষ্য করুন। শাকসবজি, ডাল ও মাংসের মতো আয়রন সমৃদ্ধ খাবার খেয়ে, এবং ভালো শোষণের জন্য ভিটামিন সি-এর সাথে খেয়ে এটি প্রতিরোধ করুন। কৃমি সংক্রমণের মতো মূল কারণের চিকিৎসাও গুরুত্বপূর্ণ। ক্লান্তি বা ফ্যাকাশে ভাব অব্যাহত থাকলে, বিশেষত শিশু ও গর্ভবতী নারীদের ক্ষেত্রে, ডাক্তার দেখান।",
  "ta": "இரும்புச்சத்து குறைபாடு இரத்த சோகை என்பது உடல் ஆரோக்கியமான சிவப்பு இரத்த அணுக்களை உருவாக்க போதிய இரும்பு இல்லாதபோது ஏற்படுகிறது — தென்னாசியாவில் மிகவும் பொதுவான குறைபாடுகளில் ஒன்று. சோர்வு, வெளிறிய தோல், மூச்சுத் திணறல், மற்றும் கவனம் செலுத்த சிரமம் ஆகியவற்றை கவனியுங்கள். கீரைகள், பருப்பு வகைகள் மற்றும் இறைச்சி போன்ற இரும்பு நிறைந்த உணவுகளை உண்டு, சிறந்த உறிஞ்சுதலுக்கு வைட்டமின் சி உடன் சேர்த்து தடுக்கவும். புழு தொற்று போன்ற அடிப்படை காரணங்களுக்கு சிகிச்சை அளிப்பதும் முக்கியம். சோர்வு அல்லது வெளிறிய தோற்றம் தொடர்ந்தால், குறிப்பாக குழந்தைகள் மற்றும் கர்ப்பிணிப் பெண்களில், மருத்துவரை அணுகவும்."
 },
 "Depression": {
  "en": "Depression is a common mental health condition — persistent sadness and a loss of interest in daily life, not just a bad day. Watch for low mood, loss of interest in things you used to enjoy, changes in sleep or appetite, and low energy. It's treatable with the right support: stay socially connected, keep active, and sleep well. Speak to a health professional if low mood lasts more than two weeks and affects your daily life, or right away if you're thinking of self-harm.",
  "hi": "डिप्रेशन एक सामान्य मानसिक स्वास्थ्य स्थिति है — लगातार उदासी और दैनिक जीवन में रुचि की कमी, न कि केवल एक बुरा दिन। कम मूड, पहले पसंद की जाने वाली चीजों में रुचि कम होना, नींद या भूख में बदलाव, और कम ऊर्जा पर ध्यान दें। सही सहायता से यह उपचार योग्य है: सामाजिक रूप से जुड़े रहें, सक्रिय रहें, और अच्छी नींद लें। यदि कम मूड दो सप्ताह से अधिक रहे और दैनिक जीवन को प्रभावित करे, तो स्वास्थ्य पेशेवर से बात करें, और यदि आत्म-हानि के विचार आएं तो तुरंत।",
  "bn": "বিষণ্নতা একটি সাধারণ মানসিক স্বাস্থ্য সমস্যা — ক্রমাগত দুঃখবোধ এবং দৈনন্দিন জীবনে আগ্রহ হারানো, শুধু একটি খারাপ দিন নয়। মন খারাপ, আগে পছন্দের জিনিসে আগ্রহ কমে যাওয়া, ঘুম বা ক্ষুধার পরিবর্তন, এবং কম শক্তি লক্ষ্য করুন। সঠিক সহায়তায় এটি চিকিৎসাযোগ্য: সামাজিকভাবে সংযুক্ত থাকুন, সক্রিয় থাকুন, এবং ভালো ঘুমান। মন খারাপ দুই সপ্তাহের বেশি স্থায়ী হলে এবং দৈনন্দিন জীবনকে প্রভাবিত করলে স্বাস্থ্য পেশাদারের সাথে কথা বলুন, এবং আত্ম-ক্ষতির চিন্তা এলে অবিলম্বে।",
  "ta": "மனச்சோர்வு ஒரு பொதுவான மனநல நிலை — தொடர்ந்த சோகம் மற்றும் அன்றாட வாழ்க்கையில் ஆர்வமின்மை, வெறும் ஒரு மோசமான நாள் அல்ல. குறைந்த மனநிலை, முன்பு விரும்பிய விஷயங்களில் ஆர்வம் குறைதல், தூக்கம் அல்லது பசியில் மாற்றங்கள், மற்றும் குறைந்த ஆற்றலை கவனியுங்கள். சரியான ஆதரவுடன் இது குணப்படுத்தக்கூடியது: சமூக ரீதியாக இணைந்திருங்கள், சுறுசுறுப்பாக இருங்கள், நன்றாக தூங்குங்கள். குறைந்த மனநிலை இரண்டு வாரங்களுக்கு மேல் நீடித்து அன்றாட வாழ்க்கையை பாதித்தால் ஒரு சுகாதார நிபுணரிடம் பேசுங்கள், சுயதீங்கு எண்ணங்கள் வந்தால் உடனடியாக."
 },
 "Anxiety Disorders": {
  "en": "Anxiety disorders involve worry or fear that's excessive, persistent, and gets in the way of daily life — beyond normal stress. Watch for constant worry, restlessness, a racing heart, trouble sleeping, and avoiding situations that trigger it. Relaxation techniques, regular exercise, good sleep, and cutting back on caffeine can help manage it day to day. See a professional if anxiety is disproportionate to the situation or interferes with work, relationships, or daily tasks — counselling works.",
  "hi": "चिंता विकारों में अत्यधिक, लगातार चिंता या भय शामिल है जो दैनिक जीवन में बाधा डालता है — सामान्य तनाव से परे। लगातार चिंता, बेचैनी, तेज दिल की धड़कन, नींद न आना, और ट्रिगर करने वाली स्थितियों से बचना पर ध्यान दें। विश्राम तकनीकें, नियमित व्यायाम, अच्छी नींद, और कैफीन कम करना इसे रोजमर्रा प्रबंधित करने में मदद कर सकता है। यदि चिंता स्थिति के अनुपात में न हो या काम, रिश्तों, या दैनिक कार्यों में बाधा डाले तो पेशेवर से मिलें — काउंसलिंग कारगर है।",
  "bn": "উদ্বেগজনিত ব্যাধিতে অতিরিক্ত, ক্রমাগত উদ্বেগ বা ভয় জড়িত যা দৈনন্দিন জীবনে বাধা সৃষ্টি করে — স্বাভাবিক চাপের চেয়ে বেশি। ক্রমাগত উদ্বেগ, অস্থিরতা, দ্রুত হৃদস্পন্দন, ঘুমাতে অসুবিধা, এবং ট্রিগার করা পরিস্থিতি এড়িয়ে চলা লক্ষ্য করুন। শিথিলকরণ কৌশল, নিয়মিত ব্যায়াম, ভালো ঘুম, এবং ক্যাফেইন কমানো প্রতিদিনের ব্যবস্থাপনায় সাহায্য করতে পারে। উদ্বেগ পরিস্থিতির সাথে অসামঞ্জস্যপূর্ণ হলে বা কাজ, সম্পর্ক, বা দৈনন্দিন কাজে বাধা দিলে পেশাদারের সাথে দেখা করুন — কাউন্সেলিং কার্যকর।",
  "ta": "கவலைக் கோளாறுகள் அதிகப்படியான, தொடர்ந்த கவலை அல்லது பயத்தை உள்ளடக்கியது, இது அன்றாட வாழ்க்கையில் தடையாக இருக்கும் — சாதாரண மன அழுத்தத்தை விட அதிகமானது. தொடர்ந்த கவலை, அமைதியின்மை, விரைவான இதயத் துடிப்பு, தூக்கமின்மை, மற்றும் தூண்டும் சூழ்நிலைகளைத் தவிர்ப்பதை கவனியுங்கள். தளர்வு நுட்பங்கள், தொடர்ந்த உடற்பயிற்சி, நல்ல தூக்கம், மற்றும் காஃபினைக் குறைப்பது அன்றாடம் நிர்வகிக்க உதவும். கவலை சூழ்நிலைக்கு ஏற்றதாக இல்லாமல் அல்லது வேலை, உறவுகள், அன்றாட பணிகளில் தடையாக இருந்தால் நிபுணரை அணுகவும் — ஆலோசனை பயனுள்ளதாக இருக்கும்."
 },
 "Menstrual Health & Hygiene": {
  "en": "Understanding your cycle and practicing good hygiene supports comfort and health during your period. Cycles typically run twenty-one to thirty-five days, with bleeding lasting three to seven days — some variation is normal. Change pads, tampons, or cups every four to six hours, and wash your hands before and after. Very heavy bleeding, cycles outside the normal range, or severe pain aren't something to just push through. See a doctor if bleeding is very heavy or pain disrupts your daily life.",
  "hi": "अपने चक्र को समझना और अच्छी स्वच्छता अपनाना मासिक धर्म के दौरान आराम और स्वास्थ्य में मदद करता है। चक्र आमतौर पर इक्कीस से पैंतीस दिनों तक चलते हैं, रक्तस्राव तीन से सात दिनों तक रहता है — कुछ भिन्नता सामान्य है। पैड, टैम्पोन, या कप को हर चार से छह घंटे में बदलें, और पहले और बाद में हाथ धोएं। बहुत अधिक रक्तस्राव, सामान्य सीमा से बाहर चक्र, या गंभीर दर्द को नजरअंदाज न करें। यदि रक्तस्राव बहुत भारी हो या दर्द दैनिक जीवन बाधित करे तो डॉक्टर से मिलें।",
  "bn": "আপনার চক্র বোঝা এবং ভালো স্বাস্থ্যবিধি মাসিকের সময় আরাম ও স্বাস্থ্যে সহায়তা করে। চক্র সাধারণত একুশ থেকে পঁয়ত্রিশ দিন স্থায়ী হয়, রক্তপাত তিন থেকে সাত দিন থাকে — কিছুটা তারতম্য স্বাভাবিক। প্রতি চার থেকে ছয় ঘণ্টায় প্যাড, ট্যাম্পন, বা কাপ পরিবর্তন করুন, এবং আগে-পরে হাত ধুয়ে নিন। অতিরিক্ত রক্তপাত, স্বাভাবিক সীমার বাইরে চক্র, বা তীব্র ব্যথা উপেক্ষা করার মতো কিছু নয়। রক্তপাত খুব বেশি হলে বা ব্যথা দৈনন্দিন জীবনে বাধা দিলে ডাক্তার দেখান।",
  "ta": "உங்கள் சுழற்சியைப் புரிந்துகொள்வதும் நல்ல சுகாதாரத்தை பின்பற்றுவதும் மாதவிடாய் காலத்தில் வசதி மற்றும் ஆரோக்கியத்திற்கு உதவுகிறது. சுழற்சிகள் பொதுவாக இருபத்தி ஒன்று முதல் முப்பத்தி ஐந்து நாட்கள் வரை இருக்கும், இரத்தப்போக்கு மூன்று முதல் ஏழு நாட்கள் நீடிக்கும் — சில மாறுபாடுகள் இயல்பானவை. பேட், டேம்பான், அல்லது கப்பை ஒவ்வொரு நான்கு முதல் ஆறு மணி நேரத்திற்கும் மாற்றவும், முன்பும் பின்பும் கைகளைக் கழுவவும். அதிக இரத்தப்போக்கு, இயல்பான வரம்புக்கு வெளியே சுழற்சிகள், அல்லது கடுமையான வலியை புறக்கணிக்க வேண்டாம். இரத்தப்போக்கு மிக அதிகமாக இருந்தால் அல்லது வலி அன்றாட வாழ்க்கையை பாதித்தால் மருத்துவரை அணுகவும்."
 },
 "Polycystic Ovary Syndrome (PCOS)": {
  "en": "PCOS is a common hormonal condition that can cause irregular periods and higher androgen levels. Watch for irregular or missed periods, excess hair growth, acne, weight gain, and difficulty conceiving. It's often linked to insulin resistance and family history. Management includes regular exercise, a balanced diet, weight management, and medication when prescribed — plus regular monitoring for related conditions like diabetes. See a doctor for irregular periods, unexplained hair growth or acne, or trouble conceiving.",
  "hi": "पीसीओएस एक सामान्य हार्मोनल स्थिति है जो अनियमित मासिक धर्म और उच्च एण्ड्रोजन स्तर का कारण बन सकती है। अनियमित या छूटे हुए मासिक धर्म, अतिरिक्त बाल उगना, मुंहासे, वजन बढ़ना, और गर्भधारण में कठिनाई पर ध्यान दें। यह अक्सर इंसुलिन प्रतिरोध और पारिवारिक इतिहास से जुड़ा होता है। प्रबंधन में नियमित व्यायाम, संतुलित आहार, वजन प्रबंधन, और निर्धारित दवा शामिल है — साथ ही डायबिटीज जैसी संबंधित स्थितियों की नियमित निगरानी। अनियमित मासिक धर्म, अस्पष्ट बाल उगना या मुंहासे, या गर्भधारण में परेशानी होने पर डॉक्टर से मिलें।",
  "bn": "পিসিওএস একটি সাধারণ হরমোনজনিত অবস্থা যা অনিয়মিত মাসিক এবং উচ্চ অ্যান্ড্রোজেন মাত্রার কারণ হতে পারে। অনিয়মিত বা বাদ পড়া মাসিক, অতিরিক্ত লোম গজানো, ব্রণ, ওজন বৃদ্ধি, এবং গর্ভধারণে অসুবিধা লক্ষ্য করুন। এটি প্রায়ই ইনসুলিন প্রতিরোধ এবং পারিবারিক ইতিহাসের সাথে যুক্ত। ব্যবস্থাপনায় নিয়মিত ব্যায়াম, সুষম খাদ্য, ওজন নিয়ন্ত্রণ, এবং নির্ধারিত ওষুধ অন্তর্ভুক্ত — পাশাপাশি ডায়াবেটিসের মতো সংশ্লিষ্ট অবস্থার নিয়মিত পর্যবেক্ষণ। অনিয়মিত মাসিক, ব্যাখ্যাতীত লোম গজানো বা ব্রণ, বা গর্ভধারণে সমস্যা হলে ডাক্তার দেখান।",
  "ta": "பிசிஓஎஸ் ஒரு பொதுவான ஹார்மோன் நிலை ஆகும், இது ஒழுங்கற்ற மாதவிடாய் மற்றும் அதிக ஆண்ட்ரோஜன் அளவுகளை ஏற்படுத்தலாம். ஒழுங்கற்ற அல்லது தவறிய மாதவிடாய், அதிக முடி வளர்ச்சி, முகப்பரு, எடை அதிகரிப்பு, மற்றும் கர்ப்பம் தரிக்க சிரமத்தை கவனியுங்கள். இது பெரும்பாலும் இன்சுலின் எதிர்ப்பு மற்றும் குடும்ப வரலாற்றுடன் தொடர்புடையது. நிர்வகிப்பதில் தொடர்ந்த உடற்பயிற்சி, சமச்சீர் உணவு, எடை மேலாண்மை, மற்றும் பரிந்துரைக்கப்பட்ட மருந்துகள் அடங்கும் — அத்துடன் நீரிழிவு போன்ற தொடர்புடைய நிலைகளுக்கான தொடர்ந்த கண்காணிப்பு. ஒழுங்கற்ற மாதவிடாய், விளக்கமற்ற முடி வளர்ச்சி அல்லது முகப்பரு, அல்லது கர்ப்பம் தரிப்பதில் சிரமம் இருந்தால் மருத்துவரை அணுகவும்."
 },
 "Prostate Health": {
  "en": "The prostate gland can enlarge or develop problems with age, and early awareness helps catch treatable issues. Watch for frequent urination, especially at night, a weak or interrupted stream, and difficulty starting to urinate. Staying active, eating a balanced diet, and getting routine check-ups after age fifty — or forty-five with a family history — all help. See a doctor for difficulty urinating, blood in your urine, or ongoing pelvic discomfort. Early checks make a real difference.",
  "hi": "प्रोस्टेट ग्रंथि उम्र के साथ बढ़ सकती है या समस्याएं विकसित कर सकती है, और शुरुआती जागरूकता उपचार योग्य समस्याओं को पकड़ने में मदद करती है। बार-बार पेशाब आना, विशेष रूप से रात में, कमजोर या बाधित धारा, और पेशाब शुरू करने में कठिनाई पर ध्यान दें। सक्रिय रहना, संतुलित आहार लेना, और पचास साल की उम्र के बाद — या पारिवारिक इतिहास होने पर पैंतालीस साल की उम्र के बाद — नियमित जांच कराना मदद करता है। पेशाब करने में कठिनाई, मूत्र में खून, या लगातार पेल्विक असुविधा होने पर डॉक्टर से मिलें। जल्दी जांच वास्तव में फर्क लाती है।",
  "bn": "প্রস্টেট গ্রন্থি বয়সের সাথে বড় হতে পারে বা সমস্যা তৈরি করতে পারে, এবং প্রাথমিক সচেতনতা চিকিৎসাযোগ্য সমস্যা ধরতে সাহায্য করে। ঘন ঘন প্রস্রাব, বিশেষত রাতে, দুর্বল বা বিঘ্নিত প্রবাহ, এবং প্রস্রাব শুরু করতে অসুবিধা লক্ষ্য করুন। সক্রিয় থাকা, সুষম খাদ্য গ্রহণ, এবং পঞ্চাশ বছর বয়সের পর — বা পারিবারিক ইতিহাস থাকলে পঁয়তাল্লিশ বছর বয়সের পর — নিয়মিত চেকআপ করানো সাহায্য করে। প্রস্রাব করতে অসুবিধা, প্রস্রাবে রক্ত, বা ক্রমাগত শ্রোণী অস্বস্তি হলে ডাক্তার দেখান। প্রাথমিক পরীক্ষা সত্যিই পার্থক্য তৈরি করে।",
  "ta": "புராஸ்டேட் சுரப்பி வயதுக்கு ஏற்ப பெரிதாகலாம் அல்லது பிரச்சினைகளை உருவாக்கலாம், மேலும் முன்கூட்டிய விழிப்புணர்வு சிகிச்சையளிக்கக்கூடிய பிரச்சினைகளைக் கண்டறிய உதவுகிறது. அடிக்கடி சிறுநீர் கழித்தல், குறிப்பாக இரவில், பலவீனமான அல்லது தடைபட்ட ஓட்டம், மற்றும் சிறுநீர் கழிக்கத் தொடங்குவதில் சிரமத்தை கவனியுங்கள். சுறுசுறுப்பாக இருப்பது, சமச்சீர் உணவு உண்பது, மற்றும் ஐம்பது வயதுக்குப் பிறகு — அல்லது குடும்ப வரலாறு இருந்தால் நாற்பத்தைந்து வயதுக்குப் பிறகு — தொடர்ந்த பரிசோதனைகள் செய்வது உதவும். சிறுநீர் கழிப்பதில் சிரமம், சிறுநீரில் இரத்தம், அல்லது தொடர்ந்த இடுப்பு அசௌகரியம் இருந்தால் மருத்துவரை அணுகவும். முன்கூட்டிய பரிசோதனைகள் உண்மையிலேயே வித்தியாசத்தை ஏற்படுத்தும்."
 },
 "Osteoarthritis": {
  "en": "Osteoarthritis is the most common form of arthritis, caused by wear and tear on joint cartilage — usually in the knees, hips, and hands. Watch for joint pain and stiffness, especially after rest, along with swelling and reduced movement. Managing it means keeping a healthy weight, trying low-impact exercise like swimming or walking, and physiotherapy when needed. See a doctor if joint pain persists, gets worse, or starts limiting your daily activities — it's very manageable with the right plan.",
  "hi": "ऑस्टियोआर्थराइटिस गठिया का सबसे सामान्य रूप है, जो जोड़ों के उपास्थि के टूट-फूट से होता है — आमतौर पर घुटनों, कूल्हों और हाथों में। जोड़ों में दर्द और अकड़न, विशेष रूप से आराम के बाद, साथ ही सूजन और कम गतिशीलता पर ध्यान दें। इसे प्रबंधित करने का मतलब है स्वस्थ वजन बनाए रखना, तैराकी या पैदल चलने जैसे कम प्रभाव वाले व्यायाम करना, और जरूरत पड़ने पर फिजियोथेरेपी लेना। यदि जोड़ों का दर्द बना रहे, बिगड़े, या दैनिक गतिविधियों को सीमित करने लगे तो डॉक्टर से मिलें — सही योजना के साथ यह बहुत प्रबंधनीय है।",
  "bn": "অস্টিওআর্থ্রাইটিস বাতের সবচেয়ে সাধারণ রূপ, যা জয়েন্টের তরুণাস্থির ক্ষয় থেকে হয় — সাধারণত হাঁটু, নিতম্ব ও হাতে। জয়েন্টে ব্যথা ও শক্তভাব, বিশেষত বিশ্রামের পরে, পাশাপাশি ফোলাভাব ও কমে যাওয়া নড়াচড়া লক্ষ্য করুন। এটি নিয়ন্ত্রণ করার অর্থ সুস্থ ওজন বজায় রাখা, সাঁতার বা হাঁটার মতো কম প্রভাবশালী ব্যায়াম করা, এবং প্রয়োজনে ফিজিওথেরাপি নেওয়া। জয়েন্টের ব্যথা অব্যাহত থাকলে, খারাপ হলে, বা দৈনন্দিন কাজকর্ম সীমিত করতে শুরু করলে ডাক্তার দেখান — সঠিক পরিকল্পনার সাথে এটি খুবই নিয়ন্ত্রণযোগ্য।",
  "ta": "ஆஸ்டியோஆர்த்ரைடிஸ் என்பது மூட்டு வாதத்தின் மிகவும் பொதுவான வடிவம் ஆகும், இது மூட்டு குருத்தெலும்பின் தேய்மானத்தால் ஏற்படுகிறது — பொதுவாக முழங்கால், இடுப்பு மற்றும் கைகளில். மூட்டு வலி மற்றும் விறைப்பு, குறிப்பாக ஓய்வுக்குப் பிறகு, அத்துடன் வீக்கம் மற்றும் குறைந்த இயக்கத்தை கவனியுங்கள். இதை நிர்வகிப்பது என்பது ஆரோக்கியமான எடையை பராமரிப்பது, நீச்சல் அல்லது நடைபயிற்சி போன்ற குறைந்த தாக்க உடற்பயிற்சிகளை முயற்சிப்பது, மற்றும் தேவைப்படும்போது ஃபிசியோதெரபி பெறுவது. மூட்டு வலி தொடர்ந்தால், மோசமடைந்தால், அல்லது அன்றாட செயல்பாடுகளை கட்டுப்படுத்தத் தொடங்கினால் மருத்துவரை அணுகவும் — சரியான திட்டத்துடன் இது மிகவும் நிர்வகிக்கக்கூடியது."
 },
 "Scabies": {
  "en": "Scabies is a contagious skin condition caused by tiny mites that burrow into the skin, spread through skin-to-skin contact or shared bedding. Watch for intense itching that's worse at night, small bumps, and thin burrow tracks, often between fingers or at the waistline. Prevent it by avoiding close contact with someone infected and washing bedding and clothing in hot water. It needs prescription treatment — over-the-counter remedies usually aren't enough — and everyone in the household should be treated together.",
  "hi": "स्केबीज एक संक्रामक त्वचा स्थिति है जो त्वचा में घुसने वाले छोटे कणों के कारण होती है, जो त्वचा-से-त्वचा संपर्क या साझा बिस्तर से फैलती है। तीव्र खुजली जो रात में बढ़ जाती है, छोटे उभार, और पतली सुरंग की रेखाएं, अक्सर उंगलियों के बीच या कमर पर, पर ध्यान दें। संक्रमित व्यक्ति के करीबी संपर्क से बचकर और बिस्तर व कपड़ों को गर्म पानी में धोकर इसे रोकें। इसके लिए प्रिस्क्रिप्शन उपचार की आवश्यकता होती है — बिना डॉक्टरी सलाह के उपाय आमतौर पर पर्याप्त नहीं होते — और घर के सभी सदस्यों का एक साथ इलाज होना चाहिए।",
  "bn": "স্ক্যাবিস একটি সংক্রামক ত্বকের অবস্থা যা ত্বকে ঢুকে পড়া ক্ষুদ্র মাইটের কারণে হয়, যা ত্বক-থেকে-ত্বক সংস্পর্শ বা ভাগ করা বিছানা থেকে ছড়ায়। তীব্র চুলকানি যা রাতে বেড়ে যায়, ছোট ফুসকুড়ি, এবং পাতলা সুড়ঙ্গের দাগ, প্রায়ই আঙুলের মাঝে বা কোমরে, লক্ষ্য করুন। সংক্রমিত ব্যক্তির ঘনিষ্ঠ সংস্পর্শ এড়িয়ে এবং বিছানা ও কাপড় গরম পানিতে ধুয়ে এটি প্রতিরোধ করুন। এর জন্য প্রেসক্রিপশন চিকিৎসা প্রয়োজন — ওভার-দ্য-কাউন্টার প্রতিকার সাধারণত যথেষ্ট নয় — এবং বাড়ির সবাইকে একসাথে চিকিৎসা নিতে হবে।",
  "ta": "ஸ்கேபிஸ் என்பது தோலில் புகும் சிறிய பூச்சிகளால் ஏற்படும் ஒரு தொற்று தோல் நிலை ஆகும், இது தோல்-தோல் தொடர்பு அல்லது பகிரப்பட்ட படுக்கை மூலம் பரவுகிறது. இரவில் அதிகரிக்கும் கடுமையான அரிப்பு, சிறிய கொப்புளங்கள், மற்றும் மெல்லிய சுரங்க கோடுகள், பெரும்பாலும் விரல்களுக்கு இடையே அல்லது இடுப்பில், கவனியுங்கள். தொற்றுக்குள்ளான நபருடன் நெருங்கிய தொடர்பைத் தவிர்த்து, படுக்கை மற்றும் ஆடைகளை சூடான நீரில் துவைத்து தடுக்கவும். இதற்கு மருந்து சிகிச்சை தேவை — மருந்தகத்தில் கிடைக்கும் பொதுவான மருந்துகள் பொதுவாக போதாது — மேலும் வீட்டில் உள்ள அனைவரும் ஒன்றாக சிகிச்சை பெற வேண்டும்."
 },
 "Conjunctivitis (Eye Infection)": {
  "en": "Conjunctivitis, or pink eye, is inflammation of the eye's outer surface, caused by infection, allergy, or irritants like smoke and dust. Watch for redness, itching or burning, and watery or sticky discharge. Prevent it by washing your hands often and avoiding touching or rubbing your eyes — and don't share towels or pillows while infected. Clean any discharge gently with a clean cloth. See a doctor if there's severe pain, vision changes, or no improvement after a few days.",
  "hi": "कंजंक्टिवाइटिस, या पिंक आई, आंख की बाहरी सतह की सूजन है, जो संक्रमण, एलर्जी, या धुएं व धूल जैसी जलन पैदा करने वाली चीजों से होती है। लालिमा, खुजली या जलन, और पानी भरा या चिपचिपा स्राव पर ध्यान दें। बार-बार हाथ धोकर और आंखों को छूने या मलने से बचकर इसे रोकें — और संक्रमण के दौरान तौलिया या तकिया साझा न करें। किसी भी स्राव को साफ कपड़े से धीरे से साफ करें। गंभीर दर्द, दृष्टि में बदलाव, या कुछ दिनों में सुधार न होने पर डॉक्टर से मिलें।",
  "bn": "কনজাংটিভাইটিস, বা পিঙ্ক আই, চোখের বাইরের পৃষ্ঠের প্রদাহ, যা সংক্রমণ, অ্যালার্জি, বা ধোঁয়া ও ধুলোর মতো উত্তেজকের কারণে হয়। লালভাব, চুলকানি বা জ্বালা, এবং পানিযুক্ত বা আঠালো স্রাব লক্ষ্য করুন। ঘন ঘন হাত ধুয়ে এবং চোখ স্পর্শ বা ঘষা এড়িয়ে এটি প্রতিরোধ করুন — এবং সংক্রমণের সময় তোয়ালে বা বালিশ শেয়ার করবেন না। যেকোনো স্রাব পরিষ্কার কাপড় দিয়ে আলতো করে মুছুন। তীব্র ব্যথা, দৃষ্টি পরিবর্তন, বা কয়েক দিনে উন্নতি না হলে ডাক্তার দেখান।",
  "ta": "கான்ஜங்டிவைடிஸ், அல்லது பிங்க் ஐ, கண்ணின் வெளிப்புற மேற்பரப்பின் அழற்சி ஆகும், இது தொற்று, ஒவ்வாமை, அல்லது புகை மற்றும் தூசி போன்ற எரிச்சலூட்டிகளால் ஏற்படுகிறது. சிவப்பு, அரிப்பு அல்லது எரிச்சல், மற்றும் நீர் அல்லது ஒட்டும் தன்மையுடைய வடிதலை கவனியுங்கள். அடிக்கடி கைகளைக் கழுவி, கண்களைத் தொடுவதையோ தேய்ப்பதையோ தவிர்த்து தடுக்கவும் — தொற்று காலத்தில் துண்டு அல்லது தலையணையை பகிர வேண்டாம். ஏதேனும் வடிதலை சுத்தமான துணியால் மெதுவாகத் துடைக்கவும். கடுமையான வலி, பார்வை மாற்றங்கள், அல்லது சில நாட்களில் முன்னேற்றம் இல்லை என்றால் மருத்துவரை அணுகவும்."
 },
 "Snake Bite First Aid": {
  "en": "A snake bite is a medical emergency, and correct first aid genuinely improves the outcome. Keep the person calm and still, and immobilize the bitten limb at or below heart level. Do not cut or suck the wound, don't apply ice, and never use a tight tourniquet. Get to a hospital immediately for antivenom — don't rely on traditional remedies. Prevent bites by wearing boots and using a torch outdoors at night. Every snake bite needs hospital care, even if symptoms seem mild.",
  "hi": "सांप का काटना एक चिकित्सा आपातकाल है, और सही प्राथमिक चिकित्सा वास्तव में परिणाम सुधारती है। व्यक्ति को शांत और स्थिर रखें, और काटे गए अंग को हृदय के स्तर पर या उससे नीचे स्थिर करें। घाव को काटें या चूसें नहीं, बर्फ न लगाएं, और कभी भी टाइट टूर्निकेट का उपयोग न करें। एंटीवेनम के लिए तुरंत अस्पताल जाएं — पारंपरिक उपचारों पर भरोसा न करें। बाहर रात में जूते पहनकर और टॉर्च का उपयोग करके काटने से बचें। हर सांप के काटने को अस्पताल में देखभाल की जरूरत है, भले ही लक्षण हल्के लगें।",
  "bn": "সাপের কামড় একটি মেডিকেল জরুরি অবস্থা, এবং সঠিক প্রাথমিক চিকিৎসা সত্যিই ফলাফল উন্নত করে। ব্যক্তিকে শান্ত ও স্থির রাখুন, এবং কামড়ানো অঙ্গকে হৃদয়ের স্তরে বা তার নিচে স্থির রাখুন। ক্ষত কাটবেন না বা চুষবেন না, বরফ লাগাবেন না, এবং কখনও টাইট টর্নিকেট ব্যবহার করবেন না। অ্যান্টিভেনমের জন্য অবিলম্বে হাসপাতালে যান — প্রথাগত প্রতিকারের উপর নির্ভর করবেন না। রাতে বাইরে বুট পরে এবং টর্চ ব্যবহার করে কামড় এড়িয়ে চলুন। প্রতিটি সাপের কামড়ে হাসপাতালের যত্ন প্রয়োজন, এমনকি লক্ষণ হালকা মনে হলেও।",
  "ta": "பாம்பு கடி ஒரு மருத்துவ அவசரநிலை ஆகும், மற்றும் சரியான முதலுதவி முடிவுகளை உண்மையிலேயே மேம்படுத்துகிறது. நபரை அமைதியாகவும் அசையாமலும் வைத்திருங்கள், கடிக்கப்பட்ட உறுப்பை இதய மட்டத்தில் அல்லது அதற்குக் கீழே அசையாமல் வைக்கவும். காயத்தை வெட்டவோ உறிஞ்சவோ வேண்டாம், பனி கட்டி வைக்க வேண்டாம், இறுக்கமான கயிறு ஒருபோதும் பயன்படுத்த வேண்டாம். ஆண்டிவெனத்திற்காக உடனடியாக மருத்துவமனைக்குச் செல்லுங்கள் — பாரம்பரிய மருந்துகளை நம்ப வேண்டாம். இரவில் வெளியே பூட்ஸ் அணிந்து, கைவிளக்கு பயன்படுத்தி கடியைத் தவிர்க்கவும். அறிகுறிகள் லேசாகத் தோன்றினாலும் ஒவ்வொரு பாம்பு கடிக்கும் மருத்துவமனை பராமரிப்பு தேவை."
 },
 "Burns First Aid": {
  "en": "Quick, correct first aid for burns makes a real difference to healing. Cool the burn under running water for ten to twenty minutes, remove tight clothing or jewelry near it before swelling starts, and cover it loosely with a clean cloth. Never apply ice, butter, or toothpaste — these can make it worse. Keep hot liquids and flames away from children as a simple prevention step. Seek medical care for large burns, burns on the face or hands, or any sign of infection.",
  "hi": "जलने के लिए त्वरित और सही प्राथमिक चिकित्सा उपचार में वास्तविक फर्क लाती है। जले हुए हिस्से को दस से बीस मिनट तक बहते पानी के नीचे ठंडा करें, सूजन शुरू होने से पहले उसके पास के तंग कपड़े या गहने हटाएं, और इसे साफ कपड़े से ढीला ढकें। कभी भी बर्फ, मक्खन, या टूथपेस्ट न लगाएं — ये स्थिति और खराब कर सकते हैं। बचाव के सरल कदम के रूप में गर्म तरल पदार्थ और आग को बच्चों से दूर रखें। बड़े जलने, चेहरे या हाथों पर जलने, या संक्रमण के किसी भी संकेत के लिए चिकित्सा देखभाल लें।",
  "bn": "পোড়ার জন্য দ্রুত ও সঠিক প্রাথমিক চিকিৎসা নিরাময়ে বাস্তব পার্থক্য তৈরি করে। পোড়া জায়গাটি দশ থেকে বিশ মিনিট ধরে প্রবাহিত পানির নিচে ঠান্ডা করুন, ফোলা শুরুর আগে কাছাকাছি টাইট পোশাক বা গয়না সরান, এবং পরিষ্কার কাপড় দিয়ে আলগাভাবে ঢেকে দিন। কখনও বরফ, মাখন, বা টুথপেস্ট লাগাবেন না — এগুলো অবস্থা আরও খারাপ করতে পারে। সহজ প্রতিরোধের পদক্ষেপ হিসেবে গরম তরল ও আগুন শিশুদের থেকে দূরে রাখুন। বড় পোড়া, মুখ বা হাতে পোড়া, বা সংক্রমণের কোনো লক্ষণের জন্য চিকিৎসা নিন।",
  "ta": "தீக்காயங்களுக்கான விரைவான மற்றும் சரியான முதலுதவி குணமடைவதில் உண்மையான வித்தியாசத்தை ஏற்படுத்துகிறது. காயத்தை ஓடும் நீரின் கீழ் பத்து முதல் இருபது நிமிடங்கள் குளிர்விக்கவும், வீக்கம் தொடங்குவதற்கு முன் அருகிலுள்ள இறுக்கமான ஆடை அல்லது நகைகளை அகற்றவும், சுத்தமான துணியால் தளர்வாக மூடவும். பனிக்கட்டி, வெண்ணெய், அல்லது பல் பசை ஒருபோதும் பயன்படுத்த வேண்டாம் — இவை நிலையை மோசமாக்கலாம். குழந்தைகளிடமிருந்து சூடான திரவங்கள் மற்றும் தீயை தூரத்தில் வைப்பது ஒரு எளிய தடுப்பு நடவடிக்கை. பெரிய தீக்காயங்கள், முகம் அல்லது கைகளில் காயங்கள், அல்லது தொற்றின் எந்த அறிகுறிக்கும் மருத்துவ உதவி பெறுங்கள்."
 },
 "Sexually Transmitted Infections (STI) Prevention": {
  "en": "STIs spread mainly through sexual contact, and many — including chlamydia, gonorrhea, and HIV — are preventable and treatable, especially with early testing. Watch for unusual discharge, sores, or pain when urinating — but many STIs cause no symptoms at all, which is why testing matters. Prevent them by using condoms consistently, limiting partners, and getting vaccinated where available, like the HPV vaccine. See a healthcare provider for testing if you have symptoms, a new partner, or unprotected sex.",
  "hi": "एसटीआई मुख्य रूप से यौन संपर्क से फैलते हैं, और क्लैमाइडिया, गोनोरिया, और एचआईवी सहित कई रोकथाम योग्य और उपचार योग्य हैं, खासकर जल्दी जांच से। असामान्य स्राव, घाव, या पेशाब करते समय दर्द पर ध्यान दें — लेकिन कई एसटीआई में कोई लक्षण नहीं होते, यही कारण है कि जांच महत्वपूर्ण है। कंडोम का लगातार उपयोग करके, साझेदारों को सीमित करके, और एचपीवी वैक्सीन जैसे उपलब्ध टीके लगवाकर इन्हें रोकें। लक्षण होने, नए साथी होने, या असुरक्षित यौन संबंध होने पर जांच के लिए स्वास्थ्य प्रदाता से मिलें।",
  "bn": "এসটিআই প্রধানত যৌন সংস্পর্শের মাধ্যমে ছড়ায়, এবং ক্ল্যামাইডিয়া, গনোরিয়া, ও এইচআইভি সহ অনেকগুলি প্রতিরোধযোগ্য ও চিকিৎসাযোগ্য, বিশেষত প্রাথমিক পরীক্ষার মাধ্যমে। অস্বাভাবিক স্রাব, ঘা, বা প্রস্রাবের সময় ব্যথা লক্ষ্য করুন — তবে অনেক এসটিআই-তে কোনো লক্ষণ থাকে না, এজন্যই পরীক্ষা গুরুত্বপূর্ণ। কনডম নিয়মিত ব্যবহার করে, সঙ্গী সীমিত রেখে, এবং এইচপিভি ভ্যাকসিনের মতো উপলব্ধ টিকা নিয়ে এগুলো প্রতিরোধ করুন। লক্ষণ থাকলে, নতুন সঙ্গী থাকলে, বা অনিরাপদ যৌন সম্পর্ক হলে পরীক্ষার জন্য স্বাস্থ্যসেবা প্রদানকারীর কাছে যান।",
  "ta": "பாலியல் ரீதியாக பரவும் தொற்றுகள் முக்கியமாக பாலியல் தொடர்பு மூலம் பரவுகின்றன, மேலும் கிளமீடியா, கோனோரியா, மற்றும் எச்.ஐ.வி உள்ளிட்ட பல தடுக்கக்கூடியவை மற்றும் குணப்படுத்தக்கூடியவை, குறிப்பாக முன்கூட்டிய பரிசோதனையுடன். அசாதாரண வடிதல், புண்கள், அல்லது சிறுநீர் கழிக்கும்போது வலியை கவனியுங்கள் — ஆனால் பல தொற்றுகள் எந்த அறிகுறியையும் காட்டாது, அதனால்தான் பரிசோதனை முக்கியமானது. ஆணுறையை தொடர்ந்து பயன்படுத்தி, துணைகளை கட்டுப்படுத்தி, எச்பிவி தடுப்பூசி போன்ற கிடைக்கும் தடுப்பூசிகளை பெற்று இவற்றைத் தடுக்கவும். அறிகுறிகள், புதிய துணை, அல்லது பாதுகாப்பற்ற உறவு இருந்தால் பரிசோதனைக்காக சுகாதார வழங்குநரை அணுகவும்."
 },
 "Heat Stroke & Heat Exhaustion": {
  "en": "Heat stroke is a serious, potentially life-threatening condition from the body overheating, common during heat waves. Heat exhaustion looks like heavy sweating, weakness, and dizziness — heat stroke means high body temperature, confusion, and even loss of consciousness. Prevent it by staying hydrated, avoiding outdoor activity during peak heat, and wearing light, loose clothing. Heat stroke is a medical emergency: move the person to a cool place, cool their body down, and get emergency help immediately.",
  "hi": "हीट स्ट्रोक शरीर के अधिक गर्म होने से होने वाली एक गंभीर, संभावित रूप से जानलेवा स्थिति है, जो लू के दौरान आम है। हीट एग्जॉशन में अत्यधिक पसीना, कमजोरी, और चक्कर आना शामिल है — हीट स्ट्रोक में उच्च शरीर तापमान, भ्रम, और यहां तक कि बेहोशी शामिल है। हाइड्रेटेड रहकर, तेज गर्मी के दौरान बाहरी गतिविधि से बचकर, और हल्के, ढीले कपड़े पहनकर इसे रोकें। हीट स्ट्रोक एक चिकित्सा आपातकाल है: व्यक्ति को ठंडी जगह पर ले जाएं, उसका शरीर ठंडा करें, और तुरंत आपातकालीन सहायता लें।",
  "bn": "হিট স্ট্রোক শরীর অতিরিক্ত গরম হওয়া থেকে একটি গুরুতর, সম্ভাব্য প্রাণঘাতী অবস্থা, যা তাপপ্রবাহের সময় সাধারণ। হিট এক্সহশনে অতিরিক্ত ঘাম, দুর্বলতা, এবং মাথা ঘোরা অন্তর্ভুক্ত — হিট স্ট্রোকে উচ্চ শরীরের তাপমাত্রা, বিভ্রান্তি, এমনকি জ্ঞান হারানো অন্তর্ভুক্ত। হাইড্রেটেড থেকে, তীব্র গরমের সময় বাইরের কার্যকলাপ এড়িয়ে, এবং হালকা, ঢিলেঢালা পোশাক পরে এটি প্রতিরোধ করুন। হিট স্ট্রোক একটি মেডিকেল জরুরি অবস্থা: ব্যক্তিকে ঠান্ডা জায়গায় নিয়ে যান, তার শরীর ঠান্ডা করুন, এবং অবিলম্বে জরুরি সাহায্য নিন।",
  "ta": "வெப்ப பக்கவாதம் என்பது உடல் அதிக வெப்பமடைவதால் ஏற்படும் கடுமையான, உயிருக்கு ஆபத்தான நிலை ஆகும், இது வெப்ப அலைகளின் போது பொதுவானது. வெப்ப சோர்வில் அதிக வியர்வை, பலவீனம், மற்றும் தலைச்சுற்றல் அடங்கும் — வெப்ப பக்கவாதத்தில் அதிக உடல் வெப்பநிலை, குழப்பம், மற்றும் மயக்கம் கூட அடங்கும். நீரேற்றமாக இருப்பது, கடும் வெப்பத்தின் போது வெளிப்புற செயல்பாடுகளைத் தவிர்ப்பது, மற்றும் இலகுவான, தளர்வான ஆடைகளை அணிவது மூலம் தடுக்கவும். வெப்ப பக்கவாதம் ஒரு மருத்துவ அவசரநிலை: நபரை குளிர்ந்த இடத்திற்கு நகர்த்துங்கள், உடலை குளிர்விக்கவும், உடனடியாக அவசர உதவி பெறுங்கள்."
 },
 "Lower Back Pain": {
  "en": "Lower back pain is extremely common and usually improves with simple self-care — though pain that persists needs a proper look. It's often caused by muscle strain from poor posture, heavy lifting, or too much sitting. Prevention means good posture, correct lifting technique, staying active with gentle exercise, and using proper seating. See a doctor if the pain is severe, follows an injury, spreads down your leg with numbness, or lasts more than a few weeks.",
  "hi": "पीठ के निचले हिस्से में दर्द बहुत आम है और आमतौर पर साधारण स्व-देखभाल से ठीक हो जाता है — हालांकि लगातार रहने वाले दर्द की उचित जांच जरूरी है। यह अक्सर खराब मुद्रा, भारी सामान उठाने, या बहुत देर तक बैठने से मांसपेशियों में खिंचाव के कारण होता है। बचाव का मतलब है अच्छी मुद्रा, सही उठाने की तकनीक, हल्के व्यायाम से सक्रिय रहना, और उचित बैठने की व्यवस्था का उपयोग करना। यदि दर्द गंभीर हो, चोट के बाद हो, पैर में सुन्नता के साथ फैले, या कई सप्ताह से अधिक रहे तो डॉक्टर से मिलें।",
  "bn": "পিঠের নিচের অংশে ব্যথা অত্যন্ত সাধারণ এবং সাধারণত সাধারণ স্ব-যত্নে উন্নতি হয় — যদিও স্থায়ী ব্যথার সঠিক পরীক্ষা প্রয়োজন। এটি প্রায়ই খারাপ ভঙ্গি, ভারী জিনিস তোলা, বা দীর্ঘক্ষণ বসে থাকার কারণে পেশির টান থেকে হয়। প্রতিরোধের অর্থ ভালো ভঙ্গি, সঠিক উত্তোলন কৌশল, হালকা ব্যায়ামের মাধ্যমে সক্রিয় থাকা, এবং সঠিক বসার ব্যবস্থা ব্যবহার করা। ব্যথা তীব্র হলে, আঘাতের পরে হলে, পায়ে অসাড়তা নিয়ে ছড়ালে, বা কয়েক সপ্তাহের বেশি স্থায়ী হলে ডাক্তার দেখান।",
  "ta": "முதுகுக் கீழ் வலி மிகவும் பொதுவானது மற்றும் பொதுவாக எளிய சுய பராமரிப்புடன் மேம்படும் — எனினும் தொடரும் வலிக்கு சரியான பரிசோதனை தேவை. இது பெரும்பாலும் மோசமான தோரணை, கனமான பொருட்களைத் தூக்குதல், அல்லது அதிக நேரம் உட்கார்ந்திருப்பதால் தசை இழுப்பு காரணமாக ஏற்படுகிறது. தடுப்பது என்பது நல்ல தோரணை, சரியான தூக்கும் நுட்பம், லேசான உடற்பயிற்சியுடன் சுறுசுறுப்பாக இருப்பது, மற்றும் சரியான உட்காரும் முறையை பயன்படுத்துவது. வலி கடுமையாக இருந்தால், காயத்திற்குப் பின் ஏற்பட்டால், கால் உணர்வின்மையுடன் பரவினால், அல்லது பல வாரங்களுக்கு மேல் நீடித்தால் மருத்துவரை அணுகவும்."
 },
 "Malaria": {
  "en": "Malaria is a mosquito-borne parasitic disease, common across South Asia during and after the rainy season. Watch for fever that comes and goes in cycles, chills, sweating, headache, and body aches. It spreads through the bite of an infected Anopheles mosquito, with higher risk near standing water. To prevent it: sleep under insecticide-treated nets, use repellent and long sleeves after dusk, and clear stagnant water near your home. See a doctor immediately for cyclical fever with chills, especially after time in a malaria-affected area — early treatment prevents severe complications.",
  "hi": "मलेरिया एक मच्छर जनित परजीवी रोग है, जो दक्षिण एशिया में मानसून के दौरान और बाद में आम है। चक्रों में आने-जाने वाला बुखार, ठंड लगना, पसीना आना, सिरदर्द और शरीर में दर्द पर ध्यान दें। यह संक्रमित एनोफिलीज मच्छर के काटने से फैलता है, और रुके हुए पानी के पास जोखिम अधिक होता है। बचाव के लिए: कीटनाशक-उपचारित मच्छरदानी में सोएं, शाम ढलने के बाद रिपेलेंट और लंबी आस्तीन का उपयोग करें, और घर के पास रुका हुआ पानी साफ करें। मलेरिया प्रभावित क्षेत्र में समय बिताने के बाद चक्रीय बुखार और ठंड लगने पर तुरंत डॉक्टर से मिलें — जल्दी उपचार गंभीर जटिलताओं को रोकता है।",
  "bn": "ম্যালেরিয়া একটি মশাবাহিত পরজীবী রোগ, যা দক্ষিণ এশিয়ায় বর্ষাকালে এবং তার পরে সাধারণ। চক্রাকারে আসা-যাওয়া করা জ্বর, ঠান্ডা লাগা, ঘাম, মাথাব্যথা এবং শরীর ব্যথা লক্ষ্য করুন। এটি সংক্রমিত অ্যানোফিলিস মশার কামড়ে ছড়ায়, এবং জমে থাকা পানির কাছে ঝুঁকি বেশি থাকে। প্রতিরোধের জন্য: কীটনাশক-চিকিৎসা করা মশারিতে ঘুমান, সন্ধ্যার পরে রিপেলেন্ট ও লম্বা হাতার কাপড় ব্যবহার করুন, এবং বাড়ির কাছে জমে থাকা পানি পরিষ্কার করুন। ম্যালেরিয়া-আক্রান্ত এলাকায় সময় কাটানোর পরে চক্রাকার জ্বর ও ঠান্ডা লাগলে অবিলম্বে ডাক্তার দেখান — প্রাথমিক চিকিৎসা গুরুতর জটিলতা প্রতিরোধ করে।",
  "ta": "மலேரியா ஒரு கொசு மூலம் பரவும் ஒட்டுண்ணி நோயாகும், இது தென்னாசியாவில் பருவமழையின் போதும் பின்னரும் பொதுவானது. சுழற்சியாக வரும் காய்ச்சல், குளிர், வியர்வை, தலைவலி மற்றும் உடல் வலியை கவனியுங்கள். இது தொற்றுநோய் கொண்ட அனோஃபிலிஸ் கொசுவின் கடியால் பரவுகிறது, தேங்கி நிற்கும் நீர் அருகே ஆபத்து அதிகம். தடுக்க: பூச்சிக்கொல்லி சிகிச்சை அளிக்கப்பட்ட கொசு வலைகளில் தூங்குங்கள், மாலைக்குப் பிறகு விரட்டி மற்றும் நீண்ட கை ஆடைகளைப் பயன்படுத்துங்கள், வீட்டை அருகே தேங்கி நிற்கும் நீரை அகற்றுங்கள். மலேரியா பாதிக்கப்பட்ட பகுதியில் நேரம் செலவிட்ட பின் சுழற்சி காய்ச்சல் மற்றும் குளிருடன் உடனடியாக மருத்துவரை அணுகவும் — முன்கூட்டிய சிகிச்சை கடுமையான சிக்கல்களைத் தடுக்கும்."
 },
 "Typhoid Fever": {
  "en": "Typhoid fever is a bacterial infection spread through contaminated food and water, common where sanitation is limited. Watch for a sustained high fever that rises gradually, weakness, abdominal pain, loss of appetite, and headache. It's caused by Salmonella Typhi bacteria, spread through poor hand hygiene and unsafe water. To prevent it: drink boiled or treated water, wash your hands before eating, avoid unclear street food, and get vaccinated where available. See a doctor for a fever lasting more than three days with abdominal pain — typhoid needs antibiotics and can worsen without treatment.",
  "hi": "टाइफाइड बुखार दूषित भोजन और पानी से फैलने वाला एक बैक्टीरियल संक्रमण है, जो सीमित स्वच्छता वाले क्षेत्रों में आम है। धीरे-धीरे बढ़ने वाला लगातार तेज बुखार, कमजोरी, पेट दर्द, भूख न लगना, और सिरदर्द पर ध्यान दें। यह साल्मोनेला टाइफी बैक्टीरिया के कारण होता है, जो खराब हाथ की स्वच्छता और असुरक्षित पानी से फैलता है। बचाव के लिए: उबला हुआ या सुरक्षित रूप से उपचारित पानी पिएं, खाने से पहले हाथ धोएं, अस्पष्ट स्ट्रीट फूड से बचें, और उपलब्ध होने पर टीका लगवाएं। तीन दिनों से अधिक बुखार के साथ पेट दर्द होने पर डॉक्टर से मिलें — टाइफाइड को एंटीबायोटिक्स की जरूरत होती है और बिना इलाज के बिगड़ सकता है।",
  "bn": "টাইফয়েড জ্বর দূষিত খাবার ও পানি থেকে ছড়ানো একটি ব্যাকটেরিয়াজনিত সংক্রমণ, যা সীমিত স্যানিটেশন রয়েছে এমন এলাকায় সাধারণ। ধীরে ধীরে বেড়ে যাওয়া স্থায়ী তীব্র জ্বর, দুর্বলতা, পেট ব্যথা, ক্ষুধামন্দা, এবং মাথাব্যথা লক্ষ্য করুন। এটি সালমোনেলা টাইফি ব্যাকটেরিয়ার কারণে হয়, যা খারাপ হাতের স্বাস্থ্যবিধি ও অনিরাপদ পানি থেকে ছড়ায়। প্রতিরোধের জন্য: ফুটানো বা নিরাপদভাবে পরিশোধিত পানি পান করুন, খাওয়ার আগে হাত ধুয়ে নিন, অস্পষ্ট রাস্তার খাবার এড়িয়ে চলুন, এবং উপলব্ধ থাকলে টিকা নিন। তিন দিনের বেশি জ্বরের সাথে পেট ব্যথা হলে ডাক্তার দেখান — টাইফয়েডের জন্য অ্যান্টিবায়োটিক প্রয়োজন এবং চিকিৎসা ছাড়া খারাপ হতে পারে।",
  "ta": "டைபாய்டு காய்ச்சல் என்பது அசுத்தமான உணவு மற்றும் நீர் மூலம் பரவும் ஒரு பாக்டீரியா தொற்று ஆகும், இது சுகாதாரம் குறைவான பகுதிகளில் பொதுவானது. படிப்படியாக அதிகரிக்கும் நீடித்த அதிக காய்ச்சல், பலவீனம், வயிற்று வலி, பசியின்மை, மற்றும் தலைவலியை கவனியுங்கள். இது சால்மோனெல்லா டைபி பாக்டீரியாவால் ஏற்படுகிறது, இது மோசமான கை சுகாதாரம் மற்றும் பாதுகாப்பற்ற நீரால் பரவுகிறது. தடுக்க: கொதிக்கவைத்த அல்லது பாதுகாப்பாக சுத்திகரிக்கப்பட்ட நீரைக் குடிக்கவும், உணவுக்கு முன் கைகளைக் கழுவவும், தெளிவற்ற தெரு உணவுகளைத் தவிர்க்கவும், கிடைக்கும்போது தடுப்பூசி போடவும். மூன்று நாட்களுக்கு மேல் காய்ச்சலுடன் வயிற்று வலி இருந்தால் மருத்துவரை அணுகவும் — டைபாய்டுக்கு நுண்ணுயிர் எதிர்ப்பிகள் தேவை, சிகிச்சை இல்லாமல் மோசமடையலாம்."
 },
 "Tuberculosis (TB)": {
  "en": "Tuberculosis is a bacterial infection that most often affects the lungs, spreading through the air when an infected person coughs. Watch for a persistent cough lasting more than two weeks, coughing up blood, chest pain, unexplained weight loss, and night sweats. Risk rises with malnutrition, HIV, diabetes, or crowded living conditions. To prevent it: complete any treatment fully to avoid drug resistance, ensure good ventilation indoors, and cover coughs. See a doctor for a cough over two weeks, especially with weight loss — free TB testing and treatment is available through national programmes.",
  "hi": "तपेदिक एक बैक्टीरियल संक्रमण है जो अक्सर फेफड़ों को प्रभावित करता है और संक्रमित व्यक्ति के खांसने पर हवा से फैलता है। यह उपचार योग्य और ठीक होने योग्य है जब पूरा कोर्स पूरा किया जाए। दो सप्ताह से अधिक लगातार खांसी, खून या बलगम आना, छाती में दर्द, अस्पष्ट वजन घटना, और रात को पसीना आना पर ध्यान दें। कुपोषण, एचआईवी, डायबिटीज, या भीड़भाड़ वाली रहने की स्थिति के साथ जोखिम बढ़ता है। बचाव के लिए: यदि निदान हो तो दवा का पूरा कोर्स पूरा करें ताकि दवा-प्रतिरोधी टीबी से बचा जा सके, साझा रहने की जगहों में अच्छा वेंटिलेशन रखें, और खांसते समय मुंह ढकें। दो सप्ताह से अधिक खांसी होने पर, विशेष रूप से वजन घटने या रात को पसीना आने के साथ, डॉक्टर से मिलें — राष्ट्रीय टीबी कार्यक्रमों के माध्यम से मुफ्त जांच और उपचार उपलब्ध है।",
  "bn": "যক্ষ্মা একটি ব্যাকটেরিয়াজনিত সংক্রমণ যা প্রায়ই ফুসফুসকে প্রভাবিত করে এবং সংক্রমিত ব্যক্তির কাশির মাধ্যমে বাতাসে ছড়ায়। পুরো কোর্স সম্পূর্ণ করলে এটি চিকিৎসাযোগ্য ও নিরাময়যোগ্য। দুই সপ্তাহের বেশি স্থায়ী কাশি, রক্ত বা কফ ওঠা, বুকে ব্যথা, অব্যাখ্যাত ওজন হ্রাস, এবং রাতে ঘাম লক্ষ্য করুন। অপুষ্টি, এইচআইভি, ডায়াবেটিস, বা ঘিঞ্জি বসবাসের পরিস্থিতিতে ঝুঁকি বাড়ে। প্রতিরোধের জন্য: নির্ণয় হলে ওষুধ-প্রতিরোধী যক্ষ্মা এড়াতে ওষুধের পুরো কোর্স সম্পূর্ণ করুন, ভাগ করা বসবাসের জায়গায় ভালো বায়ুচলাচল রাখুন, এবং কাশির সময় মুখ ঢেকে রাখুন। দুই সপ্তাহের বেশি কাশি হলে, বিশেষত ওজন হ্রাস বা রাতে ঘামের সাথে, ডাক্তার দেখান — জাতীয় যক্ষ্মা কর্মসূচির মাধ্যমে বিনামূল্যে পরীক্ষা ও চিকিৎসা পাওয়া যায়।",
  "ta": "காசநோய் என்பது பெரும்பாலும் நுரையீரலை பாதிக்கும் ஒரு பாக்டீரியா தொற்று ஆகும், இது தொற்றுநோய் கொண்ட நபர் இருமும்போது காற்றின் மூலம் பரவுகிறது. முழு சிகிச்சை முறையை முடித்தால் இது சிகிச்சையளிக்கக்கூடியது மற்றும் குணப்படுத்தக்கூடியது. இரண்டு வாரங்களுக்கு மேல் நீடிக்கும் இருமல், இரத்தம் அல்லது சளி வருதல், மார்பு வலி, விளக்கமற்ற எடை இழப்பு, மற்றும் இரவு வியர்வையை கவனியுங்கள். ஊட்டச்சத்து குறைபாடு, எச்.ஐ.வி, நீரிழிவு, அல்லது நெரிசலான வாழ்க்கை சூழ்நிலைகளுடன் ஆபத்து அதிகரிக்கிறது. தடுக்க: கண்டறியப்பட்டால் மருந்து எதிர்ப்பு காசநோயைத் தவிர்க்க முழு மருந்து சிகிச்சையையும் முடிக்கவும், பகிரப்பட்ட வாழ்விட இடங்களில் நல்ல காற்றோட்டத்தை பராமரிக்கவும், இருமும்போது வாயை மூடவும். இரண்டு வாரங்களுக்கு மேல் இருமல் இருந்தால், குறிப்பாக எடை இழப்பு அல்லது இரவு வியர்வையுடன், மருத்துவரை அணுகவும் — தேசிய காசநோய் திட்டங்கள் மூலம் இலவச பரிசோதனை மற்றும் சிகிச்சை கிடைக்கிறது."
 },
 "Asthma": {
  "en": "Asthma is a chronic condition that narrows and inflames the airways, causing recurring breathing difficulty — but it can be well controlled. Watch for wheezing, shortness of breath, chest tightness, and coughing at night or early morning. Common triggers include dust, pollen, smoke, cold air, and infections. To manage it: identify your personal triggers, use prescribed inhalers as directed, and keep living spaces free of dust and smoke. See a doctor if wheezing or breathlessness is frequent, or if you need a rescue inhaler more than twice a week — your asthma control may need adjusting.",
  "hi": "अस्थमा एक दीर्घकालिक स्थिति है जो वायुमार्ग को संकरा और सूजा देती है, जिससे सांस लेने में बार-बार कठिनाई होती है — लेकिन सही प्रबंधन योजना से इसे अच्छी तरह नियंत्रित किया जा सकता है। सांस की सीटी, सांस फूलना, छाती में जकड़न, और रात या सुबह जल्दी खांसी पर ध्यान दें। धूल, पराग, या धुएं जैसे एलर्जन, ठंडी हवा या अचानक मौसम परिवर्तन, श्वसन संक्रमण, और शारीरिक परिश्रम सामान्य ट्रिगर हैं। प्रबंधन के लिए: अपने व्यक्तिगत ट्रिगर की पहचान करें और बचें, निर्देशानुसार निर्धारित इनहेलर का उपयोग करें, और रहने की जगह को धूल और धुएं से मुक्त रखें। यदि बार-बार सांस फूलना या घरघराहट हो, या सप्ताह में दो बार से अधिक रेस्क्यू इनहेलर की जरूरत पड़े तो डॉक्टर से मिलें — आपके अस्थमा नियंत्रण को समायोजन की जरूरत हो सकती है।",
  "bn": "হাঁপানি একটি দীর্ঘস্থায়ী অবস্থা যা শ্বাসনালীকে সংকীর্ণ ও প্রদাহিত করে, বারবার শ্বাসকষ্ট সৃষ্টি করে — তবে সঠিক ব্যবস্থাপনা পরিকল্পনায় এটি ভালোভাবে নিয়ন্ত্রণ করা যায়। শ্বাসের শিস, শ্বাসকষ্ট, বুকে চাপ, এবং রাতে বা ভোরে কাশি লক্ষ্য করুন। ধুলো, পরাগ, বা ধোঁয়ার মতো অ্যালার্জেন, ঠান্ডা বাতাস বা হঠাৎ আবহাওয়া পরিবর্তন, শ্বাসযন্ত্রের সংক্রমণ, এবং শারীরিক পরিশ্রম সাধারণ ট্রিগার। ব্যবস্থাপনার জন্য: আপনার ব্যক্তিগত ট্রিগার চিহ্নিত করে এড়িয়ে চলুন, নির্দেশ অনুযায়ী নির্ধারিত ইনহেলার ব্যবহার করুন, এবং বসবাসের জায়গা ধুলো ও ধোঁয়ামুক্ত রাখুন। ঘন ঘন শ্বাসকষ্ট বা শিস দিলে, বা সপ্তাহে দুইবারের বেশি রেসকিউ ইনহেলারের প্রয়োজন হলে ডাক্তার দেখান — আপনার হাঁপানি নিয়ন্ত্রণ সমন্বয়ের প্রয়োজন হতে পারে।",
  "ta": "ஆஸ்துமா என்பது சுவாசக் குழாய்களை குறுகலாக்கி வீக்கமடையச் செய்யும் ஒரு நீண்டகால நிலை ஆகும், இது மீண்டும் மீண்டும் சுவாச சிரமத்தை ஏற்படுத்துகிறது — ஆனால் சரியான மேலாண்மை திட்டத்துடன் இதை நன்கு கட்டுப்படுத்தலாம். விசில் சத்தம், மூச்சுத் திணறல், மார்பு இறுக்கம், மற்றும் இரவு அல்லது அதிகாலையில் இருமலை கவனியுங்கள். தூசி, மகரந்தம், அல்லது புகை போன்ற ஒவ்வாமைகள், குளிர் காற்று அல்லது திடீர் வானிலை மாற்றங்கள், சுவாச தொற்றுகள், மற்றும் உடல் உழைப்பு பொதுவான தூண்டுதல்கள். நிர்வகிக்க: உங்கள் தனிப்பட்ட தூண்டுதல்களை அடையாளம் கண்டு தவிர்க்கவும், பரிந்துரைக்கப்பட்ட இன்ஹேலர்களை வழிமுறைப்படி பயன்படுத்தவும், வாழ்விட இடங்களை தூசி மற்றும் புகையிலிருந்து விடுவிக்கவும். அடிக்கடி மூச்சுத் திணறல் அல்லது விசில் சத்தம் இருந்தால், அல்லது வாரத்திற்கு இரண்டு முறைக்கு மேல் ரெஸ்க்யூ இன்ஹேலர் தேவைப்பட்டால் மருத்துவரை அணுகவும் — உங்கள் ஆஸ்துமா கட்டுப்பாட்டை சரிசெய்ய வேண்டியிருக்கலாம்."
 },
 "Migraine": {
  "en": "Migraine is a neurological condition causing recurrent, often severe headaches, frequently with nausea and sensitivity to light or sound. Watch for throbbing pain usually on one side of the head, nausea, and in some cases visual disturbances before the headache starts. Common triggers include stress, irregular sleep, skipped meals, and hormonal changes. To manage it: keep a regular sleep and meal schedule, identify your personal triggers, and stay hydrated. See a doctor if headaches are frequent, severe, or different from your usual pattern, or interfere significantly with daily life.",
  "hi": "माइग्रेन एक न्यूरोलॉजिकल स्थिति है जो बार-बार, अक्सर गंभीर सिरदर्द का कारण बनती है, जिसके साथ अक्सर मतली और रोशनी या आवाज के प्रति संवेदनशीलता होती है। सिर के एक तरफ धड़कता दर्द, मतली या उल्टी, और कुछ मामलों में सिरदर्द शुरू होने से पहले दृश्य गड़बड़ी पर ध्यान दें। सामान्य ट्रिगर में तनाव, अनियमित नींद, छूटा हुआ भोजन, और हार्मोनल बदलाव शामिल हैं। प्रबंधन के लिए: नियमित नींद और भोजन का समय रखें, अपने व्यक्तिगत ट्रिगर की पहचान करें, और हाइड्रेटेड रहें। यदि सिरदर्द बार-बार, गंभीर, या आपके सामान्य पैटर्न से अलग हों, या दैनिक जीवन में काफी बाधा डालें तो डॉक्टर से मिलें।",
  "bn": "মাইগ্রেন একটি স্নায়বিক অবস্থা যা বারবার, প্রায়ই তীব্র মাথাব্যথার কারণ হয়, প্রায়শই বমি বমি ভাব এবং আলো বা শব্দের প্রতি সংবেদনশীলতার সাথে। মাথার একপাশে স্পন্দনশীল ব্যথা, বমি বমি ভাব বা বমি, এবং কিছু ক্ষেত্রে মাথাব্যথা শুরুর আগে দৃষ্টি বিভ্রম লক্ষ্য করুন। সাধারণ ট্রিগারের মধ্যে রয়েছে চাপ, অনিয়মিত ঘুম, বাদ দেওয়া খাবার, এবং হরমোনের পরিবর্তন। ব্যবস্থাপনার জন্য: নিয়মিত ঘুম ও খাবারের সময় রাখুন, আপনার ব্যক্তিগত ট্রিগার চিহ্নিত করুন, এবং হাইড্রেটেড থাকুন। মাথাব্যথা ঘন ঘন, তীব্র, বা আপনার স্বাভাবিক প্যাটার্ন থেকে ভিন্ন হলে, বা দৈনন্দিন জীবনে যথেষ্ট বাধা দিলে ডাক্তার দেখান।",
  "ta": "மைக்ரேன் என்பது மீண்டும் மீண்டும், பெரும்பாலும் கடுமையான தலைவலியை ஏற்படுத்தும் ஒரு நரம்பியல் நிலை ஆகும், இது பெரும்பாலும் குமட்டல் மற்றும் ஒளி அல்லது சத்தத்திற்கான உணர்திறனுடன் வருகிறது. தலையின் ஒரு பக்கத்தில் துடிக்கும் வலி, குமட்டல் அல்லது வாந்தி, மற்றும் சில நேரங்களில் தலைவலி தொடங்குவதற்கு முன் பார்வைக் கோளாறுகளை கவனியுங்கள். பொதுவான தூண்டுதல்களில் மன அழுத்தம், ஒழுங்கற்ற தூக்கம், தவிர்க்கப்பட்ட உணவு, மற்றும் ஹார்மோன் மாற்றங்கள் அடங்கும். நிர்வகிக்க: வழக்கமான தூக்கம் மற்றும் உணவு நேரத்தை பராமரிக்கவும், உங்கள் தனிப்பட்ட தூண்டுதல்களை அடையாளம் காணவும், நீரேற்றமாக இருக்கவும். தலைவலி அடிக்கடி, கடுமையாக, அல்லது உங்கள் வழக்கமான முறையிலிருந்து வேறுபட்டால், அல்லது அன்றாட வாழ்க்கையை கணிசமாக பாதித்தால் மருத்துவரை அணுகவும்."
 },
 "Stroke": {
  "en": "A stroke happens when blood supply to part of the brain is interrupted, damaging brain tissue — it's a medical emergency where every minute matters. Watch for sudden weakness or numbness on one side of the body, confusion, trouble speaking, vision problems, or loss of balance. Risk rises with high blood pressure, diabetes, smoking, and high cholesterol. To prevent it: control blood pressure and blood sugar, avoid smoking, and exercise regularly. Call emergency services immediately for any sudden weakness, confusion, vision loss, or slurred speech — fast treatment saves lives and reduces disability.",
  "hi": "स्ट्रोक तब होता है जब मस्तिष्क के किसी हिस्से में रक्त की आपूर्ति बाधित हो जाती है, जिससे मस्तिष्क के ऊतकों को नुकसान पहुंचता है — यह एक चिकित्सा आपातकाल है जहां तेज कार्रवाई जान बचाती है और विकलांगता कम करती है। शरीर के एक तरफ अचानक कमजोरी या सुन्नता, अचानक भ्रम या बोलने में परेशानी, अचानक दृष्टि समस्याएं, अचानक गंभीर सिरदर्द, और संतुलन खोने पर ध्यान दें। उच्च रक्तचाप, डायबिटीज, धूम्रपान, और उच्च कोलेस्ट्रॉल से जोखिम बढ़ता है। बचाव के लिए: रक्तचाप और रक्त शर्करा नियंत्रित करें, धूम्रपान से बचें, और नियमित व्यायाम करें। अचानक कमजोरी, भ्रम, दृष्टि हानि, या धीमी बोली के लिए तुरंत आपातकालीन सेवाओं को कॉल करें — स्ट्रोक उपचार में हर मिनट मायने रखता है।",
  "bn": "স্ট্রোক তখন হয় যখন মস্তিষ্কের কোনো অংশে রক্ত সরবরাহ বাধাগ্রস্ত হয়, মস্তিষ্কের টিস্যুর ক্ষতি করে — এটি একটি মেডিকেল জরুরি অবস্থা যেখানে দ্রুত পদক্ষেপ জীবন বাঁচায় এবং অক্ষমতা কমায়। শরীরের একপাশে হঠাৎ দুর্বলতা বা অসাড়তা, হঠাৎ বিভ্রান্তি বা কথা বলতে অসুবিধা, হঠাৎ দৃষ্টি সমস্যা, হঠাৎ তীব্র মাথাব্যথা, এবং ভারসাম্য হারানো লক্ষ্য করুন। উচ্চ রক্তচাপ, ডায়াবেটিস, ধূমপান, এবং উচ্চ কোলেস্টেরলের সাথে ঝুঁকি বাড়ে। প্রতিরোধের জন্য: রক্তচাপ ও রক্তে শর্করা নিয়ন্ত্রণ করুন, ধূমপান এড়িয়ে চলুন, এবং নিয়মিত ব্যায়াম করুন। হঠাৎ দুর্বলতা, বিভ্রান্তি, দৃষ্টি হারানো, বা অস্পষ্ট কথার জন্য অবিলম্বে জরুরি সেবায় কল করুন — স্ট্রোক চিকিৎসায় প্রতিটি মিনিট গুরুত্বপূর্ণ।",
  "ta": "மூளைக்கு இரத்த ஓட்டம் தடைபடும்போது பக்கவாதம் ஏற்படுகிறது, இது மூளை திசுக்களை சேதப்படுத்துகிறது — இது ஒரு மருத்துவ அவசரநிலை, இங்கு விரைவான நடவடிக்கை உயிர்களைக் காப்பாற்றி ஊனத்தை குறைக்கிறது. உடலின் ஒரு பக்கத்தில் திடீர் பலவீனம் அல்லது உணர்வின்மை, திடீர் குழப்பம் அல்லது பேச்சு சிரமம், திடீர் பார்வைப் பிரச்சினைகள், திடீர் கடுமையான தலைவலி, மற்றும் சமநிலை இழப்பை கவனியுங்கள். உயர் இரத்த அழுத்தம், நீரிழிவு, புகைபிடித்தல், மற்றும் அதிக கொலஸ்ட்ரால் ஆகியவற்றுடன் ஆபத்து அதிகரிக்கிறது. தடுக்க: இரத்த அழுத்தம் மற்றும் இரத்த சர்க்கரையை கட்டுப்படுத்தவும், புகைபிடித்தலைத் தவிர்க்கவும், தொடர்ந்து உடற்பயிற்சி செய்யவும். திடீர் பலவீனம், குழப்பம், பார்வை இழப்பு, அல்லது தடுமாறிய பேச்சுக்கு உடனடியாக அவசர சேவைகளை அழைக்கவும் — பக்கவாத சிகிச்சையில் ஒவ்வொரு நிமிடமும் முக்கியம்."
 },
 "Gestational Diabetes": {
  "en": "Gestational diabetes is high blood sugar that develops during pregnancy, usually resolving after delivery, but it needs monitoring to protect mother and baby. It often causes no noticeable symptoms, though some notice increased thirst or fatigue. Risk is higher with overweight before pregnancy, family history of diabetes, or older maternal age. Management means following a balanced diet as advised, staying active as approved for pregnancy, and attending all scheduled glucose screening tests. See a doctor promptly if you notice unusual thirst or fatigue during pregnancy, and never skip a recommended screening appointment.",
  "hi": "गर्भावधि मधुमेह गर्भावस्था के दौरान विकसित होने वाला उच्च रक्त शर्करा है और आमतौर पर प्रसव के बाद ठीक हो जाता है, लेकिन मां और बच्चे की सुरक्षा के लिए निगरानी की जरूरत होती है। अक्सर कोई ध्यान देने योग्य लक्षण नहीं होते, हालांकि कुछ मामलों में अधिक प्यास और थकान हो सकती है। गर्भावस्था से पहले अधिक वजन, डायबिटीज का पारिवारिक इतिहास, और अधिक उम्र में गर्भधारण से जोखिम बढ़ता है। प्रबंधन का मतलब है सलाह अनुसार संतुलित आहार लेना, गर्भावस्था के लिए अनुमोदित शारीरिक गतिविधि करना, और सभी निर्धारित ग्लूकोज जांच में शामिल होना। गर्भावस्था के दौरान असामान्य प्यास या थकान महसूस होने पर तुरंत डॉक्टर से मिलें, और किसी भी सुझाई गई जांच अपॉइंटमेंट को न छोड़ें।",
  "bn": "গর্ভকালীন ডায়াবেটিস গর্ভাবস্থায় বিকশিত উচ্চ রক্তে শর্করা এবং সাধারণত প্রসবের পরে সেরে যায়, তবে মা ও শিশুকে রক্ষা করতে পর্যবেক্ষণ প্রয়োজন। প্রায়ই কোনো লক্ষণীয় উপসর্গ থাকে না, যদিও কিছু ক্ষেত্রে বেশি তৃষ্ণা ও ক্লান্তি দেখা দিতে পারে। গর্ভাবস্থার আগে অতিরিক্ত ওজন, ডায়াবেটিসের পারিবারিক ইতিহাস, এবং বয়স্ক মাতৃ বয়সে ঝুঁকি বাড়ে। ব্যবস্থাপনার অর্থ পরামর্শ অনুযায়ী সুষম খাদ্য গ্রহণ, গর্ভাবস্থার জন্য অনুমোদিত শারীরিক কার্যকলাপে সক্রিয় থাকা, এবং সকল নির্ধারিত গ্লুকোজ স্ক্রিনিং টেস্টে উপস্থিত থাকা। গর্ভাবস্থায় অস্বাভাবিক তৃষ্ণা বা ক্লান্তি অনুভব করলে অবিলম্বে ডাক্তার দেখান, এবং কোনো প্রস্তাবিত স্ক্রিনিং অ্যাপয়েন্টমেন্ট মিস করবেন না।",
  "ta": "கர்ப்பகால நீரிழிவு என்பது கர்ப்ப காலத்தில் உருவாகும் அதிக இரத்த சர்க்கரை ஆகும், பொதுவாக பிரசவத்திற்குப் பிறகு சரியாகிவிடும், ஆனால் தாய் மற்றும் குழந்தையைப் பாதுகாக்க கண்காணிப்பு தேவை. பெரும்பாலும் கவனிக்கத்தக்க அறிகுறிகள் இல்லை, எனினும் சிலருக்கு அதிக தாகம் மற்றும் சோர்வு ஏற்படலாம். கர்ப்பத்திற்கு முன் அதிக எடை, நீரிழிவு குடும்ப வரலாறு, மற்றும் அதிக வயதில் கர்ப்பம் ஆகியவற்றுடன் ஆபத்து அதிகரிக்கிறது. நிர்வகிப்பது என்பது ஆலோசனைப்படி சமச்சீர் உணவை பின்பற்றுவது, கர்ப்பத்திற்கு அங்கீகரிக்கப்பட்ட உடல் செயல்பாட்டில் சுறுசுறுப்பாக இருப்பது, மற்றும் அனைத்து திட்டமிடப்பட்ட குளுக்கோஸ் பரிசோதனைகளிலும் கலந்துகொள்வது. கர்ப்ப காலத்தில் அசாதாரண தாகம் அல்லது சோர்வு உணர்ந்தால் உடனடியாக மருத்துவரை அணுகவும், பரிந்துரைக்கப்பட்ட பரிசோதனை சந்திப்புகளை தவிர்க்க வேண்டாம்."
 },
 "Preeclampsia": {
  "en": "Preeclampsia is a pregnancy complication marked by high blood pressure and signs of organ stress, usually appearing after twenty weeks. Watch for high blood pressure, swelling of the face and hands, severe headache, vision changes, and upper abdominal pain. Risk is higher with a first pregnancy, a history of high blood pressure, or carrying twins. Attending all antenatal check-ups for blood pressure monitoring is the most important protection, along with reporting symptoms promptly. Seek immediate medical care for severe headache, vision changes, or upper abdominal pain during pregnancy — these can signal preeclampsia and need urgent attention.",
  "hi": "प्रीक्लेम्पसिया एक गर्भावस्था जटिलता है जिसमें उच्च रक्तचाप और अंग तनाव के संकेत होते हैं, जो आमतौर पर बीस सप्ताह के बाद दिखाई देती है। इसके लिए तुरंत चिकित्सा ध्यान देने की आवश्यकता होती है। उच्च रक्तचाप, चेहरे और हाथों में सूजन, गंभीर सिरदर्द, दृष्टि में बदलाव, और ऊपरी पेट दर्द पर ध्यान दें। पहली गर्भावस्था, उच्च रक्तचाप का इतिहास, या जुड़वां गर्भावस्था से जोखिम अधिक होता है। रक्तचाप की निगरानी के लिए सभी प्रसवपूर्व जांच में शामिल होना, और सूजन, सिरदर्द, या दृष्टि परिवर्तन की तुरंत रिपोर्ट करना सबसे महत्वपूर्ण सुरक्षा है। गर्भावस्था के दौरान गंभीर सिरदर्द, दृष्टि परिवर्तन, या ऊपरी पेट दर्द के लिए तुरंत चिकित्सा देखभाल लें — ये प्रीक्लेम्पसिया का संकेत दे सकते हैं।",
  "bn": "প্রিএক্লাম্পসিয়া একটি গর্ভাবস্থার জটিলতা যা উচ্চ রক্তচাপ এবং অঙ্গের চাপের লক্ষণ নিয়ে আসে, সাধারণত বিশ সপ্তাহের পরে দেখা দেয়। এর জন্য দ্রুত চিকিৎসা মনোযোগ প্রয়োজন। উচ্চ রক্তচাপ, মুখ ও হাতে ফোলাভাব, তীব্র মাথাব্যথা, দৃষ্টি পরিবর্তন, এবং উপরের পেটে ব্যথা লক্ষ্য করুন। প্রথম গর্ভাবস্থা, উচ্চ রক্তচাপের ইতিহাস, বা যমজ গর্ভাবস্থায় ঝুঁকি বেশি। রক্তচাপ পর্যবেক্ষণের জন্য সকল প্রসবপূর্ব চেকআপে উপস্থিত থাকা, এবং ফোলাভাব, মাথাব্যথা, বা দৃষ্টি পরিবর্তন অবিলম্বে জানানো সবচেয়ে গুরুত্বপূর্ণ সুরক্ষা। গর্ভাবস্থায় তীব্র মাথাব্যথা, দৃষ্টি পরিবর্তন, বা উপরের পেটে ব্যথার জন্য অবিলম্বে চিকিৎসা নিন — এগুলো প্রিএক্লাম্পসিয়ার লক্ষণ হতে পারে।",
  "ta": "ப்ரீஎக்ளாம்ப்சியா என்பது உயர் இரத்த அழுத்தம் மற்றும் உறுப்பு அழுத்த அறிகுறிகளுடன் கூடிய ஒரு கர்ப்பகால சிக்கலாகும், பொதுவாக இருபது வாரங்களுக்குப் பிறகு தோன்றும். இதற்கு உடனடி மருத்துவ கவனம் தேவை. உயர் இரத்த அழுத்தம், முகம் மற்றும் கைகளில் வீக்கம், கடுமையான தலைவலி, பார்வை மாற்றங்கள், மற்றும் மேல்வயிற்று வலியை கவனியுங்கள். முதல் கர்ப்பம், உயர் இரத்த அழுத்த வரலாறு, அல்லது இரட்டையர் கர்ப்பத்துடன் ஆபத்து அதிகம். இரத்த அழுத்த கண்காணிப்புக்காக அனைத்து கர்ப்பகால பரிசோதனைகளிலும் கலந்துகொள்வதும், வீக்கம், தலைவலி, அல்லது பார்வை மாற்றங்களை உடனடியாக தெரிவிப்பதும் மிக முக்கியமான பாதுகாப்பு. கர்ப்ப காலத்தில் கடுமையான தலைவலி, பார்வை மாற்றங்கள், அல்லது மேல்வயிற்று வலிக்கு உடனடியாக மருத்துவ உதவி பெறுங்கள் — இவை ப்ரீஎக்ளாம்ப்சியாவைக் குறிக்கலாம்."
 },
 "Postnatal Care": {
  "en": "Postnatal care covers the health checks and support a mother and newborn need in the weeks after birth, to catch complications early and support recovery. This includes checks on the mother's bleeding and recovery, the newborn's weight and feeding, and starting the immunization schedule. At home: rest and accept help, eat a nutritious diet while breastfeeding, and watch for signs of postpartum depression. Attend every scheduled follow-up visit. Seek care promptly for heavy bleeding, high fever, severe pain, or if the baby is feeding poorly or unusually lethargic.",
  "hi": "प्रसवोत्तर देखभाल में जन्म के बाद के हफ्तों में मां और नवजात शिशु को जरूरी स्वास्थ्य जांच और सहायता शामिल है, ताकि जटिलताओं को जल्दी पकड़ा जा सके और रिकवरी में मदद मिले। इसमें मां की रिकवरी और रक्तस्राव की नियमित जांच, नवजात के वजन और भोजन की जांच, संक्रमण के संकेतों की निगरानी, और स्तनपान सहायता शामिल है। जन्म के बाद पहले सप्ताह के भीतर एक जांच, उसके बाद के हफ्तों में फॉलो-अप, और नवजात का टीकाकरण शुरू करना अनुशंसित है। घर पर: आराम करें और घरेलू कामों में मदद स्वीकार करें, स्तनपान के दौरान पौष्टिक आहार लें, और प्रसवोत्तर डिप्रेशन के संकेतों पर ध्यान दें। भारी रक्तस्राव, तेज बुखार, गंभीर दर्द, या बच्चे के खराब भोजन या असामान्य सुस्ती के लिए तुरंत देखभाल लें।",
  "bn": "প্রসবোত্তর যত্নে জন্মের পরের সপ্তাহগুলিতে মা ও নবজাতকের প্রয়োজনীয় স্বাস্থ্য পরীক্ষা ও সহায়তা অন্তর্ভুক্ত, যাতে জটিলতা দ্রুত ধরা পড়ে এবং পুনরুদ্ধারে সহায়তা হয়। এর মধ্যে মায়ের পুনরুদ্ধার ও রক্তপাতের নিয়মিত পরীক্ষা, নবজাতকের ওজন ও খাওয়ানোর পরীক্ষা, সংক্রমণের লক্ষণ পর্যবেক্ষণ, এবং স্তন্যপান সহায়তা অন্তর্ভুক্ত। জন্মের পরে প্রথম সপ্তাহের মধ্যে একটি চেকআপ, পরবর্তী সপ্তাহগুলিতে ফলো-আপ, এবং নবজাতকের টিকাদান শুরু করা সুপারিশ করা হয়। বাড়িতে: বিশ্রাম নিন এবং গৃহস্থালি কাজে সাহায্য গ্রহণ করুন, স্তন্যপানের সময় পুষ্টিকর খাবার খান, এবং প্রসবোত্তর বিষণ্নতার লক্ষণ লক্ষ্য রাখুন। প্রচুর রক্তপাত, তীব্র জ্বর, তীব্র ব্যথা, বা শিশুর খারাপ খাওয়ানো বা অস্বাভাবিক নিস্তেজতার জন্য অবিলম্বে যত্ন নিন।",
  "ta": "பிரசவத்திற்குப் பிந்தைய பராமரிப்பு என்பது பிறப்புக்குப் பின் வாரங்களில் தாய் மற்றும் குழந்தைக்குத் தேவையான சுகாதார பரிசோதனைகள் மற்றும் ஆதரவை உள்ளடக்கியது, சிக்கல்களை முன்கூட்டியே கண்டறிந்து மீட்சிக்கு உதவுகிறது. இதில் தாயின் மீட்சி மற்றும் இரத்தப்போக்கு பரிசோதனைகள், குழந்தையின் எடை மற்றும் உணவளித்தல் பரிசோதனைகள், தொற்றின் அறிகுறிகளைக் கண்காணித்தல், மற்றும் தாய்ப்பால் ஆதரவு அடங்கும். பிறப்புக்குப் பின் முதல் வாரத்தில் ஒரு பரிசோதனையும், அடுத்த வாரங்களில் தொடர் வருகைகளும், குழந்தையின் தடுப்பூசி திட்டம் தொடங்குவதும் பரிந்துரைக்கப்படுகிறது. வீட்டில்: ஓய்வெடுங்கள், வீட்டு வேலைகளுக்கு உதவி பெறுங்கள், தாய்ப்பாலூட்டும் போது ஊட்டச்சத்து மிக்க உணவை உண்ணுங்கள், பிரசவத்திற்குப் பிந்தைய மனச்சோர்வு அறிகுறிகளைக் கவனியுங்கள். அதிக இரத்தப்போக்கு, அதிக காய்ச்சல், கடுமையான வலி, அல்லது குழந்தை சரியாக உணவு உண்ணாமை அல்லது அசாதாரண சோர்வுக்கு உடனடியாக பராமரிப்பு பெறுங்கள்."
 },
 "Fever in Children": {
  "en": "Fever in children is usually a sign the body is fighting an infection, and most fevers are not dangerous on their own. Watch for a temperature above 38 degrees Celsius, irritability, reduced activity, and reduced appetite. Common causes include viral infections, bacterial infections, teething, and post-vaccination responses. At home: keep the child hydrated, dress them lightly, and use paracetamol as directed if they're uncomfortable. See a doctor if fever is above 39.5 degrees, lasts more than three days, or comes with a rash, stiff neck, difficulty breathing, or unusual drowsiness.",
  "hi": "बच्चों में बुखार आमतौर पर यह संकेत है कि शरीर संक्रमण से लड़ रहा है, और अधिकांश बुखार अपने आप में खतरनाक नहीं होते। 38 डिग्री सेल्सियस से ऊपर शरीर का तापमान, चिड़चिड़ापन या कम गतिविधि, कम भूख, और पसीना या ठंड लगना पर ध्यान दें। सामान्य कारणों में वायरल संक्रमण जैसे सर्दी या फ्लू, बैक्टीरियल संक्रमण, दांत निकलना, और टीकाकरण के बाद की प्रतिक्रिया शामिल है। घरेलू देखभाल: बच्चे को हाइड्रेटेड रखें, हल्के कपड़े पहनाएं, यदि बच्चा असहज हो तो स्वास्थ्यकर्मी के निर्देशानुसार पैरासिटामोल दें, और तापमान की नियमित निगरानी करें। यदि बुखार 39.5 डिग्री से ऊपर हो, तीन दिनों से अधिक रहे, या दाने, गर्दन में अकड़न, सांस लेने में कठिनाई, या असामान्य नींद के साथ हो तो डॉक्टर से मिलें।",
  "bn": "শিশুদের জ্বর সাধারণত এই লক্ষণ যে শরীর সংক্রমণের বিরুদ্ধে লড়াই করছে, এবং বেশিরভাগ জ্বর নিজে থেকে বিপজ্জনক নয়। ৩৮ ডিগ্রি সেলসিয়াসের উপরে শরীরের তাপমাত্রা, খিটখিটে ভাব বা কম কার্যকলাপ, ক্ষুধা কমে যাওয়া, এবং ঘাম বা ঠান্ডা লাগা লক্ষ্য করুন। সাধারণ কারণের মধ্যে রয়েছে সর্দি বা ফ্লুর মতো ভাইরাস সংক্রমণ, ব্যাকটেরিয়া সংক্রমণ, দাঁত ওঠা, এবং টিকাদানের পরে প্রতিক্রিয়া। বাড়িতে যত্ন: শিশুকে হাইড্রেটেড রাখুন, হালকা পোশাক পরান, শিশু অস্বস্তি বোধ করলে স্বাস্থ্যকর্মীর নির্দেশ অনুযায়ী প্যারাসিটামল দিন, এবং তাপমাত্রা নিয়মিত পর্যবেক্ষণ করুন। জ্বর ৩৯.৫ ডিগ্রির উপরে হলে, তিন দিনের বেশি স্থায়ী হলে, বা ফুসকুড়ি, ঘাড় শক্ত হওয়া, শ্বাসকষ্ট, বা অস্বাভাবিক ঝিমুনির সাথে হলে ডাক্তার দেখান।",
  "ta": "குழந்தைகளில் காய்ச்சல் பொதுவாக உடல் தொற்றுக்கு எதிராக போராடுவதைக் குறிக்கிறது, மேலும் பெரும்பாலான காய்ச்சல்கள் தாமாகவே ஆபத்தானவை அல்ல. 38 டிகிரி செல்சியஸுக்கு மேல் உடல் வெப்பநிலை, எரிச்சல் அல்லது குறைந்த செயல்பாடு, குறைந்த பசி, மற்றும் வியர்வை அல்லது குளிர் ஆகியவற்றை கவனியுங்கள். பொதுவான காரணங்களில் சளி அல்லது காய்ச்சல் போன்ற வைரஸ் தொற்றுகள், பாக்டீரியா தொற்றுகள், பல் முளைத்தல், மற்றும் தடுப்பூசிக்குப் பின் எதிர்வினை அடங்கும். வீட்டு பராமரிப்பு: குழந்தையை நீரேற்றமாக வைத்திருங்கள், இலகுவான ஆடைகளை அணிவியுங்கள், குழந்தை சங்கடமாக இருந்தால் சுகாதார பணியாளரின் அறிவுறுத்தலின்படி பாராசிட்டமால் கொடுங்கள், வெப்பநிலையை தொடர்ந்து கண்காணியுங்கள். காய்ச்சல் 39.5 டிகிரிக்கு மேல் இருந்தால், மூன்று நாட்களுக்கு மேல் நீடித்தால், அல்லது தடிப்பு, கழுத்து விறைப்பு, சுவாச சிரமம், அல்லது அசாதாரண தூக்கத்துடன் இருந்தால் மருத்துவரை அணுகவும்."
 },
 "Hand, Foot and Mouth Disease": {
  "en": "Hand, foot and mouth disease is a common, usually mild viral infection in young children, causing sores in the mouth and a rash on the hands and feet. Watch for painful mouth sores, a rash or blisters on the hands and feet, mild fever, and reduced appetite from mouth pain. It spreads through close contact, saliva, and contaminated surfaces. To prevent it: wash hands frequently, especially after nappy changes, disinfect shared toys, and keep an infected child home until recovered. See a doctor if the child can't drink fluids, shows signs of dehydration, or has a high, persistent fever.",
  "hi": "हैंड, फुट एंड माउथ डिजीज छोटे बच्चों में एक सामान्य, आमतौर पर हल्का वायरल संक्रमण है, जो मुंह में घाव और हाथों व पैरों पर दाने का कारण बनता है। दर्दनाक मुंह के घाव, हाथों और पैरों पर दाने या छाले, हल्का बुखार, और मुंह के दर्द के कारण कम भूख पर ध्यान दें। यह कॉक्ससैकीवायरस और संबंधित वायरस के कारण होता है, जो नजदीकी संपर्क, लार, और दूषित सतहों से फैलता है। बचाव के लिए: बार-बार हाथ धोएं, खासकर डायपर बदलने के बाद, साझा खिलौनों और सतहों को कीटाणुरहित करें, और संक्रमित बच्चे को ठीक होने तक स्कूल या डेकेयर से दूर रखें। यदि बच्चा तरल पदार्थ नहीं पी पा रहा हो, निर्जलीकरण के संकेत दिखाए, या बुखार तेज और लगातार हो तो डॉक्टर से मिलें।",
  "bn": "হ্যান্ড, ফুট অ্যান্ড মাউথ ডিজিজ ছোট শিশুদের মধ্যে একটি সাধারণ, সাধারণত হালকা ভাইরাস সংক্রমণ, যা মুখে ঘা এবং হাত ও পায়ে র‍্যাশ সৃষ্টি করে। বেদনাদায়ক মুখের ঘা, হাত ও পায়ে র‍্যাশ বা ফোসকা, হালকা জ্বর, এবং মুখের ব্যথার কারণে ক্ষুধা কমে যাওয়া লক্ষ্য করুন। এটি কক্সস্যাকিভাইরাস ও সম্পর্কিত ভাইরাসের কারণে হয়, যা ঘনিষ্ঠ সংস্পর্শ, লালা, এবং দূষিত পৃষ্ঠ থেকে ছড়ায়। প্রতিরোধের জন্য: ঘন ঘন হাত ধুয়ে নিন, বিশেষত ডায়াপার পরিবর্তনের পরে, ভাগ করা খেলনা ও পৃষ্ঠ জীবাণুমুক্ত করুন, এবং সংক্রমিত শিশুকে সেরে ওঠা পর্যন্ত স্কুল বা ডে-কেয়ার থেকে দূরে রাখুন। শিশু তরল পান করতে না পারলে, পানিশূন্যতার লক্ষণ দেখালে, বা জ্বর তীব্র ও ক্রমাগত হলে ডাক্তার দেখান।",
  "ta": "கை, கால் மற்றும் வாய் நோய் சிறு குழந்தைகளில் பொதுவான, பொதுவாக லேசான வைரஸ் தொற்று ஆகும், இது வாயில் புண்களையும் கைகள் மற்றும் கால்களில் தடிப்புகளையும் ஏற்படுத்துகிறது. வலி மிகுந்த வாய் புண்கள், கை மற்றும் கால்களில் தடிப்பு அல்லது கொப்புளங்கள், லேசான காய்ச்சல், மற்றும் வாய் வலியால் குறைந்த பசியை கவனியுங்கள். இது காக்ஸாக்கிவைரஸ் மற்றும் தொடர்புடைய வைரஸ்களால் ஏற்படுகிறது, இது நெருங்கிய தொடர்பு, உமிழ்நீர், மற்றும் அசுத்தமான மேற்பரப்புகள் மூலம் பரவுகிறது. தடுக்க: அடிக்கடி கைகளைக் கழுவுங்கள், குறிப்பாக நாப்பி மாற்றிய பிறகு, பகிரப்பட்ட பொம்மைகள் மற்றும் மேற்பரப்புகளை கிருமி நீக்கம் செய்யுங்கள், தொற்றுக்குள்ளான குழந்தையை குணமாகும் வரை பள்ளி அல்லது டே-கேரிலிருந்து விலக்கி வைக்கவும். குழந்தை திரவங்களை குடிக்க முடியவில்லை என்றாலோ, நீரிழப்பு அறிகுறிகளைக் காட்டினாலோ, அல்லது காய்ச்சல் அதிகமாகவும் தொடர்ந்தும் இருந்தாலோ மருத்துவரை அணுகவும்."
 },
 "Febrile Seizures": {
  "en": "Febrile seizures are convulsions that can occur in young children with a rapidly rising fever — usually brief and not harmful, though frightening to witness. Watch for sudden jerking or stiffening of the body during a fever, loss of consciousness, and brief confusion afterward. They're more common in children aged six months to five years. If one happens: lay the child on their side, don't put anything in their mouth, time the seizure, and treat the fever once it ends. Seek emergency care if a seizure lasts more than five minutes, causes breathing trouble, or is the child's first seizure.",
  "hi": "फेब्राइल सीजर्स छोटे बच्चों में तेजी से बढ़ते बुखार के साथ होने वाले दौरे हैं। ये आमतौर पर संक्षिप्त और हानिरहित होते हैं, हालांकि देखने में डरावने लग सकते हैं। बुखार के दौरान शरीर का अचानक झटके लेना या अकड़ना, दौरे के दौरान बेहोशी, और दौरे के बाद थोड़ी देर के लिए भ्रम पर ध्यान दें। यह शरीर के तापमान में तेजी से वृद्धि के कारण होता है, अक्सर वायरल संक्रमण से, और छह महीने से पांच साल की उम्र के बच्चों में अधिक आम है। यदि ऐसा हो: बच्चे को करवट पर लिटाएं, बच्चे के मुंह में कुछ न डालें, दौरे का समय नोट करें, और दौरा खत्म होने पर अंतर्निहित बुखार का इलाज करें। यदि दौरा पांच मिनट से अधिक समय तक रहे, बाद में सांस लेने में कठिनाई हो, या यह उनका पहला दौरा हो तो आपातकालीन देखभाल लें।",
  "bn": "ফেব্রাইল সিজার ছোট শিশুদের দ্রুত বর্ধমান জ্বরের সাথে ঘটতে পারে এমন খিঁচুনি। এগুলো সাধারণত সংক্ষিপ্ত ও ক্ষতিকর নয়, যদিও দেখতে ভয়ংকর লাগতে পারে। জ্বরের সময় শরীরের হঠাৎ ঝাঁকুনি বা শক্ত হয়ে যাওয়া, খিঁচুনির সময় জ্ঞান হারানো, এবং খিঁচুনি শেষ হওয়ার পরে কিছুক্ষণ বিভ্রান্তি লক্ষ্য করুন। এটি শরীরের তাপমাত্রার দ্রুত বৃদ্ধির কারণে হয়, প্রায়ই ভাইরাস সংক্রমণ থেকে, এবং ছয় মাস থেকে পাঁচ বছর বয়সী শিশুদের মধ্যে বেশি সাধারণ। এমন হলে: শিশুকে কাত করে শুইয়ে দিন, শিশুর মুখে কিছু দেবেন না, খিঁচুনির সময় লক্ষ্য রাখুন, এবং খিঁচুনি শেষ হলে অন্তর্নিহিত জ্বরের চিকিৎসা করুন। খিঁচুনি পাঁচ মিনিটের বেশি স্থায়ী হলে, পরে শ্বাস নিতে অসুবিধা হলে, বা এটি তাদের প্রথম খিঁচুনি হলে জরুরি যত্ন নিন।",
  "ta": "ஜுர வலிப்பு என்பது விரைவாக அதிகரிக்கும் காய்ச்சலுடன் சிறு குழந்தைகளில் ஏற்படக்கூடிய வலிப்புத்தாக்கங்கள் ஆகும். இவை பொதுவாக குறுகியவை மற்றும் தீங்கற்றவை, எனினும் பார்ப்பதற்கு பயமுறுத்தக்கூடியவை. காய்ச்சலின் போது உடல் திடீரென துடிப்பது அல்லது விறைப்பாவது, வலிப்பின் போது மயக்கம், மற்றும் வலிப்புக்குப் பின் சிறிது நேரம் குழப்பத்தை கவனியுங்கள். இது உடல் வெப்பநிலையின் விரைவான உயர்வால் ஏற்படுகிறது, பெரும்பாலும் வைரஸ் தொற்றிலிருந்து, மற்றும் ஆறு மாதங்கள் முதல் ஐந்து வயது வரையிலான குழந்தைகளில் அதிகம் காணப்படுகிறது. இப்படி நடந்தால்: குழந்தையை பக்கவாட்டில் படுக்க வைக்கவும், குழந்தையின் வாயில் எதையும் வைக்க வேண்டாம், வலிப்பின் நேரத்தைக் குறிக்கவும், வலிப்பு முடிந்தவுடன் அடிப்படை காய்ச்சலுக்கு சிகிச்சை அளிக்கவும். வலிப்பு ஐந்து நிமிடங்களுக்கு மேல் நீடித்தால், பின்னர் சுவாசிக்க சிரமம் இருந்தால், அல்லது இது அவர்களின் முதல் வலிப்பு என்றால் அவசர பராமரிப்பு பெறுங்கள்."
 },
 "Vitamin D Deficiency": {
  "en": "Vitamin D deficiency is common where sun exposure or dietary intake is limited, and it affects bone health and immune function. Watch for bone or muscle pain, fatigue, frequent infections, and in children, delayed growth or bone deformities. It's caused by limited sun exposure, diets low in vitamin D, and in some cases darker skin reducing natural synthesis. To prevent it: spend time outdoors safely, eat vitamin D-rich foods like fatty fish and fortified foods, and take supplements if advised. See a doctor for persistent bone or muscle pain, or unexplained fatigue — a simple blood test can check your levels.",
  "hi": "विटामिन डी की कमी वहां आम है जहां धूप या आहार में इसकी मात्रा सीमित है, और यह हड्डियों के स्वास्थ्य व प्रतिरक्षा कार्य को प्रभावित करती है। हड्डी या मांसपेशियों में दर्द, थकान, बार-बार संक्रमण, और बच्चों में विकास में देरी या हड्डी विकृति (रिकेट्स) पर ध्यान दें। सीमित धूप, विटामिन डी से भरपूर खाद्य पदार्थों की कमी वाला आहार, गहरी त्वचा जो धूप से विटामिन डी बनाना कम करती है, और कुछ पाचन स्थितियां इसके कारण हैं। बचाव के लिए: सुरक्षित धूप के साथ बाहर समय बिताएं, वसायुक्त मछली और फोर्टिफाइड खाद्य पदार्थों जैसे विटामिन डी युक्त भोजन खाएं, और स्वास्थ्यकर्मी की सलाह पर सप्लीमेंट लें। लगातार हड्डी या मांसपेशियों में दर्द, या अस्पष्ट थकान होने पर डॉक्टर से मिलें — एक साधारण रक्त जांच से विटामिन डी स्तर जांचा जा सकता है।",
  "bn": "ভিটামিন ডি-এর ঘাটতি সেখানে সাধারণ যেখানে সূর্যালোক বা খাদ্যে এর পরিমাণ সীমিত, এবং এটি হাড়ের স্বাস্থ্য ও রোগ প্রতিরোধ ক্ষমতাকে প্রভাবিত করে। হাড় বা পেশিতে ব্যথা, ক্লান্তি, ঘন ঘন সংক্রমণ, এবং শিশুদের মধ্যে বৃদ্ধিতে বিলম্ব বা হাড়ের বিকৃতি (রিকেট্স) লক্ষ্য করুন। সীমিত সূর্যালোক, ভিটামিন ডি সমৃদ্ধ খাবারের অভাবযুক্ত খাদ্য, গাঢ় ত্বক যা সূর্যালোক থেকে ভিটামিন ডি তৈরি কমায়, এবং কিছু পরিপাক সমস্যা এর কারণ। প্রতিরোধের জন্য: নিরাপদ সূর্যালোকের সাথে বাইরে সময় কাটান, চর্বিযুক্ত মাছ ও ফর্টিফায়েড খাবারের মতো ভিটামিন ডি সমৃদ্ধ খাবার খান, এবং স্বাস্থ্যকর্মীর পরামর্শে সাপ্লিমেন্ট নিন। ক্রমাগত হাড় বা পেশি ব্যথা, বা অব্যাখ্যাত ক্লান্তি থাকলে ডাক্তার দেখান — একটি সাধারণ রক্ত পরীক্ষায় ভিটামিন ডি স্তর পরীক্ষা করা যায়।",
  "ta": "வைட்டமின் டி குறைபாடு சூரிய ஒளி அல்லது உணவில் அளவு குறைவாக உள்ள இடங்களில் பொதுவானது, இது எலும்பு ஆரோக்கியம் மற்றும் நோய் எதிர்ப்பு சக்தியை பாதிக்கிறது. எலும்பு அல்லது தசை வலி, சோர்வு, அடிக்கடி தொற்றுகள், மற்றும் குழந்தைகளில் தாமதமான வளர்ச்சி அல்லது எலும்பு உருமாற்றம் (ரிக்கெட்ஸ்) ஆகியவற்றை கவனியுங்கள். குறைந்த சூரிய ஒளி வெளிப்பாடு, வைட்டமின் டி நிறைந்த உணவுகள் குறைவான உணவு, சூரிய ஒளியிலிருந்து வைட்டமின் டி உருவாக்கத்தை குறைக்கும் அடர் தோல் நிறம், மற்றும் சில செரிமான நிலைகள் இதற்கு காரணங்கள். தடுக்க: பாதுகாப்பான சூரிய ஒளியுடன் வெளியே நேரம் செலவிடுங்கள், கொழுப்பு நிறைந்த மீன் மற்றும் வலுவூட்டப்பட்ட உணவுகள் போன்ற வைட்டமின் டி நிறைந்த உணவுகளை உண்ணுங்கள், சுகாதார பணியாளரின் ஆலோசனையின் பேரில் மருந்துகளை எடுத்துக்கொள்ளுங்கள். தொடர்ந்த எலும்பு அல்லது தசை வலி, அல்லது விளக்கமற்ற சோர்வு இருந்தால் மருத்துவரை அணுகவும் — ஒரு எளிய இரத்த பரிசோதனை வைட்டமின் டி அளவை சரிபார்க்கும்."
 },
 "Balanced Diet Basics": {
  "en": "A balanced diet provides the right mix of nutrients the body needs to function, grow, and stay healthy at every life stage. Aim for a variety of food groups at each meal: whole grains for energy, proteins like legumes, fish and eggs for growth and repair, and plenty of fruits and vegetables for vitamins and fibre. Limit added sugar, salt, and processed foods. Practical tips: plan meals around vegetables and whole grains, cut back on fried foods, and drink water instead of sugary drinks. Speak with a health worker or dietitian if you have a condition like diabetes that affects your dietary needs.",
  "hi": "संतुलित आहार शरीर को जीवन के हर चरण में काम करने, बढ़ने और स्वस्थ रहने के लिए आवश्यक पोषक तत्वों का सही मिश्रण प्रदान करता है। हर भोजन में विभिन्न खाद्य समूहों को शामिल करने का लक्ष्य रखें: ऊर्जा के लिए साबुत अनाज, वृद्धि और मरम्मत के लिए दालें, मछली और अंडे जैसे प्रोटीन, और विटामिन व फाइबर के लिए फल व सब्जियां। अतिरिक्त चीनी, नमक, और प्रोसेस्ड खाद्य पदार्थों को सीमित करें। व्यावहारिक सुझाव: सब्जियों और साबुत अनाज के आसपास भोजन की योजना बनाएं, तले हुए और अति-प्रोसेस्ड खाद्य पदार्थों को सीमित करें, और मीठे पेय के बजाय पानी पिएं। यदि आपकी कोई स्थिति है जो आहार की जरूरतों को प्रभावित करती है, जैसे डायबिटीज या किडनी रोग, तो स्वास्थ्यकर्मी या आहार विशेषज्ञ से बात करें।",
  "bn": "সুষম খাদ্য শরীরকে জীবনের প্রতিটি পর্যায়ে কাজ করতে, বৃদ্ধি পেতে, এবং সুস্থ থাকতে প্রয়োজনীয় পুষ্টির সঠিক মিশ্রণ সরবরাহ করে। প্রতিটি খাবারে বিভিন্ন খাদ্য গোষ্ঠী অন্তর্ভুক্ত করার লক্ষ্য রাখুন: শক্তির জন্য পুরো শস্য, বৃদ্ধি ও মেরামতের জন্য ডাল, মাছ ও ডিমের মতো প্রোটিন, এবং ভিটামিন ও ফাইবারের জন্য ফল ও সবজি। অতিরিক্ত চিনি, লবণ, এবং প্রক্রিয়াজাত খাবার সীমিত করুন। ব্যবহারিক পরামর্শ: সবজি ও পুরো শস্যের চারপাশে খাবার পরিকল্পনা করুন, ভাজা ও অতি-প্রক্রিয়াজাত খাবার সীমিত করুন, এবং মিষ্টি পানীয়ের বদলে পানি পান করুন। ডায়াবেটিস বা কিডনি রোগের মতো খাদ্য প্রয়োজনীয়তাকে প্রভাবিত করে এমন কোনো অবস্থা থাকলে স্বাস্থ্যকর্মী বা ডায়েটিশিয়ানের সাথে কথা বলুন।",
  "ta": "சமச்சீர் உணவு வாழ்க்கையின் ஒவ்வொரு கட்டத்திலும் உடல் செயல்பட, வளர, ஆரோக்கியமாக இருக்க தேவையான சரியான ஊட்டச்சத்து கலவையை வழங்குகிறது. ஒவ்வொரு உணவிலும் பல்வேறு உணவு வகைகளை சேர்க்க இலக்கு வையுங்கள்: ஆற்றலுக்கு முழு தானியங்கள், வளர்ச்சி மற்றும் பழுதுபார்ப்புக்கு பருப்பு வகைகள், மீன் மற்றும் முட்டை போன்ற புரதங்கள், மற்றும் வைட்டமின்கள் மற்றும் நார்ச்சத்துக்கு பழங்கள் மற்றும் காய்கறிகள். அதிகப்படியான சர்க்கரை, உப்பு, மற்றும் பதப்படுத்தப்பட்ட உணவுகளைக் குறைக்கவும். நடைமுறை குறிப்புகள்: காய்கறிகள் மற்றும் முழு தானியங்களைச் சுற்றி உணவை திட்டமிடுங்கள், வறுத்த மற்றும் அதிக பதப்படுத்தப்பட்ட உணவுகளைக் குறைக்கவும், இனிப்பு பானங்களுக்குப் பதிலாக தண்ணீர் குடிக்கவும். நீரிழிவு அல்லது சிறுநீரக நோய் போன்ற உணவு தேவைகளை பாதிக்கும் ஏதேனும் நிலை இருந்தால் சுகாதார பணியாளர் அல்லது உணவியல் நிபுணரிடம் பேசுங்கள்."
 },
 "Vitamin A Deficiency": {
