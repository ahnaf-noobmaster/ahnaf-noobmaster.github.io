<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Portal — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --bg:#F4F8FB;
    --blue-900:#0B3B66;
    --blue-800:#0F4C81;
    --blue-700:#155A9C;
    --blue-500:#2E7BC4;
    --blue-200:#BFDBF5;
    --blue-100:#E7F1FB;
    --green-800:#155C3B;
    --green-700:#1D7A4C;
    --green-500:#2FA968;
    --green-200:#BCE7D0;
    --green-100:#E6F7ED;
    --amber-600:#B4740E;
    --amber-100:#FBF0DC;
    --ink:#132436;
    --muted:#5B7186;
    --border:#DCE6EE;
    --radius:14px;
    --shadow:0 1px 2px rgba(11,59,102,.06), 0 8px 24px rgba(11,59,102,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Source Sans 3',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  ::selection{background:var(--blue-200);}
  :focus-visible{outline:2px solid var(--blue-700);outline-offset:2px;}

  /* ---------- Layout shells ---------- */
  #app{min-height:100vh;}
  .hidden{display:none !important;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;position:relative;overflow:hidden;
  }
  .login-wrap::before{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(600px 300px at 15% -10%, var(--blue-100), transparent),
      radial-gradient(600px 320px at 110% 10%, var(--green-100), transparent);
    z-index:0;
  }
  .login-topbar{position:relative;z-index:1;width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green-500);box-shadow:0 0 0 4px var(--green-100);}
  .brand-name{font-family:'Source Serif 4',serif;font-weight:600;font-size:20px;color:var(--blue-900);letter-spacing:.2px;}
  .lang-pills{display:flex;gap:6px;background:var(--white);border:1px solid var(--border);border-radius:999px;padding:3px;box-shadow:var(--shadow);}
  .lang-pill{border:none;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);}
  .lang-pill.active{background:var(--blue-800);color:#fff;}

  .login-card{
    position:relative;z-index:1;background:var(--white);border:1px solid var(--border);
    border-radius:20px;box-shadow:var(--shadow);padding:40px 36px;width:100%;max-width:420px;
  }
  .login-card h1{margin:0 0 6px;font-size:26px;color:var(--blue-900);}
  .login-sub{color:var(--muted);font-size:14.5px;margin:0 0 26px;line-height:1.5;}
  .tabrow{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:22px;}
  .tabbtn{flex:1;border:none;background:transparent;padding:9px 0;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted);}
  .tabbtn.active{background:var(--white);color:var(--blue-800);box-shadow:0 1px 3px rgba(11,59,102,.15);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--blue-900);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field input{
    width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);
    font-size:14.5px;background:var(--bg);color:var(--ink);
  }
  .field input:focus{border-color:var(--blue-500);background:var(--white);}
  .btn-primary{
    width:100%;background:var(--blue-800);color:#fff;border:none;border-radius:10px;
    padding:12px 0;font-weight:700;font-size:14.5px;margin-top:6px;
    box-shadow:0 6px 16px rgba(11,76,129,.25);
  }
  .btn-primary:hover{background:var(--blue-700);}
  .btn-ghost{
    width:100%;background:transparent;color:var(--blue-800);border:1.5px solid var(--border);
    border-radius:10px;padding:11px 0;font-weight:600;font-size:14px;margin-top:10px;
  }
  .btn-ghost:hover{border-color:var(--blue-500);}
  .login-note{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5;}
  .login-note b{color:var(--blue-800);}

  /* ---------- App shell ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--white);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:16px;padding:12px 20px;
  }
  .topbar .brand-name{font-size:18px;}
  .search-wrap{flex:1;max-width:520px;position:relative;}
  .search-wrap input{
    width:100%;padding:10px 14px 10px 36px;border-radius:999px;border:1.5px solid var(--border);
    background:var(--bg);font-size:14px;
  }
  .search-wrap input:focus{background:var(--white);border-color:var(--blue-500);}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}
  .topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
  .icon-btn{
    background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 10px;
    font-size:13px;font-weight:600;color:var(--blue-900);display:flex;align-items:center;gap:6px;
  }
  .icon-btn:hover{border-color:var(--blue-500);}
  .user-chip{display:flex;align-items:center;gap:8px;background:var(--blue-100);border-radius:999px;padding:5px 12px 5px 5px;}
  .user-avatar{width:26px;height:26px;border-radius:50%;background:var(--blue-800);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .user-name{font-size:13px;font-weight:600;color:var(--blue-900);}

  .shell{display:flex;max-width:1280px;margin:0 auto;}
  .sidebar{
    width:250px;flex-shrink:0;padding:22px 14px;border-right:1px solid var(--border);
    min-height:calc(100vh - 57px);position:sticky;top:57px;align-self:flex-start;
  }
  .side-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:6px 10px 10px;}
  .side-link{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.8px;
    font-weight:600;color:var(--ink);margin-bottom:2px;background:transparent;border:none;width:100%;text-align:left;
  }
  .side-link:hover{background:var(--bg);}
  .side-link.active{background:var(--blue-100);color:var(--blue-900);}
  .side-link .swatch{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .side-link .count{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600;}

  .main{flex:1;min-width:0;padding:28px 32px 60px;}

  /* ---------- Home ---------- */
  .hero{
    background:linear-gradient(135deg,var(--blue-900),var(--blue-700));
    border-radius:20px;padding:34px 34px;color:#fff;margin-bottom:26px;position:relative;overflow:hidden;
  }
  .hero::after{
    content:'';position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(47,169,104,.35),transparent 70%);
  }
  .hero-eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--green-200);font-weight:700;margin-bottom:10px;}
  .hero h1{font-size:28px;margin:0 0 10px;max-width:640px;line-height:1.25;}
  .hero p{margin:0 0 20px;color:#DCE9F7;max-width:560px;font-size:14.5px;line-height:1.6;}
  .coverage{display:flex;gap:26px;flex-wrap:wrap;position:relative;z-index:1;}
  .coverage-item{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 18px;min-width:140px;}
  .coverage-item .num{font-family:'Source Serif 4',serif;font-size:24px;font-weight:700;}
  .coverage-item .lbl{font-size:11.5px;color:#CBDDEF;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 14px;}
  .section-head h2{font-size:18px;margin:0;color:var(--blue-900);}
  .section-head .sub{font-size:12.5px;color:var(--muted);}

  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .cat-card{
    background:var(--white);border:1px solid var(--border);border-radius:16px;padding:18px;
    text-align:left;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--shadow);
  }
  .cat-card:hover{border-color:var(--blue-500);transform:translateY(-1px);}
  .cat-title{font-family:'Source Serif 4',serif;font-weight:600;font-size:15.5px;color:var(--blue-900);margin:0 0 3px;}
  .cat-desc{font-size:12.3px;color:var(--muted);line-height:1.45;margin:0 0 8px;}
  .cat-meta{font-size:11.5px;color:var(--muted);font-weight:600;}
  .cat-meta b{color:var(--green-700);}

  /* seal badge */
  .seal{
    position:relative;width:46px;height:46px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',serif;
    font-weight:700;font-size:16px;color:#fff;
  }
  .seal::before{
    content:'';position:absolute;inset:-5px;border-radius:50%;border:1px dashed currentColor;opacity:.45;
  }
  .seal.blue{background:var(--blue-700);color:var(--blue-700);}
  .seal.blue span{color:#fff;}
  .seal.green{background:var(--green-700);color:var(--green-700);}
  .seal.green span{color:#fff;}

  /* ---------- Topic list ---------- */
  .crumbs{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .crumbs button{background:none;border:none;color:var(--blue-700);font-weight:600;padding:0;font-size:12.5px;}
  .page-title{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
  .page-title h1{font-size:23px;margin:0;color:var(--blue-900);}
  .page-sub{color:var(--muted);font-size:13.5px;margin:6px 0 20px;max-width:640px;line-height:1.5;}

  .topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
  .topic-card{
    background:var(--white);border:1px solid var(--border);border-radius:13px;padding:15px 16px;
    text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:100px;
  }
  .topic-card:hover{border-color:var(--blue-500);}
  .topic-card .t-title{font-weight:600;font-size:14px;color:var(--ink);line-height:1.35;}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:10.8px;font-weight:700;padding:3px 9px;border-radius:999px;width:fit-content;letter-spacing:.02em;}
  .badge.reviewed{background:var(--green-100);color:var(--green-800);}
  .badge.reviewed::before{content:'✓';}
  .badge.draft{background:var(--amber-100);color:var(--amber-600);border:1px dashed var(--amber-600);}
  .badge.edited{background:var(--blue-100);color:var(--blue-800);}
  .t-excerpt{font-size:12px;color:var(--muted);line-height:1.5;flex:1;}

  /* ---------- Article ---------- */
  .article-wrap{max-width:760px;}
  .article-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
  .article-title{font-size:26px;margin:0;color:var(--blue-900);line-height:1.25;}
  .article-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .abtn{
    background:var(--white);border:1.5px solid var(--border);border-radius:9px;padding:8px 13px;
    font-size:12.8px;font-weight:600;color:var(--blue-900);display:flex;align-items:center;gap:6px;
  }
  .abtn:hover{border-color:var(--blue-500);}
  .abtn.primary{background:var(--blue-800);color:#fff;border-color:var(--blue-800);}
  .abtn.primary:hover{background:var(--blue-700);}

  .lang-note{
    margin:16px 0;padding:11px 14px;border-radius:10px;background:var(--amber-100);
    border:1px solid #EED9AE;color:#8A5B0B;font-size:12.8px;line-height:1.55;
  }
  .disclaimer{
    margin:16px 0 22px;padding:12px 14px;border-radius:10px;background:var(--blue-100);
    border:1px solid var(--blue-200);color:var(--blue-900);font-size:12.5px;line-height:1.55;
  }
  .article-body{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:26px 28px;box-shadow:var(--shadow);}
  .a-block{margin-bottom:22px;}
  .a-block:last-child{margin-bottom:0;}
  .a-block h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--green-700);margin:0 0 10px;font-family:'Source Sans 3';font-weight:700;}
  .a-block p{margin:0;font-size:15px;line-height:1.7;color:var(--ink);}
  .a-block ul{margin:0;padding-left:20px;font-size:14.5px;line-height:1.85;color:var(--ink);}
  .a-block li{margin-bottom:2px;}

  .edit-area{width:100%;min-height:340px;border-radius:12px;border:1.5px solid var(--blue-200);padding:16px;font-size:14.5px;line-height:1.7;font-family:'Source Sans 3';resize:vertical;background:var(--bg);}
  .edit-actions{display:flex;gap:8px;margin-top:12px;}

  .sources-box{margin-top:18px;background:var(--green-100);border:1px solid var(--green-200);border-radius:14px;padding:18px 20px;}
  .sources-box h4{margin:0 0 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--green-800);font-weight:700;}
  .sources-box ul{margin:0;padding:0;list-style:none;}
  .sources-box li{font-size:13px;margin-bottom:6px;}
  .sources-box a{color:var(--blue-800);font-weight:600;text-decoration:none;border-bottom:1px solid var(--blue-200);}
  .sources-box a:hover{border-color:var(--blue-800);}

  .gen-box{background:var(--white);border:1.5px dashed var(--border);border-radius:16px;padding:34px 28px;text-align:center;}
  .gen-box p{color:var(--muted);font-size:13.8px;max-width:420px;margin:8px auto 18px;line-height:1.6;}

  @media (max-width:860px){
    .sidebar{display:none;}
    .main{padding:20px 16px 50px;}
    .search-wrap{max-width:none;}
    .topbar{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ======================= DATA ======================= */

const CATEGORIES = [
  {id:'infectious', name:{en:'Infectious Diseases',hi:'संक्रामक रोग',bn:'সংক্রামক রোগ'}, desc:{en:'Illnesses spread person to person or by mosquitoes and contaminated food/water.',hi:'व्यक्ति-से-व्यक्ति या मच्छरों और दूषित भोजन/पानी से फैलने वाली बीमारियाँ।',bn:'ব্যক্তি থেকে ব্যক্তি বা মশা এবং দূষিত খাবার/পানির মাধ্যমে ছড়ানো রোগ।'}, color:'blue'},
  {id:'ncd', name:{en:'Non-Communicable Diseases',hi:'गैर-संक्रामक रोग',bn:'অসংক্রামক রোগ'}, desc:{en:'Long-term conditions such as diabetes, heart disease and hypertension.',hi:'डायबिटीज़, हृदय रोग और उच्च रक्तचाप जैसी दीर्घकालिक स्थितियाँ।',bn:'ডায়াবেটিস, হৃদরোগ ও উচ্চ রক্তচাপের মতো দীর্ঘমেয়াদী অবস্থা।'}, color:'green'},
  {id:'maternal', name:{en:'Maternal & Child Health',hi:'मातृ एवं शिशु स्वास्थ्य',bn:'মাতৃ ও শিশু স্বাস্থ্য'}, desc:{en:'Pregnancy, delivery, and newborn care guidance.',hi:'गर्भावस्था, प्रसव और नवजात देखभाल संबंधी जानकारी।',bn:'গর্ভাবস্থা, প্রসব ও নবজাতকের যত্ন সংক্রান্ত তথ্য।'}, color:'blue'},
  {id:'child', name:{en:'Child Health',hi:'बाल स्वास्थ्य',bn:'শিশু স্বাস্থ্য'}, desc:{en:'Common childhood illnesses, growth and vaccination topics.',hi:'सामान्य बचपन की बीमारियाँ, विकास व टीकाकरण विषय।',bn:'সাধারণ শৈশব রোগ, বৃদ্ধি ও টিকাদান বিষয়ক তথ্য।'}, color:'green'},
  {id:'nutrition', name:{en:'Nutrition',hi:'पोषण',bn:'পুষ্টি'}, desc:{en:'Diet, deficiencies and healthy eating across life stages.',hi:'आहार, कमियाँ और जीवन के हर चरण में स्वस्थ भोजन।',bn:'খাদ্য, অভাবজনিত সমস্যা ও জীবনের সব পর্যায়ে স্বাস্থ্যকর খাদ্যাভ্যাস।'}, color:'blue'},
  {id:'mental', name:{en:'Mental Health',hi:'मानसिक स्वास्थ्य',bn:'মানসিক স্বাস্থ্য'}, desc:{en:'Emotional wellbeing, common conditions and coping support.',hi:'भावनात्मक स्वास्थ्य, सामान्य स्थितियाँ और सहयोग।',bn:'মানসিক সুস্থতা, সাধারণ সমস্যা ও সহায়তা।'}, color:'green'},
  {id:'women', name:{en:"Women's Health",hi:'महिला स्वास्थ्य',bn:'নারী স্বাস্থ্য'}, desc:{en:'Reproductive and general health topics for women.',hi:'महिलाओं के लिए प्रजनन व सामान्य स्वास्थ्य विषय।',bn:'নারীদের জন্য প্রজনন ও সাধারণ স্বাস্থ্য বিষয়ক তথ্য।'}, color:'blue'},
  {id:'men', name:{en:"Men's Health",hi:'पुरुष स्वास्थ्य',bn:'পুরুষ স্বাস্থ্য'}, desc:{en:'Health topics specific to men across the lifespan.',hi:'पुरुषों के जीवन से जुड़े विशेष स्वास्थ्य विषय।',bn:'পুরুষদের জীবনজুড়ে নির্দিষ্ট স্বাস্থ্য বিষয়।'}, color:'green'},
  {id:'elderly', name:{en:'Elderly Health',hi:'वृद्धावस्था स्वास्थ्य',bn:'বয়স্কদের স্বাস্থ্য'}, desc:{en:'Ageing-related conditions and healthy ageing tips.',hi:'उम्र संबंधी स्थितियाँ और स्वस्थ बुढ़ापे के सुझाव।',bn:'বার্ধক্যজনিত সমস্যা ও সুস্থভাবে বার্ধক্য বরণের পরামর্শ।'}, color:'blue'},

"Gestational Diabetes":{overview:"Gestational diabetes is high blood sugar that develops during pregnancy and usually resolves after delivery, but needs monitoring to protect mother and baby.",symptoms:["Often no noticeable symptoms","Increased thirst in some cases","Fatigue","Frequent urination"],causesLabel:"Risk Factors",causes:["Overweight before pregnancy","Family history of diabetes","Older maternal age","Previous gestational diabetes"],preventionLabel:"Management",prevention:["Follow a balanced diet as advised by a health worker","Stay physically active as approved for pregnancy","Attend all scheduled glucose screening tests","Monitor blood sugar as directed if diagnosed"],doctor:"See a doctor promptly if you notice unusual thirst or fatigue during pregnancy, and attend all recommended glucose screening appointments."},
"Preeclampsia":{overview:"Preeclampsia is a pregnancy complication marked by high blood pressure and signs of organ stress, usually after 20 weeks. It requires prompt medical attention.",symptoms:["High blood pressure","Swelling of the face and hands","Severe headache","Vision changes","Upper abdominal pain"],causesLabel:"Risk Factors",causes:["First pregnancy","History of high blood pressure","Multiple pregnancy (twins or more)","Obesity"],preventionLabel:"What Helps",prevention:["Attend all antenatal check-ups for blood pressure monitoring","Report swelling, headaches, or vision changes promptly","Follow medical advice on aspirin or supplements if prescribed"],doctor:"Seek immediate medical care for severe headache, vision changes, or upper abdominal pain during pregnancy — these can signal preeclampsia."},
"Postnatal Care":{overview:"Postnatal care covers the health checks and support a mother and newborn need in the weeks following birth, to catch complications early and support recovery.",symptoms:["Regular check-ups for the mother's recovery and bleeding","Newborn weight and feeding checks","Monitoring for signs of infection","Support for breastfeeding"],causesLabel:"Recommended Schedule",causes:["A check-up within the first week after birth","Follow-up visits over the following weeks","Immunization schedule for the newborn started"],preventionLabel:"Self-Care",prevention:["Rest and accept help with household tasks","Eat a nutritious diet while breastfeeding","Watch for signs of postpartum depression","Attend all scheduled follow-up visits"],doctor:"Seek care promptly for heavy bleeding, high fever, severe pain, or if the baby is feeding poorly or unusually lethargic."},
"Fever in Children":{overview:"Fever in children is usually a sign the body is fighting an infection, and most fevers are not dangerous on their own.",symptoms:["Body temperature above 38°C (100.4°F)","Irritability or reduced activity","Reduced appetite","Sweating or chills"],causesLabel:"Common Causes",causes:["Viral infections such as colds or flu","Bacterial infections","Teething (mild, low-grade)","Post-vaccination response"],preventionLabel:"Home Care",prevention:["Keep the child hydrated","Dress in light clothing","Use paracetamol as directed by a health worker if the child is uncomfortable","Monitor temperature regularly"],doctor:"See a doctor if a fever is above 39.5°C, lasts more than three days, or is accompanied by rash, stiff neck, difficulty breathing, or unusual drowsiness."},
"Hand, Foot and Mouth Disease":{overview:"Hand, foot and mouth disease is a common, usually mild viral infection in young children, causing sores in the mouth and a rash on the hands and feet.",symptoms:["Painful mouth sores","Rash or blisters on hands and feet","Mild fever","Reduced appetite due to mouth pain"],causesLabel:"Causes",causes:["Caused by coxsackievirus and related viruses","Spreads through close contact, saliva, and contaminated surfaces"],preventionLabel:"Prevention",prevention:["Wash hands frequently, especially after nappy changes","Disinfect shared toys and surfaces","Keep an infected child home from school or daycare until recovered"],doctor:"See a doctor if the child cannot drink fluids, shows signs of dehydration, or the fever is high and persistent."},
"Febrile Seizures":{overview:"Febrile seizures are convulsions that can occur in young children with a rapidly rising fever. They are usually brief and not harmful, though they can be frightening to witness.",symptoms:["Sudden jerking or stiffening of the body during a fever","Loss of consciousness during the seizure","Confusion briefly after the seizure ends"],causesLabel:"Causes",causes:["A rapid rise in body temperature, often from a viral infection","More common in children aged six months to five years"],preventionLabel:"What To Do",prevention:["Lay the child on their side during a seizure","Do not put anything in the child's mouth","Time the seizure","Treat the underlying fever once the seizure ends"],doctor:"Seek emergency care if a seizure lasts more than five minutes, if the child has difficulty breathing afterward, or if it's their first seizure."},
"Vitamin D Deficiency":{overview:"Vitamin D deficiency is common where sun exposure or dietary intake is limited, and it affects bone health and immune function.",symptoms:["Bone or muscle pain","Fatigue","Frequent infections","In children, delayed growth or bone deformities (rickets)"],causesLabel:"Causes",causes:["Limited sun exposure","Diets low in vitamin D-rich foods","Darker skin, which reduces vitamin D synthesis from sunlight","Certain digestive conditions"],preventionLabel:"Prevention",prevention:["Spend time outdoors with safe sun exposure","Eat vitamin D-rich foods such as fatty fish and fortified foods","Take supplements when advised by a health worker"],doctor:"See a doctor if you have persistent bone or muscle pain, or unexplained fatigue — a simple blood test can check vitamin D levels."},
"Balanced Diet Basics":{overview:"A balanced diet provides the right mix of nutrients the body needs to function, grow, and stay healthy across all life stages.",symptoms:["Include a variety of food groups at each meal","Aim for fruits, vegetables, whole grains, and protein sources","Limit added sugar, salt, and processed foods"],causesLabel:"Key Food Groups",causes:["Carbohydrates for energy — whole grains preferred","Proteins for growth and repair — legumes, fish, eggs, meat","Fruits and vegetables for vitamins and fiber","Fats in moderation, preferring unsaturated sources"],preventionLabel:"Practical Tips",prevention:["Plan meals around vegetables and whole grains","Limit fried and ultra-processed foods","Drink water instead of sugary drinks","Eat regularly rather than skipping meals"],doctor:"Speak with a health worker or dietitian if you have specific health conditions that affect dietary needs, such as diabetes or kidney disease."},
"Vitamin A Deficiency":{overview:"Vitamin A deficiency is a leading cause of preventable childhood blindness in developing regions and also weakens immune defenses.",symptoms:["Night blindness (difficulty seeing in low light)","Dry eyes","Increased frequency of infections","Dry, rough skin"],causesLabel:"Causes",causes:["Diets low in vitamin A-rich foods","Limited access to fruits, vegetables, and animal products","Higher risk in young children and pregnant women"],preventionLabel:"Prevention",prevention:["Eat vitamin A-rich foods such as carrots, leafy greens, and dairy","Participate in vitamin A supplementation programmes for children where offered","Support exclusive breastfeeding for infants"],doctor:"See a doctor if a child has difficulty seeing in dim light or recurrent infections — vitamin A supplementation is safe and effective when guided by a health worker."},
"Stress Management":{overview:"Stress is the body's natural response to pressure or demands, and while some stress is normal, chronic stress can affect both physical and mental health.",symptoms:["Difficulty sleeping","Irritability or feeling overwhelmed","Muscle tension or headaches","Trouble concentrating"],causesLabel:"Common Sources",causes:["Work or academic pressure","Financial concerns","Relationship difficulties","Major life changes"],preventionLabel:"Coping Strategies",prevention:["Practice regular physical activity","Try relaxation techniques such as deep breathing","Maintain social connections","Set realistic goals and take breaks"],doctor:"See a health professional if stress feels unmanageable, persists for weeks, or affects your sleep, work, or relationships significantly."},
"Sleep Disorders (Insomnia)":{overview:"Insomnia is difficulty falling asleep, staying asleep, or getting restful sleep, and it can affect daily functioning when persistent.",symptoms:["Difficulty falling asleep","Waking frequently during the night","Waking too early","Daytime fatigue or irritability"],causesLabel:"Common Causes",causes:["Stress or anxiety","Irregular sleep schedule","Excessive screen time before bed","Caffeine or stimulant use late in the day"],preventionLabel:"Sleep Hygiene Tips",prevention:["Keep a consistent sleep and wake schedule","Limit screens before bedtime","Avoid caffeine in the afternoon and evening","Create a calm, dark sleeping environment"],doctor:"See a doctor if insomnia persists for more than a few weeks or significantly affects your daily life — treatable underlying causes are common."},
"Substance Use & Addiction":{overview:"Substance use disorders involve a pattern of using alcohol, tobacco, or other substances that causes significant problems in daily life, and recovery support is available.",symptoms:["Difficulty controlling use despite wanting to stop","Continuing use despite negative consequences","Withdrawal symptoms when not using","Neglecting responsibilities"],causesLabel:"Contributing Factors",causes:["Genetic and family history","Mental health conditions","Social and environmental pressures","Early exposure to substance use"],preventionLabel:"Support & Recovery",prevention:["Reach out to a health worker or counsellor for support","Connect with support groups or helplines","Avoid triggers and high-risk environments where possible"],doctor:"Speak confidentially with a health professional if substance use is affecting your health, relationships, or responsibilities — help is available without judgment."},
"Menopause":{overview:"Menopause is the natural end of menstrual cycles, typically occurring between ages 45 and 55, marking the end of reproductive years.",symptoms:["Irregular periods leading up to menopause","Hot flashes and night sweats","Mood changes","Sleep disturbances","Vaginal dryness"],causesLabel:"What Causes It",causes:["A natural decline in reproductive hormones with age","Can also occur earlier due to surgery or certain medical treatments"],preventionLabel:"Managing Symptoms",prevention:["Regular exercise and a balanced diet support wellbeing","Layered clothing can help manage hot flashes","Discuss hormone therapy or other options with a doctor if symptoms are disruptive"],doctor:"See a doctor if symptoms significantly disrupt daily life, or for very heavy bleeding or bleeding after menopause has been confirmed."},
"Urinary Tract Infections":{overview:"Urinary tract infections are common bacterial infections of the bladder or urinary tract, more frequent in women, and usually treatable with antibiotics.",symptoms:["Burning sensation during urination","Frequent urge to urinate","Cloudy or strong-smelling urine","Lower abdominal discomfort"],causesLabel:"Risk Factors",causes:["Bacteria entering the urinary tract","Not urinating after sexual activity","Dehydration","Holding urine for long periods"],preventionLabel:"Prevention",prevention:["Drink plenty of water","Urinate after sexual activity","Wipe front to back","Avoid holding urine for long periods"],doctor:"See a doctor for burning urination or frequent urges — untreated UTIs can spread to the kidneys, especially if fever or back pain develops."},
"Breast Cancer Awareness & Self-Exam":{overview:"Breast cancer is one of the most common cancers, and early detection through self-awareness and screening greatly improves treatment outcomes.",symptoms:["A new lump or thickening in the breast or underarm","Changes in breast size or shape","Skin dimpling or redness","Nipple discharge or inversion"],causesLabel:"Risk Factors",causes:["Family history of breast cancer","Increasing age","Hormonal factors","Lifestyle factors such as obesity and alcohol use"],preventionLabel:"Early Detection",prevention:["Perform regular self-exams to know what's normal for you","Attend clinical breast exams and screening as recommended for your age","Maintain a healthy weight and limit alcohol"],doctor:"See a doctor promptly for any new lump, skin change, or nipple discharge — most lumps are not cancer, but all should be checked."},
"Erectile Dysfunction":{overview:"Erectile dysfunction is the persistent difficulty achieving or maintaining an erection, and it's often linked to underlying physical or psychological causes.",symptoms:["Difficulty achieving an erection","Difficulty maintaining an erection","Reduced sexual desire in some cases"],causesLabel:"Common Causes",causes:["Cardiovascular disease and poor blood flow","Diabetes","Stress, anxiety, or depression","Smoking and excessive alcohol use"],preventionLabel:"Management",prevention:["Manage underlying conditions like diabetes and heart disease","Exercise regularly and maintain a healthy weight","Limit alcohol and avoid smoking","Address stress or relationship concerns"],doctor:"See a doctor if this happens persistently — it can be an early sign of cardiovascular disease and is often very treatable."},
"Low Testosterone":{overview:"Low testosterone can occur with aging or underlying health conditions, affecting energy, mood, and physical health.",symptoms:["Fatigue and low energy","Reduced muscle mass","Low sex drive","Mood changes"],causesLabel:"Causes",causes:["Natural aging","Obesity","Chronic illness","Certain medications"],preventionLabel:"Management",prevention:["Maintain a healthy weight through diet and exercise","Get adequate sleep","Manage chronic health conditions","Discuss treatment options with a doctor if levels are confirmed low"],doctor:"See a doctor if you experience persistent fatigue, low mood, or reduced sex drive — a blood test can check hormone levels."},
"Male Infertility":{overview:"Male infertility refers to difficulty conceiving due to factors affecting sperm production or delivery, and many causes are treatable.",symptoms:["Difficulty conceiving after a year of trying","Changes in sexual function in some cases","Often no obvious symptoms"],causesLabel:"Common Causes",causes:["Low sperm count or quality","Hormonal imbalances","Varicocele (enlarged veins in the scrotum)","Lifestyle factors such as smoking and excessive alcohol"],preventionLabel:"What Helps",prevention:["Maintain a healthy weight and balanced diet","Avoid smoking, excessive alcohol, and recreational drugs","Avoid excessive heat exposure to the testicles","Manage stress"],doctor:"See a doctor if conception hasn't occurred after a year of trying — a simple semen analysis can identify many treatable causes."},
"Dementia and Memory Loss":{overview:"Dementia is a decline in memory and thinking abilities that interferes with daily life, most commonly affecting older adults.",symptoms:["Memory loss that disrupts daily life","Difficulty with familiar tasks","Confusion about time or place","Changes in mood or personality"],causesLabel:"Risk Factors",causes:["Increasing age","Family history","Cardiovascular risk factors like high blood pressure","Reduced social and mental engagement"],preventionLabel:"What May Help",prevention:["Stay mentally and socially active","Manage cardiovascular risk factors","Maintain a healthy diet and regular exercise","Get adequate sleep"],doctor:"See a doctor if memory loss is affecting daily functioning — early diagnosis allows for better planning and support, and some causes are treatable."},
"Fall Prevention in Older Adults":{overview:"Falls are a leading cause of injury in older adults, but many falls are preventable with simple safety measures.",symptoms:["Loss of balance during standing or walking","Weakness affecting mobility","Dizziness on standing"],causesLabel:"Risk Factors",causes:["Muscle weakness and poor balance","Vision problems","Home hazards like loose rugs or poor lighting","Certain medications causing dizziness"],preventionLabel:"Prevention",prevention:["Remove tripping hazards at home","Ensure good lighting, especially on stairs","Use assistive devices like railings when needed","Have regular vision and medication reviews"],doctor:"See a doctor after any fall, even without obvious injury, and for recurring dizziness or balance problems."},
"Osteoporosis":{overview:"Osteoporosis is a condition where bones become weak and brittle, increasing fracture risk, and is especially common after menopause.",symptoms:["Often no symptoms until a fracture occurs","Loss of height over time","Stooped posture","Back pain from a fractured or collapsed vertebra"],causesLabel:"Risk Factors",causes:["Increasing age","Menopause and lower estrogen levels","Low calcium and vitamin D intake","Sedentary lifestyle"],preventionLabel:"Prevention",prevention:["Eat calcium and vitamin D-rich foods","Engage in weight-bearing exercise","Avoid smoking and excessive alcohol","Consider bone density screening after menopause"],doctor:"See a doctor about bone density screening if you're postmenopausal or have risk factors — osteoporosis is often silent until a fracture occurs."},
"Acne":{overview:"Acne is a common skin condition caused by clogged hair follicles, most frequent during adolescence but can affect adults too.",symptoms:["Whiteheads and blackheads","Pimples and pustules","Oily skin","In severe cases, cysts or nodules"],causesLabel:"Causes",causes:["Excess oil production","Clogged pores","Hormonal changes","Certain medications or cosmetics"],preventionLabel:"Management",prevention:["Wash face gently twice daily","Avoid picking or squeezing pimples","Use non-comedogenic skincare products","Consider topical treatments for persistent acne"],doctor:"See a doctor or dermatologist for severe or persistent acne, especially if it's causing scarring or emotional distress — effective treatments are available."},
"Eczema":{overview:"Eczema is a chronic condition causing dry, itchy, and inflamed skin, often starting in childhood and linked to allergies.",symptoms:["Dry, itchy skin","Red or inflamed patches","Cracked or scaly skin","Thickened skin from repeated scratching"],causesLabel:"Triggers",causes:["Irritants like soaps and detergents","Allergens such as dust or pet dander","Dry weather","Stress"],preventionLabel:"Management",prevention:["Moisturize skin regularly","Avoid known triggers and harsh soaps","Use lukewarm water for bathing","Apply prescribed treatments during flare-ups"],doctor:"See a doctor if eczema is severe, widespread, or shows signs of infection like increased redness, warmth, or pus."},
"Sinusitis":{overview:"Sinusitis is inflammation of the sinuses, often following a cold, causing facial pressure and nasal congestion.",symptoms:["Facial pain or pressure","Nasal congestion","Thick nasal discharge","Reduced sense of smell"],causesLabel:"Causes",causes:["Viral infections (most common)","Bacterial infections","Allergies","Nasal polyps or structural issues"],preventionLabel:"Prevention & Care",prevention:["Stay hydrated to thin mucus","Use saline nasal rinses","Avoid known allergens","Treat colds and allergies promptly"],doctor:"See a doctor if symptoms last more than ten days, are severe, or improve then worsen again — this may indicate a bacterial infection needing treatment."},
"Choking Response":{overview:"Choking occurs when the airway is blocked by food or an object, and quick action can be lifesaving.",symptoms:["Unable to speak, cough, or breathe","Clutching the throat","Bluish lips or face","Panic or distress"],causesLabel:"What To Do",causes:["Encourage the person to cough if they can","Give firm back blows between the shoulder blades if they cannot cough","Perform abdominal thrusts (Heimlich maneuver) if back blows don't work"],preventionLabel:"Prevention",prevention:["Cut food into small pieces, especially for children and older adults","Avoid talking or laughing while eating","Supervise young children during meals"],doctor:"Call emergency services immediately if the person cannot breathe, speak, or the object cannot be dislodged quickly."},
"Cardiopulmonary Resuscitation (CPR) Basics":{overview:"CPR is an emergency procedure that can keep blood flowing to vital organs when someone's heart stops, and can be lifesaving until professional help arrives.",symptoms:["Person is unresponsive and not breathing normally","No pulse detected","Signs of cardiac arrest"],causesLabel:"Basic Steps",causes:["Call emergency services immediately","Push hard and fast in the center of the chest, about 100-120 compressions per minute","Continue until help arrives or the person responds"],preventionLabel:"Preparation",prevention:["Take a certified CPR course to learn proper technique","Know the location of nearby defibrillators (AEDs)","Act quickly — early CPR significantly improves survival"],doctor:"Call emergency services immediately for any unresponsive person who is not breathing normally — begin CPR right away if trained."},
"Fracture First Aid":{overview:"A fracture is a broken bone, and proper first aid can prevent further injury while awaiting medical care.",symptoms:["Severe pain at the injury site","Swelling and bruising","Visible deformity","Inability to move or bear weight on the area"],causesLabel:"What To Do",causes:["Keep the injured area still and supported","Apply a splint if trained, without forcing the bone back into place","Apply ice wrapped in cloth to reduce swelling","Avoid moving the person unnecessarily if a spinal injury is suspected"],preventionLabel:"What Not To Do",prevention:["Do not try to realign the bone","Do not move the person unnecessarily","Do not give food or water if surgery may be needed"],doctor:"Seek medical care for any suspected fracture — an X-ray is needed to confirm and guide proper treatment."},
"Safe Sex Practices":{overview:"Safe sex practices reduce the risk of sexually transmitted infections and unintended pregnancy while supporting healthy relationships.",symptoms:["Consistent and correct condom use","Open communication with partners about sexual health","Regular testing if sexually active with multiple partners"],causesLabel:"Key Practices",causes:["Use condoms consistently and correctly","Limit the number of sexual partners","Get tested regularly and know your partner's status"],preventionLabel:"Additional Protection",prevention:["Consider vaccination for HPV where available","Discuss contraception options with a health provider","Avoid sex under the influence of alcohol or drugs, which can impair judgment"],doctor:"See a healthcare provider for regular STI testing if sexually active, and for guidance on contraception options that suit you."},
"Emergency Contraception":{overview:"Emergency contraception can prevent pregnancy after unprotected sex or contraceptive failure, and is most effective when used as soon as possible.",symptoms:["Used within 72-120 hours of unprotected sex depending on method","Available as pills or a copper IUD","Not intended as a regular contraception method"],causesLabel:"When It's Used",causes:["After unprotected sexual intercourse","After contraceptive failure such as a broken condom","After a missed regular contraceptive dose"],preventionLabel:"Important Notes",prevention:["Effectiveness decreases the longer you wait, so act quickly","It does not protect against STIs","Consider a regular contraception method for ongoing prevention"],doctor:"Speak with a pharmacist or healthcare provider as soon as possible after unprotected sex to discuss emergency contraception options."},
"HIV Testing & Counselling":{overview:"HIV testing is a simple, confidential way to know your status, and early diagnosis allows for effective treatment that keeps people healthy.",symptoms:["Many people with HIV have no symptoms for years","Testing is the only way to know your status for certain","Some experience flu-like symptoms shortly after infection"],causesLabel:"Who Should Test",causes:["Anyone who is sexually active, especially with new or multiple partners","Anyone who has shared needles","Pregnant women, as part of routine antenatal care"],preventionLabel:"What Happens Next",prevention:["Testing is confidential and often free at public health clinics","Counselling is provided alongside testing to explain results","Early treatment with antiretroviral therapy allows people with HIV to live long, healthy lives"],doctor:"Visit a testing and counselling center if you think you may be at risk — knowing your status is the first step to staying healthy."},
"Air Pollution & Respiratory Health":{overview:"Air pollution from vehicles, industry, and indoor cooking smoke is a major health risk across South Asian cities, affecting the lungs and heart.",symptoms:["Coughing and throat irritation","Worsening of asthma or COPD symptoms","Eye irritation","Reduced lung function over time"],causesLabel:"Sources",causes:["Vehicle emissions","Industrial pollution","Indoor smoke from cooking fires","Crop burning and dust"],preventionLabel:"Protective Steps",prevention:["Check air quality index before outdoor activity","Wear a mask on high-pollution days","Use cleaner cooking fuels where possible","Improve ventilation indoors"],doctor:"See a doctor if you have persistent coughing, breathlessness, or worsening of an existing respiratory condition on high-pollution days."},
"Mosquito-Borne Disease Prevention":{overview:"Diseases like dengue, malaria, and chikungunya are spread by mosquitoes, and community-wide prevention efforts are key to reducing transmission.",symptoms:["Fever, joint pain, and rash can indicate a mosquito-borne illness","Standing water around homes is a common breeding site","Outbreaks often follow the rainy season"],causesLabel:"Why It Spreads",causes:["Mosquitoes breed in even small amounts of standing water","Peak biting times vary by species — some bite at dawn and dusk, others during the day","Urban areas with poor drainage see higher transmission"],preventionLabel:"Prevention",prevention:["Empty and clean water-holding containers weekly","Use mosquito nets and repellents","Wear protective clothing during peak biting hours","Support community fogging and clean-up programmes"],doctor:"See a doctor promptly for fever with joint pain, rash, or headache during mosquito season in your area."},
"Waterborne Disease Prevention":{overview:"Diseases like cholera, typhoid, and hepatitis A spread through contaminated water, and safe water practices protect entire communities.",symptoms:["Diarrhea and vomiting are common early signs","Symptoms can appear within hours to weeks depending on the disease","Outbreaks often follow flooding or water contamination events"],causesLabel:"Why It Spreads",causes:["Contaminated drinking water sources","Poor sanitation infrastructure","Flooding that mixes sewage with drinking water"],preventionLabel:"Prevention",prevention:["Boil or treat drinking water when safety is uncertain","Practice good hand hygiene","Store water in clean, covered containers","Support community sanitation improvements"],doctor:"See a doctor for persistent diarrhea, vomiting, or signs of dehydration, especially after flooding or a known water contamination event."},
"Neck Pain":{overview:"Neck pain is common and often related to posture, muscle strain, or prolonged screen use, and usually improves with simple self-care.",symptoms:["Stiffness or difficulty turning the head","Dull or sharp pain in the neck","Headaches originating from the neck","Muscle tightness in the shoulders"],causesLabel:"Causes",causes:["Poor posture, especially during phone or computer use","Sleeping in an awkward position","Muscle strain from sudden movements","Stress-related muscle tension"],preventionLabel:"Prevention & Self-Care",prevention:["Maintain good posture, especially while using screens","Take regular breaks from prolonged sitting","Use a supportive pillow while sleeping","Gentle neck stretches and exercise"],doctor:"See a doctor if neck pain is severe, follows an injury, or comes with numbness, tingling, or weakness in the arms."},
"Rheumatoid Arthritis":{overview:"Rheumatoid arthritis is an autoimmune condition where the immune system attacks the joints, causing pain, swelling, and stiffness.",symptoms:["Joint pain and swelling, often in both hands and feet","Morning stiffness lasting more than 30 minutes","Fatigue","Warmth and tenderness in affected joints"],causesLabel:"Risk Factors",causes:["Family history of autoimmune conditions","Being female (more common in women)","Smoking","Environmental triggers in genetically susceptible people"],preventionLabel:"Management",prevention:["Early diagnosis and treatment slow joint damage","Regular gentle exercise maintains joint function","Avoid smoking","Follow prescribed medication plans consistently"],doctor:"See a doctor if you have persistent joint pain and stiffness, especially affecting both sides of the body — early treatment prevents joint damage."},
"Gout":{overview:"Gout is a form of arthritis caused by a buildup of uric acid crystals in the joints, often causing sudden, severe pain, commonly in the big toe.",symptoms:["Sudden, severe joint pain, often in the big toe","Swelling and redness","Warmth in the affected joint","Attacks that can wake you at night"],causesLabel:"Risk Factors",causes:["High intake of red meat, seafood, and alcohol","Obesity","Certain medications","Family history"],preventionLabel:"Prevention",prevention:["Limit alcohol, especially beer","Reduce intake of red meat and organ meats","Stay well hydrated","Maintain a healthy weight"],doctor:"See a doctor for sudden, severe joint pain and swelling — gout is very treatable, and recurring attacks can be prevented with medication and diet changes."}
};

bn:{overview:"ডেঙ্গু মশাবাহিত একটি ভাইরাল রোগ, যা দক্ষিণ এশিয়ায় বর্ষা মৌসুমে ও তার পরে বেশি দেখা যায়।",symptoms:["হঠাৎ তীব্র জ্বর","মাথাব্যথা ও চোখের পেছনে ব্যথা","গাঁটে ও মাংসপেশিতে ব্যথা","ত্বকে র\u200c্যাশ"],prevention:["বাড়ির আশেপাশে পানি জমতে না দেওয়া","মশারি ও মশা প্রতিরোধক ব্যবহার করা","ফুলহাতা পোশাক পরা"],doctor:"তীব্র পেটব্যথা, ক্রমাগত বমি, রক্তক্ষরণ বা শ্বাসকষ্ট হলে অবিলম্বে ডাক্তারের কাছে যান।"}},
"Type 2 Diabetes":{hi:{overview:"टाइप 2 डायबिटीज़ एक दीर्घकालिक स्थिति है जिसमें शरीर रक्त शर्करा को ठीक से नियंत्रित नहीं कर पाता। जीवनशैली में बदलाव और दवा से इसे प्रबंधित किया जा सकता है।",symptoms:["अधिक प्यास और बार-बार पेशाब आना","बिना कारण थकान","धुंधला दिखना","घाव धीरे भरना"],prevention:["वजन नियंत्रित रखें","नियमित व्यायाम करें","साबुत अनाज और सब्जियां खाएं","नियमित रूप से शुगर जांच कराएं"],doctor:"लगातार प्यास, थकान या अस्पष्टीकृत वजन परिवर्तन होने पर डॉक्टर से मिलें।"},
bn:{overview:"টাইপ ২ ডায়াবেটিস একটি দীর্ঘমেয়াদী অবস্থা যেখানে শরীর রক্তে শর্করার মাত্রা ঠিকমতো নিয়ন্ত্রণ করতে পারে না। জীবনযাত্রার পরিবর্তন ও ওষুধের মাধ্যমে এটি নিয়ন্ত্রণ করা যায়।",symptoms:["অতিরিক্ত পিপাসা ও ঘন ঘন প্রস্রাব","অকারণ ক্লান্তি","ঝাপসা দৃষ্টি","ক্ষত ধীরে শুকানো"],prevention:["সুস্থ ওজন বজায় রাখা","নিয়মিত ব্যায়াম করা","পূর্ণ শস্য ও সবজি খাওয়া","নিয়মিত রক্তে শর্করা পরীক্ষা করা"],doctor:"ক্রমাগত পিপাসা, ক্লান্তি বা অস্বাভাবিক ওজন পরিবর্তন হলে ডাক্তার দেখান।"}},
"Diarrhea in Children":{hi:{overview:"दस्त छोटे बच्चों में बीमारी का एक प्रमुख कारण है, जो अक्सर संक्रमण के कारण होता है और दूषित भोजन या पानी से फैलता है।",symptoms:["बार-बार पतले दस्त","उल्टी","भूख कम लगना","निर्जलीकरण के लक्षण जैसे सूखा मुंह और कम पेशाब"],prevention:["ओआरएस (ORS) और ज़िंक दें","स्तनपान या खिलाना जारी रखें","साबुन से हाथ धोएं","सुरक्षित पेयजल सुनिश्चित करें"],doctor:"मल में खून, लगातार उल्टी, निर्जलीकरण के लक्षण या दस्त कई दिनों तक रहने पर तुरंत डॉक्टर से मिलें।"},
bn:{overview:"ডায়রিয়া ছোট শিশুদের অসুস্থতার একটি প্রধান কারণ, যা সাধারণত সংক্রমণের ফলে হয় এবং দূষিত খাবার বা পানির মাধ্যমে ছড়ায়।",symptoms:["ঘন ঘন পাতলা পায়খানা","বমি","ক্ষুধামন্দা","পানিশূন্যতার লক্ষণ যেমন শুকনো মুখ ও কম প্রস্রাব"],prevention:["ওআরএস (ORS) ও জিঙ্ক দেওয়া","বুকের দুধ বা খাওয়ানো চালিয়ে যাওয়া","সাবান দিয়ে হাত ধোয়া","নিরাপদ পানীয় জল নিশ্চিত করা"],doctor:"পায়খানায় রক্ত, ক্রমাগত বমি, পানিশূন্যতার লক্ষণ বা কয়েকদিনের বেশি ডায়রিয়া থাকলে দ্রুত ডাক্তার দেখান।"}},
"Depression":{hi:{overview:"अवसाद एक सामान्य मानसिक स्वास्थ्य स्थिति है जिसमें लगातार उदासी और दैनिक गतिविधियों में रुचि की कमी होती है। सही सहायता से इसका इलाज संभव है।",symptoms:["लगातार उदासी","पहले पसंद आने वाली चीज़ों में रुचि न होना","नींद या भूख में बदलाव","ऊर्जा की कमी"],prevention:["सामाजिक संबंध बनाए रखें","नियमित शारीरिक गतिविधि करें","पर्याप्त नींद लें","जल्दी पेशेवर मदद लें"],doctor:"यदि उदास मनोदशा दो सप्ताह से अधिक रहे और दैनिक जीवन प्रभावित हो, या आत्म-हानि के विचार आएं, तो तुरंत किसी विशेषज्ञ से बात करें।"},

"Hypertension (High Blood Pressure)":{hi:{overview:"उच्च रक्तचाप धमनियों में लगातार बढ़ा हुआ दबाव है। इसके अक्सर कोई लक्षण नहीं होते, लेकिन यह हृदय रोग और स्ट्रोक का एक बड़ा जोखिम कारक है।",symptoms:["आमतौर पर कोई लक्षण नहीं","कभी-कभी सिरदर्द","गंभीर मामलों में चक्कर आना"],prevention:["नमक का सेवन कम करें","नियमित व्यायाम करें","स्वस्थ वजन बनाए रखें","तनाव प्रबंधन करें","नियमित रूप से रक्तचाप जांच कराएं"],doctor:"साल में कम से कम एक बार रक्तचाप जांच कराएं, या रीडिंग लगातार 140/90 mmHg से ऊपर होने पर डॉक्टर से मिलें।"},
bn:{overview:"উচ্চ রক্তচাপ হলো ধমনীতে ক্রমাগত উচ্চ চাপ। এর প্রায়ই কোনো লক্ষণ থাকে না, তবে এটি হৃদরোগ ও স্ট্রোকের একটি বড় ঝুঁকির কারণ।",symptoms:["সাধারণত কোনো লক্ষণ নেই","মাঝেমধ্যে মাথাব্যথা","গুরুতর ক্ষেত্রে মাথা ঘোরা"],prevention:["লবণ গ্রহণ কমানো","নিয়মিত ব্যায়াম","সুস্থ ওজন বজায় রাখা","মানসিক চাপ নিয়ন্ত্রণ","নিয়মিত রক্তচাপ পরীক্ষা করা"],doctor:"বছরে অন্তত একবার রক্তচাপ পরীক্ষা করুন, অথবা রিডিং ক্রমাগত ১৪০/৯০ mmHg-এর বেশি হলে ডাক্তার দেখান।"}}

/* ======================= STATE ======================= */
const state = {
  authed:false,
  lang:'en',
  view:'home',       // home | category | article
  categoryId:null,
  topicId:null,
  query:'',
  loginTab:'signin',
  edits:{}           // topicId -> {text, ts}
};

let TOPICS = [];
CATEGORIES.forEach(cat=>{
  (TOPIC_LISTS[cat.id]||[]).forEach((title,i)=>{
    TOPICS.push({id:cat.id+'-'+i, title, categoryId:cat.id, hasContent: !!FLAGSHIP[title]});
  });
});

function t(key){ return UI[state.lang][key]; }
function catById(id){ return CATEGORIES.find(c=>c.id===id); }
function topicById(id){ return TOPICS.find(t=>t.id===id); }
function initials(title){ return title.trim().charAt(0).toUpperCase(); }

function generatePlaceholder(title, lang){
  const T = {
    en:{ov:`Add a plain-language overview of ${title} here, based on a trusted source.`,
         sy:[`List the most common symptoms of ${title}`,`Note any warning signs that need urgent care`],
         pv:[`List key prevention or self-care steps`,`Note any vaccination or screening relevant to ${title}`],
         dr:`Describe when a reader should see a health worker or doctor about ${title}.`},
    hi:{ov:`यहाँ ${title} के बारे में एक भरोसेमंद स्रोत के आधार पर सरल भाषा में जानकारी जोड़ें।`,
         sy:[`${title} के सामान्य लक्षणों की सूची बनाएं`,`तुरंत चिकित्सा सहायता की आवश्यकता वाले चेतावनी संकेत नोट करें`],
         pv:[`मुख्य रोकथाम या स्व-देखभाल के उपाय सूचीबद्ध करें`,`${title} से संबंधित कोई टीकाकरण या जांच नोट करें`],
         dr:`बताएं कि पाठक को ${title} के लिए कब स्वास्थ्यकर्मी या डॉक्टर से मिलना चाहिए।`},
    bn:{ov:`এখানে বিশ্বাসযোগ্য উৎসের ভিত্তিতে ${title} সম্পর্কে সহজ ভাষায় একটি সংক্ষিপ্ত বিবরণ যোগ করুন।`,
         sy:[`${title}-এর সাধারণ লক্ষণগুলোর তালিকা করুন`,`জরুরি চিকিৎসার প্রয়োজন এমন সতর্কতা চিহ্ন উল্লেখ করুন`],
         pv:[`মূল প্রতিরোধ বা স্ব-যত্নের পদক্ষেপগুলো তালিকাভুক্ত করুন`,`${title}-এর সাথে সম্পর্কিত কোনো টিকা বা স্ক্রিনিং উল্লেখ করুন`],
         dr:`${title}-এর জন্য কখন একজন স্বাস্থ্যকর্মী বা ডাক্তারের কাছে যাওয়া উচিত তা বর্ণনা করুন।`}
  };
  const x = T[lang]||T.en;
  return {overview:x.ov, symptoms:x.sy, causesLabel:null, causes:[], preventionLabel:t('symptoms')===undefined?'Prevention':'Prevention', prevention:x.pv, doctor:x.dr};
}

/* ======================= RENDER ======================= */
const root = document.getElementById('app');

function render(){
  root.innerHTML = '';
  if(!state.authed){ root.appendChild(renderLogin()); return; }
  root.appendChild(renderAppShell());
}

/* ---------- Login ---------- */
function renderLogin(){
  const wrap = el('div','login-wrap');

  const topbar = el('div','login-topbar');
  const brand = el('div','brand'); brand.innerHTML = `<span class="dot"></span><span class="brand-name">Health Portal</span>`;
  const pills = el('div','lang-pills');
  ['en','hi','bn'].forEach(l=>{
    const b = el('button','lang-pill'+(state.lang===l?' active':'')); b.textContent = l.toUpperCase();
    b.onclick = ()=>{ state.lang=l; render(); };
    pills.appendChild(b);
  });
  topbar.appendChild(brand); topbar.appendChild(pills);
  wrap.appendChild(topbar);

  const card = el('div','login-card');
  const tabrow = el('div','tabrow');
  const tabSignin = el('button','tabbtn'+(state.loginTab==='signin'?' active':'')); tabSignin.textContent = t('signin');
  const tabCreate = el('button','tabbtn'+(state.loginTab==='create'?' active':'')); tabCreate.textContent = t('createacc');
  tabSignin.onclick=()=>{state.loginTab='signin';render();};
  tabCreate.onclick=()=>{state.loginTab='create';render();};
  tabrow.appendChild(tabSignin); tabrow.appendChild(tabCreate);

  const h1 = el('h1'); h1.textContent = t('loginTitle');
  const sub = el('p','login-sub'); sub.textContent = t('loginSub');

  const fEmail = fieldInput(t('email'),'email','you@example.com');
  const fPass = fieldInput(t('password'),'password','\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022');

  const btn = el('button','btn-primary'); btn.textContent = t('signin');
  btn.onclick = (e)=>{ e.preventDefault(); state.authed=true; state.view='home'; render(); };

  const guest = el('button','btn-ghost'); guest.textContent = t('guest');
  guest.onclick = (e)=>{ e.preventDefault(); state.authed=true; state.view='home'; render(); };

  const note = el('div','login-note'); note.innerHTML = `<b>${state.lang==='en'?'Note:':state.lang==='hi'?'नोट:':'নোট:'}</b> ${t('demoNote')}`;

  card.appendChild(tabrow); card.appendChild(h1); card.appendChild(sub);
  card.appendChild(fEmail); card.appendChild(fPass);
  card.appendChild(btn); card.appendChild(guest); card.appendChild(note);
  wrap.appendChild(card);
  return wrap;
}
function fieldInput(label,type,placeholder){
  const f = el('div','field');
  const l = el('label'); l.textContent = label;
  const i = document.createElement('input'); i.type=type; i.placeholder=placeholder;
  f.appendChild(l); f.appendChild(i);
  return f;
}

/* ---------- App shell ---------- */
function renderAppShell(){
  const wrap = el('div');
  wrap.appendChild(renderTopbar());
  const shell = el('div','shell');
  shell.appendChild(renderSidebar());
  const main = el('div','main');
  if(state.view==='home') main.appendChild(renderHome());
  else if(state.view==='category') main.appendChild(renderCategory());
  else if(state.view==='article') main.appendChild(renderArticle());
  shell.appendChild(main);
  wrap.appendChild(shell);
  return wrap;
}

function renderTopbar(){
  const bar = el('div','topbar');
  const brand = el('div','brand');
  brand.style.cursor='pointer';
  brand.innerHTML = `<span class="dot"></span><span class="brand-name">Health Portal</span>`;
  brand.onclick = ()=>{ state.view='home'; state.query=''; render(); };
  bar.appendChild(brand);

  const search = el('div','search-wrap');
  search.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`;
  const input = document.createElement('input'); input.placeholder = t('search'); input.value = state.query;
  input.oninput = (e)=>{ state.query = e.target.value; state.view='search'; renderInto(); };
  search.appendChild(input);
  bar.appendChild(search);

  const right = el('div','topbar-right');
  const pills = el('div','lang-pills');
  ['en','hi','bn'].forEach(l=>{
    const b = el('button','lang-pill'+(state.lang===l?' active':'')); b.textContent = l.toUpperCase();
    b.onclick = ()=>{ state.lang=l; render(); };
    pills.appendChild(b);
  });
  right.appendChild(pills);

  const user = el('div','user-chip');
  user.innerHTML = `<span class="user-avatar">${'J'}</span><span class="user-name">John</span>`;
  right.appendChild(user);

  const signout = el('button','icon-btn'); signout.textContent = t('signout');
  signout.onclick = ()=>{ state.authed=false; state.view='home'; render(); };
  right.appendChild(signout);

  bar.appendChild(right);
  return bar;
}

function renderSidebar(){
  const side = el('div','sidebar');
  const t1 = el('div','side-title'); t1.textContent = t('categories');
  side.appendChild(t1);

  const homeLink = el('button','side-link'+(state.view==='home'?' active':''));
  homeLink.innerHTML = `<span class="swatch" style="background:var(--blue-700)"></span>${t('home')}`;
  homeLink.onclick = ()=>{ state.view='home'; render(); };
  side.appendChild(homeLink);

  CATEGORIES.forEach(cat=>{
    const link = el('button','side-link'+(state.view!=='home'&&state.categoryId===cat.id?' active':''));
    const color = cat.color==='blue'?'var(--blue-700)':'var(--green-700)';
    link.innerHTML = `<span class="swatch" style="background:${color}"></span>${cat.name[state.lang]}<span class="count">${(TOPIC_LISTS[cat.id]||[]).length}</span>`;
    link.onclick = ()=>{ state.view='category'; state.categoryId=cat.id; render(); };
    side.appendChild(link);
  });
  return side;
}

/* ---------- Home ---------- */
function renderHome(){
  const wrap = el('div');

  const hero = el('div','hero');
  const eyebrow = el('div','hero-eyebrow'); eyebrow.textContent = 'HEALTH PORTAL \u00b7 PROTOTYPE';
  const h1 = el('h1'); h1.textContent = t('heroTitle');
  const p = el('p'); p.textContent = t('heroSub');
  const reviewedCount = Object.keys(FLAGSHIP).length;
  const cov = el('div','coverage');
  cov.appendChild(covItem(reviewedCount, t('coverage1')));
  cov.appendChild(covItem(TOPICS.length-reviewedCount, t('coverage2')));
  cov.appendChild(covItem(CATEGORIES.length, t('coverage3')));
  hero.appendChild(eyebrow); hero.appendChild(h1); hero.appendChild(p); hero.appendChild(cov);
  wrap.appendChild(hero);

  if(state.view==='search' || state.query){
    wrap.appendChild(renderSearchResults());
    return wrap;
  }

  const head = el('div','section-head');
  const h2 = el('h2'); h2.textContent = t('categories');
  const sub = el('div','sub'); sub.textContent = TOPICS.length + ' ' + t('topics');
  head.appendChild(h2); head.appendChild(sub);
  wrap.appendChild(head);

  const grid = el('div','cat-grid');
  CATEGORIES.forEach(cat=>{
    const card = el('button','cat-card');
    const seal = el('div','seal '+cat.color);
    seal.innerHTML = `<span>${initials(cat.name.en)}</span>`;
    const body = el('div');
    const title = el('div','cat-title'); title.textContent = cat.name[state.lang];
    const desc = el('div','cat-desc'); desc.textContent = cat.desc[state.lang];
    const reviewedInCat = (TOPIC_LISTS[cat.id]||[]).filter(x=>FLAGSHIP[x]).length;
    const meta = el('div','cat-meta'); meta.innerHTML = `${(TOPIC_LISTS[cat.id]||[]).length} ${t('topics')} \u00b7 <b>${reviewedInCat} ${t('reviewed').toLowerCase()}</b>`;
    body.appendChild(title); body.appendChild(desc); body.appendChild(meta);
    card.appendChild(seal); card.appendChild(body);
    card.onclick = ()=>{ state.view='category'; state.categoryId=cat.id; render(); };
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}
function covItem(num,lbl){
  const d = el('div','coverage-item');
  d.innerHTML = `<div class="num">${num}</div><div class="lbl">${lbl}</div>`;
  return d;
}

function renderSearchResults(){
  const wrap = el('div');
  const q = state.query.trim().toLowerCase();
  const results = q ? TOPICS.filter(x=>x.title.toLowerCase().includes(q)) : [];
  const head = el('div','section-head');
  const h2 = el('h2'); h2.textContent = state.lang==='en'?`Results for \u201c${state.query}\u201d`: state.lang==='hi'?`\u201c${state.query}\u201d के लिए परिणाम`:`\u201c${state.query}\u201d এর ফলাফল`;
  head.appendChild(h2);
  wrap.appendChild(head);
  if(results.length===0){
    const p = el('p'); p.style.color='var(--muted)'; p.style.fontSize='13.5px'; p.textContent = t('noResults');
    wrap.appendChild(p);
    return wrap;
  }
  wrap.appendChild(topicGrid(results));
  return wrap;
}

/* ---------- Category ---------- */
function renderCategory(){
  const cat = catById(state.categoryId);
  const wrap = el('div');
  const crumbs = el('div','crumbs');
  const backBtn = el('button'); backBtn.textContent = t('backToHome'); backBtn.onclick=()=>{state.view='home';render();};
  crumbs.appendChild(backBtn);
  crumbs.appendChild(document.createTextNode('  /  '+cat.name[state.lang]));
  wrap.appendChild(crumbs);

  const pt = el('div','page-title');
  const seal = el('div','seal '+cat.color); seal.style.width='40px'; seal.style.height='40px'; seal.style.fontSize='14px';
  seal.innerHTML = `<span>${initials(cat.name.en)}</span>`;
  const h1 = el('h1'); h1.textContent = cat.name[state.lang];
  pt.appendChild(seal); pt.appendChild(h1);
  wrap.appendChild(pt);

  const sub = el('div','page-sub'); sub.textContent = cat.desc[state.lang];
  wrap.appendChild(sub);

  const topics = TOPICS.filter(x=>x.categoryId===cat.id);
  wrap.appendChild(topicGrid(topics));
  return wrap;
}

function topicGrid(topics){
  const grid = el('div','topic-grid');
  topics.forEach(topic=>{
    const card = el('button','topic-card');
    const edited = state.edits[topic.id];
    const badge = el('span','badge '+(edited?'edited':(topic.hasContent?'reviewed':'draft')));
    badge.textContent = edited ? t('edited') : (topic.hasContent ? t('reviewed') : t('draft'));
    const title = el('div','t-title'); title.textContent = topic.title;
    const excerpt = el('div','t-excerpt');
    excerpt.textContent = topic.hasContent ? (FLAGSHIP[topic.title].overview.slice(0,90)+'\u2026') : (state.lang==='en'?'Not yet drafted.':state.lang==='hi'?'अभी मसौदा तैयार नहीं है।':'এখনও খসড়া তৈরি হয়নি।');
    card.appendChild(badge); card.appendChild(title); card.appendChild(excerpt);
    card.onclick = ()=>{ state.view='article'; state.topicId=topic.id; render(); };
    grid.appendChild(card);
  });
  return grid;
}

/* ---------- Article ---------- */
function renderArticle(){
  const topic = topicById(state.topicId);
  const cat = catById(topic.categoryId);
  const wrap = el('div','article-wrap');

  const crumbs = el('div','crumbs');
  const b1 = el('button'); b1.textContent = t('backToHome'); b1.onclick=()=>{state.view='home';render();};
  const b2 = el('button'); b2.textContent = cat.name[state.lang]; b2.onclick=()=>{state.view='category';state.categoryId=cat.id;render();};
  crumbs.appendChild(b1); crumbs.appendChild(document.createTextNode('  /  ')); crumbs.appendChild(b2);
  wrap.appendChild(crumbs);

  const head = el('div','article-head');
  const h1 = el('h1','article-title'); h1.textContent = topic.title;
  head.appendChild(h1);

  const actions = el('div','article-actions');
  const edited = state.edits[topic.id];

  if(!edited){
    const editBtn = el('button','abtn'); editBtn.innerHTML = `\u270e ${t('edit')}`;
    editBtn.onclick = ()=>{ state.editing = true; renderInto(); };
    actions.appendChild(editBtn);
  } else {
    const resetBtn = el('button','abtn'); resetBtn.textContent = state.lang==='en'?'Reset to draft':state.lang==='hi'?'मसौदे पर वापस जाएं':'খসড়ায় ফিরুন';
    resetBtn.onclick = ()=>{ delete state.edits[topic.id]; render(); };
    actions.appendChild(resetBtn);
  }
  const dlBtn = el('button','abtn primary'); dlBtn.innerHTML = `\u2b07 ${t('download')}`;
  dlBtn.onclick = ()=>downloadArticle(topic);
  actions.appendChild(dlBtn);
  head.appendChild(actions);
  wrap.appendChild(head);

  const disc = el('div','disclaimer'); disc.textContent = t('disclaimer');
  wrap.appendChild(disc);

  if(state.editing){
    wrap.appendChild(renderEditBox(topic));
    return wrap;
  }

  if(edited){
    const body = el('div','article-body');
    const pre = document.createElement('pre');
    pre.style.whiteSpace='pre-wrap'; pre.style.fontFamily="'Source Sans 3'"; pre.style.fontSize='14.8px'; pre.style.lineHeight='1.75'; pre.style.margin='0';
    pre.textContent = edited.text;
    body.appendChild(pre);
    wrap.appendChild(body);
    wrap.appendChild(sourcesBox(cat));
    return wrap;
  }

  if(!topic.hasContent){
    wrap.appendChild(genBox(topic));
    return wrap;
  }

  let data = FLAGSHIP[topic.title];
  let showingFallback = false;
  if(state.lang!=='en'){
    const tr = TRANSLATIONS[topic.title];
    if(tr && tr[state.lang]){
      data = {overview:tr[state.lang].overview, symptoms:tr[state.lang].symptoms, causesLabel:null, causes:[], preventionLabel:null, prevention:tr[state.lang].prevention, doctor:tr[state.lang].doctor};
    } else {
      showingFallback = true;
    }
  }

  if(showingFallback){
    const note = el('div','lang-note'); note.textContent = t('langNote');
    wrap.appendChild(note);
  }

  wrap.appendChild(articleBody(data));
  wrap.appendChild(sourcesBox(cat));
  return wrap;
}

function articleBody(data){
  const body = el('div','article-body');

  const ov = el('div','a-block');
  ov.innerHTML = `<h3>${t('overview')}</h3><p>${escapeHtml(data.overview)}</p>`;
  body.appendChild(ov);

  const sy = el('div','a-block');
  sy.innerHTML = `<h3>${t('symptoms')}</h3><ul>${data.symptoms.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ul>`;
  body.appendChild(sy);

  if(data.causes && data.causes.length){
    const cz = el('div','a-block');
    cz.innerHTML = `<h3>${escapeHtml(data.causesLabel||'Causes')}</h3><ul>${data.causes.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ul>`;
    body.appendChild(cz);
  }

  const pv = el('div','a-block');
  pv.innerHTML = `<h3>${escapeHtml(data.preventionLabel||'Prevention')}</h3><ul>${data.prevention.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ul>`;
  body.appendChild(pv);

  const dr = el('div','a-block');
  dr.innerHTML = `<h3>${t('whenDoctor')}</h3><p>${escapeHtml(data.doctor)}</p>`;
  body.appendChild(dr);

  return body;
}

function sourcesBox(cat){
  const box = el('div','sources-box');
  const h4 = el('h4'); h4.textContent = state.lang==='en'?'Suggested sources to verify against':state.lang==='hi'?'सत्यापन के लिए सुझाए गए स्रोत':'যাচাইয়ের জন্য প্রস্তাবিত উৎস';
  box.appendChild(h4);
  const ul = el('ul');
  sourcesFor(cat.id).forEach(([name,url])=>{
    const li = document.createElement('li');
    li.innerHTML = `<a href="${url}" target="_blank" rel="noopener">${name}</a>`;
    ul.appendChild(li);
  });
  box.appendChild(ul);
  return box;
}

function genBox(topic){
  const box = el('div','gen-box');
  const seal = el('div','seal blue'); seal.style.margin='0 auto 14px'; seal.innerHTML = `<span>${initials(topic.title)}</span>`;
  const h3 = el('h3'); h3.style.margin='0'; h3.style.color='var(--blue-900)'; h3.style.fontSize='16px'; h3.textContent = t('noContentTitle');
  const p = el('p'); p.textContent = t('noContentBody');
  const btn = el('button','abtn primary'); btn.style.width='auto'; btn.style.padding='10px 20px'; btn.innerHTML = `\u2728 ${t('generate')}`;
  btn.onclick = ()=>{
    btn.textContent = t('generating');
    btn.disabled = true;
    setTimeout(()=>{
      const ph = generatePlaceholder(topic.title, state.lang);
      const text = renderPlaceholderAsText(topic.title, ph);
      state.edits[topic.id] = {text, ts:Date.now()};
      render();
    }, 550);
  };
  box.appendChild(seal); box.appendChild(h3); box.appendChild(p); box.appendChild(btn);
  return box;
}

function renderPlaceholderAsText(title, ph){
  const L = UI[state.lang];
  return `${title}\n${'\u2014'.repeat(Math.min(40,title.length))}\n\n${L.overview}:\n${ph.overview}\n\n${L.symptoms}:\n- ${ph.symptoms.join('\n- ')}\n\nPrevention:\n- ${ph.prevention.join('\n- ')}\n\n${L.whenDoctor}:\n${ph.doctor}`;
}

function renderEditBox(topic){
  const wrap = el('div');
  const existingText = state.edits[topic.id] ? state.edits[topic.id].text : articleAsPlainText(topic);
  const ta = document.createElement('textarea'); ta.className='edit-area'; ta.value = existingText;
  wrap.appendChild(ta);
  const actions = el('div','edit-actions');
  const save = el('button','abtn primary'); save.textContent = t('save');
  save.onclick = ()=>{ state.edits[topic.id] = {text: ta.value, ts:Date.now()}; state.editing=false; render(); };
  const cancel = el('button','abtn'); cancel.textContent = t('cancel');
  cancel.onclick = ()=>{ state.editing=false; render(); };
  actions.appendChild(save); actions.appendChild(cancel);
  wrap.appendChild(actions);
  return wrap;
}

function articleAsPlainText(topic){
  if(!topic.hasContent){
    const ph = generatePlaceholder(topic.title, state.lang);
    return renderPlaceholderAsText(topic.title, ph);
  }
  const data = FLAGSHIP[topic.title];
  const L = UI[state.lang];
  return `${topic.title}\n\n${L.overview}:\n${data.overview}\n\n${L.symptoms}:\n- ${data.symptoms.join('\n- ')}\n\n${data.causesLabel||'Causes'}:\n- ${(data.causes||[]).join('\n- ')}\n\n${data.preventionLabel||'Prevention'}:\n- ${data.prevention.join('\n- ')}\n\n${L.whenDoctor}:\n${data.doctor}`;
}

function downloadArticle(topic){
  const text = state.edits[topic.id] ? state.edits[topic.id].text : articleAsPlainText(topic);
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = topic.title.replace(/[^a-z0-9]+/gi,'_')+'_'+state.lang+'.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- helpers ---------- */
function el(tag,cls){ const e = document.createElement(tag||'div'); if(cls) e.className = cls; return e; }
function escapeHtml(s){ return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Lightweight re-render that preserves scroll where possible (used for live search typing)
function renderInto(){
  const activeTag = document.activeElement ? document.activeElement.tagName : null;
  const wasSearchFocused = activeTag==='INPUT' && document.activeElement.closest('.search-wrap');
  const caret = wasSearchFocused ? document.activeElement.selectionStart : null;
  render();
  if(wasSearchFocused){
    const input = document.querySelector('.search-wrap input');
    if(input){ input.focus(); if(caret!=null) input.setSelectionRange(caret,caret); }
  }
}

render();
</script>
</body>
</html>
