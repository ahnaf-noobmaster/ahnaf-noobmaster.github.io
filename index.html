  "en": "Vitamin A deficiency is a leading cause of preventable childhood blindness in developing regions, and it also weakens immune defenses. Watch for night blindness, dry eyes, increased infections, and dry, rough skin. It's caused by diets low in vitamin A-rich foods, with young children and pregnant women most at risk. To prevent it: eat vitamin A-rich foods such as carrots, leafy greens, and dairy, support exclusive breastfeeding for infants, and join vitamin A supplementation programmes for children where offered. See a doctor if a child struggles to see in dim light or has frequent infections — supplementation is safe and effective when guided by a health worker.",
  "hi": "विटामिन ए की कमी विकासशील क्षेत्रों में बचपन में रोकथाम योग्य अंधेपन का एक प्रमुख कारण है और यह प्रतिरक्षा सुरक्षा को भी कमजोर करती है। रतौंधी (कम रोशनी में देखने में कठिनाई), सूखी आंखें, संक्रमण की बढ़ी हुई आवृत्ति, और सूखी, खुरदरी त्वचा पर ध्यान दें। यह विटामिन ए से भरपूर खाद्य पदार्थों की कमी वाले आहार से होता है, जिसमें छोटे बच्चे और गर्भवती महिलाएं सबसे अधिक जोखिम में हैं। बचाव के लिए: गाजर, पत्तेदार सब्जियों, और डेयरी जैसे विटामिन ए युक्त भोजन खाएं, शिशुओं के लिए विशेष स्तनपान का समर्थन करें, और उपलब्ध होने पर बच्चों के लिए विटामिन ए सप्लीमेंटेशन कार्यक्रमों में भाग लें। यदि किसी बच्चे को मंद रोशनी में देखने में कठिनाई हो या बार-बार संक्रमण हो तो डॉक्टर से मिलें — स्वास्थ्यकर्मी के मार्गदर्शन में सप्लीमेंटेशन सुरक्षित और प्रभावी है।",
  "bn": "ভিটামিন এ-এর ঘাটতি উন্নয়নশীল অঞ্চলে শৈশবে প্রতিরোধযোগ্য অন্ধত্বের একটি প্রধান কারণ এবং এটি রোগ প্রতিরোধ ক্ষমতাকেও দুর্বল করে। রাতকানা (কম আলোতে দেখতে অসুবিধা), শুষ্ক চোখ, সংক্রমণের বর্ধিত ফ্রিকোয়েন্সি, এবং শুষ্ক, রুক্ষ ত্বক লক্ষ্য করুন। এটি ভিটামিন এ সমৃদ্ধ খাবারের অভাবযুক্ত খাদ্য থেকে হয়, যেখানে ছোট শিশু ও গর্ভবতী নারীরা সবচেয়ে বেশি ঝুঁকিতে। প্রতিরোধের জন্য: গাজর, শাকসবজি, এবং দুগ্ধজাত খাবারের মতো ভিটামিন এ সমৃদ্ধ খাবার খান, শিশুদের জন্য একচেটিয়া স্তন্যপানকে সমর্থন করুন, এবং উপলব্ধ থাকলে শিশুদের জন্য ভিটামিন এ সাপ্লিমেন্টেশন কর্মসূচিতে অংশগ্রহণ করুন। কোনো শিশুর ক্ষীণ আলোতে দেখতে অসুবিধা হলে বা ঘন ঘন সংক্রমণ হলে ডাক্তার দেখান — স্বাস্থ্যকর্মীর নির্দেশনায় সাপ্লিমেন্টেশন নিরাপদ ও কার্যকর।",
  "ta": "வைட்டமின் ஏ குறைபாடு வளரும் பகுதிகளில் குழந்தைப் பருவ குருட்டுத்தன்மைக்கு முக்கிய காரணமாகும், மேலும் இது நோய் எதிர்ப்பு சக்தியையும் பலவீனப்படுத்துகிறது. இரவுக் குருட்டுத்தன்மை (மங்கலான வெளிச்சத்தில் பார்க்க சிரமம்), வறண்ட கண்கள், அதிகரித்த தொற்று அதிர்வெண், மற்றும் வறண்ட, கரடுமுரடான தோலை கவனியுங்கள். இது வைட்டமின் ஏ நிறைந்த உணவுகள் குறைவான உணவில் இருந்து ஏற்படுகிறது, சிறு குழந்தைகள் மற்றும் கர்ப்பிணிப் பெண்கள் அதிக ஆபத்தில் உள்ளனர். தடுக்க: கேரட், கீரைகள், மற்றும் பால் பொருட்கள் போன்ற வைட்டமின் ஏ நிறைந்த உணவுகளை உண்ணுங்கள், குழந்தைகளுக்கு தனி தாய்ப்பாலை ஆதரிக்கவும், கிடைக்கும்போது குழந்தைகளுக்கான வைட்டமின் ஏ மருந்து திட்டங்களில் பங்கேற்கவும். ஒரு குழந்தை மங்கலான வெளிச்சத்தில் பார்க்க சிரமப்பட்டால் அல்லது அடிக்கடி தொற்று ஏற்பட்டால் மருத்துவரை அணுகவும் — சுகாதார பணியாளரின் வழிகாட்டுதலின் கீழ் மருந்து பாதுகாப்பானது மற்றும் பயனுள்ளது."
 },
 "Stress Management": {
  "en": "Stress is the body's natural response to pressure, and while some stress is normal, chronic stress can affect both physical and mental health. Watch for difficulty sleeping, irritability, feeling overwhelmed, muscle tension, headaches, and trouble concentrating. Common sources include work pressure, financial concerns, relationship difficulties, and major life changes. Coping strategies include regular physical activity, relaxation techniques like deep breathing, staying socially connected, and setting realistic goals with real breaks. See a health professional if stress feels unmanageable, persists for weeks, or affects your sleep, work, or relationships.",
  "hi": "तनाव दबाव के प्रति शरीर की स्वाभाविक प्रतिक्रिया है, और जहां कुछ तनाव सामान्य है, वहीं दीर्घकालिक तनाव शारीरिक और मानसिक स्वास्थ्य दोनों को प्रभावित कर सकता है। नींद में कठिनाई, चिड़चिड़ापन या अभिभूत महसूस करना, मांसपेशियों में तनाव या सिरदर्द, और ध्यान केंद्रित करने में परेशानी पर ध्यान दें। सामान्य स्रोतों में काम या पढ़ाई का दबाव, आर्थिक चिंताएं, रिश्तों की कठिनाइयां, और जीवन में बड़े बदलाव शामिल हैं। मुकाबला करने की रणनीतियों में नियमित शारीरिक गतिविधि, गहरी सांस जैसी विश्राम तकनीकें, सामाजिक संबंध बनाए रखना, और यथार्थवादी लक्ष्य निर्धारित कर ब्रेक लेना शामिल है। यदि तनाव असहनीय लगे, हफ्तों तक बना रहे, या आपकी नींद, काम, या रिश्तों को काफी प्रभावित करे तो स्वास्थ्य पेशेवर से मिलें।",
  "bn": "চাপ হলো চাপের প্রতি শরীরের স্বাভাবিক প্রতিক্রিয়া, এবং কিছু চাপ স্বাভাবিক হলেও দীর্ঘস্থায়ী চাপ শারীরিক ও মানসিক স্বাস্থ্য উভয়কেই প্রভাবিত করতে পারে। ঘুমাতে অসুবিধা, খিটখিটে ভাব বা অভিভূত বোধ করা, পেশির টান বা মাথাব্যথা, এবং মনোযোগ দিতে অসুবিধা লক্ষ্য করুন। সাধারণ উৎসের মধ্যে রয়েছে কাজ বা পড়াশোনার চাপ, আর্থিক উদ্বেগ, সম্পর্কের অসুবিধা, এবং জীবনের বড় পরিবর্তন। মোকাবেলার কৌশলের মধ্যে রয়েছে নিয়মিত শারীরিক কার্যকলাপ, গভীর শ্বাসের মতো শিথিলকরণ কৌশল, সামাজিক সংযোগ বজায় রাখা, এবং বাস্তবসম্মত লক্ষ্য নির্ধারণ করে বিরতি নেওয়া। চাপ অসহনীয় মনে হলে, সপ্তাহের পর সপ্তাহ স্থায়ী হলে, বা আপনার ঘুম, কাজ, বা সম্পর্ককে যথেষ্ট প্রভাবিত করলে স্বাস্থ্য পেশাদারের সাথে দেখা করুন।",
  "ta": "மன அழுத்தம் என்பது அழுத்தத்திற்கு உடலின் இயல்பான பதிலாகும், சில மன அழுத்தம் இயல்பானது என்றாலும், நீண்டகால மன அழுத்தம் உடல் மற்றும் மன ஆரோக்கியம் இரண்டையும் பாதிக்கலாம். தூக்க சிரமம், எரிச்சல் அல்லது மிகைப்பட்ட உணர்வு, தசை இறுக்கம் அல்லது தலைவலி, மற்றும் கவனம் செலுத்துவதில் சிரமத்தை கவனியுங்கள். பொதுவான ஆதாரங்களில் வேலை அல்லது படிப்பு அழுத்தம், நிதி கவலைகள், உறவு சிக்கல்கள், மற்றும் பெரிய வாழ்க்கை மாற்றங்கள் அடங்கும். சமாளிக்கும் உத்திகளில் தொடர்ந்த உடல் செயல்பாடு, ஆழ்ந்த சுவாசம் போன்ற தளர்வு நுட்பங்கள், சமூக தொடர்புகளை பராமரித்தல், மற்றும் யதார்த்தமான இலக்குகளை நிர்ணயித்து ஓய்வு எடுத்தல் ஆகியவை அடங்கும். மன அழுத்தம் நிர்வகிக்க முடியாததாக தோன்றினால், வாரக்கணக்கில் நீடித்தால், அல்லது உங்கள் தூக்கம், வேலை, அல்லது உறவுகளை கணிசமாக பாதித்தால் ஒரு சுகாதார நிபுணரை அணுகவும்."
 },
 "Sleep Disorders (Insomnia)": {
  "en": "Insomnia is difficulty falling asleep, staying asleep, or getting restful sleep, and it can affect daily functioning when it persists. Watch for trouble falling asleep, waking frequently through the night, waking too early, and daytime fatigue or irritability. Common causes include stress, an irregular sleep schedule, screen time before bed, and late-day caffeine. Good sleep hygiene helps: keep a consistent sleep and wake schedule, limit screens before bedtime, and create a calm, dark sleeping environment. See a doctor if insomnia lasts more than a few weeks or significantly affects your daily life — treatable causes are common.",
  "hi": "इनसोमनिया सोने में कठिनाई, नींद बनाए रखने में कठिनाई, या आरामदायक नींद न मिलना है, और यह लगातार बने रहने पर दैनिक कामकाज को प्रभावित कर सकता है। सोने में कठिनाई, रात में बार-बार जागना, बहुत जल्दी जागना, और दिन में थकान या चिड़चिड़ापन पर ध्यान दें। सामान्य कारणों में तनाव या चिंता, अनियमित नींद का समय, सोने से पहले अधिक स्क्रीन समय, और देर दिन में कैफीन या उत्तेजक पदार्थों का उपयोग शामिल है। अच्छी नींद की स्वच्छता युक्तियां: नियमित सोने और जागने का समय रखें, सोने से पहले स्क्रीन सीमित करें, और एक शांत, अंधेरा सोने का वातावरण बनाएं। यदि इनसोमनिया कुछ हफ्तों से अधिक बना रहे या आपके दैनिक जीवन को काफी प्रभावित करे तो डॉक्टर से मिलें — उपचार योग्य अंतर्निहित कारण आम हैं।",
  "bn": "ইনসমনিয়া হলো ঘুমাতে অসুবিধা, ঘুম বজায় রাখতে অসুবিধা, বা আরামদায়ক ঘুম না পাওয়া, এবং এটি স্থায়ী হলে দৈনন্দিন কার্যক্রমকে প্রভাবিত করতে পারে। ঘুমাতে অসুবিধা, রাতে ঘন ঘন জেগে ওঠা, খুব তাড়াতাড়ি জেগে যাওয়া, এবং দিনের বেলা ক্লান্তি বা খিটখিটে ভাব লক্ষ্য করুন। সাধারণ কারণের মধ্যে রয়েছে চাপ বা উদ্বেগ, অনিয়মিত ঘুমের সময়, ঘুমের আগে অতিরিক্ত স্ক্রিন সময়, এবং দিনের শেষে ক্যাফেইন বা উদ্দীপক ব্যবহার। ভালো ঘুমের স্বাস্থ্যবিধি টিপস: নিয়মিত ঘুম ও জাগার সময় রাখুন, ঘুমের আগে স্ক্রিন সীমিত করুন, এবং শান্ত, অন্ধকার ঘুমের পরিবেশ তৈরি করুন। ইনসমনিয়া কয়েক সপ্তাহের বেশি স্থায়ী হলে বা আপনার দৈনন্দিন জীবনকে যথেষ্ট প্রভাবিত করলে ডাক্তার দেখান — চিকিৎসাযোগ্য অন্তর্নিহিত কারণ সাধারণ।",
  "ta": "தூக்கமின்மை என்பது தூங்குவதில் சிரமம், தூக்கத்தைத் தொடர்வதில் சிரமம், அல்லது நிம்மதியான தூக்கம் கிடைக்காமை ஆகும், இது தொடர்ந்தால் அன்றாட செயல்பாட்டை பாதிக்கலாம். தூங்குவதில் சிரமம், இரவில் அடிக்கடி விழித்தல், மிக விரைவில் விழித்தல், மற்றும் பகலில் சோர்வு அல்லது எரிச்சலை கவனியுங்கள். பொதுவான காரணங்களில் மன அழுத்தம் அல்லது கவலை, ஒழுங்கற்ற தூக்க நேரம், படுக்கைக்கு முன் அதிக திரை நேரம், மற்றும் தாமதமாக காஃபின் அல்லது தூண்டுதல் பொருட்களின் பயன்பாடு அடங்கும். நல்ல தூக்க பழக்க குறிப்புகள்: சீரான தூக்க மற்றும் விழிப்பு நேரத்தை பராமரிக்கவும், படுக்கைக்கு முன் திரைகளைக் குறைக்கவும், அமைதியான, இருண்ட தூக்க சூழலை உருவாக்கவும். தூக்கமின்மை சில வாரங்களுக்கு மேல் நீடித்தால் அல்லது உங்கள் அன்றாட வாழ்க்கையை கணிசமாக பாதித்தால் மருத்துவரை அணுகவும் — சிகிச்சையளிக்கக்கூடிய அடிப்படை காரணங்கள் பொதுவானவை."
 },
 "Substance Use & Addiction": {
  "en": "Substance use disorders involve a pattern of using alcohol, tobacco, or other substances that causes real problems in daily life — and recovery support is available. Watch for difficulty controlling use despite wanting to stop, continuing despite negative consequences, withdrawal symptoms, and neglected responsibilities. Contributing factors include genetics, mental health conditions, and social pressures. Support and recovery options include reaching out to a health worker or counsellor, connecting with support groups or helplines, and avoiding high-risk environments. Speak confidentially with a health professional if substance use is affecting your health or relationships — help is available without judgment.",
  "hi": "पदार्थ उपयोग विकारों में शराब, तंबाकू, या अन्य पदार्थों के उपयोग का एक पैटर्न शामिल है जो दैनिक जीवन में गंभीर समस्याएं पैदा करता है, और रिकवरी सहायता उपलब्ध है। रोकना चाहते हुए भी उपयोग को नियंत्रित करने में कठिनाई, नकारात्मक परिणामों के बावजूद उपयोग जारी रखना, उपयोग न करने पर वापसी के लक्षण, और जिम्मेदारियों की उपेक्षा पर ध्यान दें। योगदान करने वाले कारकों में आनुवंशिक और पारिवारिक इतिहास, मानसिक स्वास्थ्य स्थितियां, और सामाजिक दबाव शामिल हैं। सहायता और रिकवरी: सहायता के लिए स्वास्थ्यकर्मी या काउंसलर से संपर्क करें, सहायता समूहों या हेल्पलाइन से जुड़ें, और जहां संभव हो ट्रिगर व उच्च जोखिम वाले वातावरण से बचें। यदि पदार्थ उपयोग आपके स्वास्थ्य, रिश्तों, या जिम्मेदारियों को प्रभावित कर रहा हो तो गोपनीय रूप से स्वास्थ्य पेशेवर से बात करें — बिना किसी निर्णय के मदद उपलब्ध है।",
  "bn": "পদার্থ ব্যবহার ব্যাধিতে অ্যালকোহল, তামাক, বা অন্যান্য পদার্থ ব্যবহারের একটি প্যাটার্ন জড়িত যা দৈনন্দিন জীবনে উল্লেখযোগ্য সমস্যা সৃষ্টি করে, এবং পুনরুদ্ধার সহায়তা পাওয়া যায়। থামতে চাওয়া সত্ত্বেও ব্যবহার নিয়ন্ত্রণে অসুবিধা, নেতিবাচক পরিণতি সত্ত্বেও ব্যবহার চালিয়ে যাওয়া, ব্যবহার না করলে প্রত্যাহার লক্ষণ, এবং দায়িত্ব অবহেলা লক্ষ্য করুন। অবদানকারী কারণের মধ্যে রয়েছে জেনেটিক ও পারিবারিক ইতিহাস, মানসিক স্বাস্থ্য অবস্থা, এবং সামাজিক চাপ। সহায়তা ও পুনরুদ্ধার: সহায়তার জন্য স্বাস্থ্যকর্মী বা কাউন্সেলরের সাথে যোগাযোগ করুন, সহায়তা গ্রুপ বা হেল্পলাইনের সাথে সংযুক্ত হন, এবং যেখানে সম্ভব ট্রিগার ও উচ্চ ঝুঁকিপূর্ণ পরিবেশ এড়িয়ে চলুন। পদার্থ ব্যবহার আপনার স্বাস্থ্য, সম্পর্ক, বা দায়িত্বকে প্রভাবিত করলে গোপনীয়ভাবে স্বাস্থ্য পেশাদারের সাথে কথা বলুন — কোনো বিচার ছাড়াই সাহায্য পাওয়া যায়।",
  "ta": "பொருள் பயன்பாட்டுக் கோளாறுகளில் மது, புகையிலை, அல்லது பிற பொருட்களைப் பயன்படுத்தும் ஒரு முறை அடங்கும், இது அன்றாட வாழ்க்கையில் குறிப்பிடத்தக்க பிரச்சினைகளை ஏற்படுத்துகிறது, மேலும் மீட்சி ஆதரவு கிடைக்கிறது. நிறுத்த விரும்பினாலும் பயன்பாட்டைக் கட்டுப்படுத்துவதில் சிரமம், எதிர்மறை விளைவுகள் இருந்தும் தொடர்ந்து பயன்படுத்துதல், பயன்படுத்தாதபோது திரும்பப் பெறும் அறிகுறிகள், மற்றும் பொறுப்புகளை புறக்கணித்தல் ஆகியவற்றை கவனியுங்கள். பங்களிக்கும் காரணிகளில் மரபணு மற்றும் குடும்ப வரலாறு, மனநல நிலைகள், மற்றும் சமூக அழுத்தங்கள் அடங்கும். ஆதரவு மற்றும் மீட்சி: ஆதரவுக்காக சுகாதார பணியாளர் அல்லது ஆலோசகரை தொடர்பு கொள்ளுங்கள், ஆதரவு குழுக்கள் அல்லது உதவி எண்களுடன் இணையுங்கள், முடிந்தவரை தூண்டுதல்கள் மற்றும் அதிக ஆபத்து சூழல்களைத் தவிர்க்கவும். பொருள் பயன்பாடு உங்கள் ஆரோக்கியம், உறவுகள், அல்லது பொறுப்புகளை பாதித்தால் இரகசியமாக ஒரு சுகாதார நிபுணரிடம் பேசுங்கள் — எந்த தீர்ப்புமின்றி உதவி கிடைக்கிறது."
 },
 "Menopause": {
  "en": "Menopause is the natural end of menstrual cycles, typically occurring between ages forty-five and fifty-five, marking the end of reproductive years. Watch for irregular periods leading up to it, hot flashes, night sweats, mood changes, sleep disturbances, and vaginal dryness. It's caused by a natural decline in reproductive hormones with age, though it can occur earlier due to surgery or certain treatments. To manage symptoms: exercise regularly, eat a balanced diet, dress in layers for hot flashes, and discuss hormone therapy with a doctor if needed. See a doctor if symptoms disrupt daily life, or for heavy or unexpected bleeding after menopause.",
  "hi": "मेनोपॉज मासिक धर्म चक्र का प्राकृतिक अंत है, जो आमतौर पर 45 से 55 वर्ष की उम्र के बीच होता है, जो प्रजनन वर्षों के अंत का प्रतीक है। मेनोपॉज से पहले अनियमित मासिक धर्म, हॉट फ्लैश और रात को पसीना आना, मूड में बदलाव, नींद में गड़बड़ी, और योनि का सूखापन पर ध्यान दें। यह उम्र के साथ प्रजनन हार्मोन में प्राकृतिक गिरावट के कारण होता है, हालांकि सर्जरी या कुछ चिकित्सा उपचारों के कारण यह पहले भी हो सकता है। लक्षणों के प्रबंधन के लिए: नियमित व्यायाम और संतुलित आहार समग्र स्वास्थ्य में सहायता करते हैं, हॉट फ्लैश प्रबंधित करने में परतदार कपड़े मदद कर सकते हैं, और यदि लक्षण परेशान करने वाले हों तो हार्मोन थेरेपी या अन्य विकल्पों पर डॉक्टर से चर्चा करें। यदि लक्षण दैनिक जीवन को काफी बाधित करें, या मेनोपॉज की पुष्टि के बाद बहुत भारी रक्तस्राव या रक्तस्राव हो तो डॉक्टर से मिलें।",
  "bn": "মেনোপজ হলো মাসিক চক্রের স্বাভাবিক সমাপ্তি, যা সাধারণত ৪৫ থেকে ৫৫ বছর বয়সের মধ্যে ঘটে, যা প্রজনন বছরের সমাপ্তি নির্দেশ করে। মেনোপজের আগে অনিয়মিত মাসিক, হট ফ্ল্যাশ ও রাতে ঘাম, মেজাজের পরিবর্তন, ঘুমের ব্যাঘাত, এবং যোনিপথের শুষ্কতা লক্ষ্য করুন। এটি বয়সের সাথে প্রজনন হরমোনের স্বাভাবিক হ্রাসের কারণে হয়, যদিও অস্ত্রোপচার বা নির্দিষ্ট চিকিৎসার কারণে এটি আগেও ঘটতে পারে। লক্ষণ পরিচালনার জন্য: নিয়মিত ব্যায়াম ও সুষম খাদ্য সামগ্রিক সুস্থতায় সহায়তা করে, স্তরযুক্ত পোশাক হট ফ্ল্যাশ পরিচালনায় সাহায্য করতে পারে, এবং লক্ষণ বিঘ্নকারী হলে হরমোন থেরাপি বা অন্যান্য বিকল্প নিয়ে ডাক্তারের সাথে আলোচনা করুন। লক্ষণ দৈনন্দিন জীবনকে যথেষ্ট ব্যাহত করলে, বা মেনোপজ নিশ্চিত হওয়ার পরে খুব ভারী রক্তপাত বা রক্তপাত হলে ডাক্তার দেখান।",
  "ta": "மெனோபாஸ் என்பது மாதவிடாய் சுழற்சியின் இயற்கையான முடிவு ஆகும், பொதுவாக 45 முதல் 55 வயதிற்கு இடையில் ஏற்படுகிறது, இது இனப்பெருக்க ஆண்டுகளின் முடிவைக் குறிக்கிறது. மெனோபாஸிற்கு முன் ஒழுங்கற்ற மாதவிடாய், சூடான அலைகள் மற்றும் இரவு வியர்வை, மனநிலை மாற்றங்கள், தூக்கக் கோளாறுகள், மற்றும் யோனி வறட்சியை கவனியுங்கள். இது வயதுக்கு ஏற்ப இனப்பெருக்க ஹார்மோன்களின் இயற்கையான சரிவால் ஏற்படுகிறது, எனினும் அறுவை சிகிச்சை அல்லது சில மருத்துவ சிகிச்சைகளால் இது முன்னதாகவும் ஏற்படலாம். அறிகுறிகளை நிர்வகிக்க: தொடர்ந்த உடற்பயிற்சி மற்றும் சமச்சீர் உணவு ஒட்டுமொத்த நல்வாழ்வுக்கு உதவுகிறது, அடுக்கு ஆடைகள் சூடான அலைகளை நிர்வகிக்க உதவலாம், அறிகுறிகள் தொந்தரவு செய்தால் ஹார்மோன் சிகிச்சை அல்லது பிற விருப்பங்களை மருத்துவரிடம் விவாதிக்கவும். அறிகுறிகள் அன்றாட வாழ்க்கையை கணிசமாக பாதித்தால், அல்லது மெனோபாஸ் உறுதிசெய்யப்பட்ட பிறகு அதிக இரத்தப்போக்கு இருந்தால் மருத்துவரை அணுகவும்."
 },
 "Urinary Tract Infections": {
  "en": "Urinary tract infections are common bacterial infections of the bladder or urinary tract, more frequent in women, and usually treatable with antibiotics. Watch for a burning sensation when urinating, a frequent urge to go, cloudy or strong-smelling urine, and lower abdominal discomfort. Risk rises with dehydration, holding urine for long periods, and not urinating after sexual activity. To prevent it: drink plenty of water, urinate after sex, wipe front to back, and avoid holding urine too long. See a doctor for burning urination or frequent urges — untreated infections can spread to the kidneys, especially with fever or back pain.",
  "hi": "मूत्र मार्ग संक्रमण मूत्राशय या मूत्र मार्ग के सामान्य बैक्टीरियल संक्रमण हैं, जो महिलाओं में अधिक होते हैं, और आमतौर पर एंटीबायोटिक्स से उपचार योग्य हैं। पेशाब करते समय जलन, बार-बार पेशाब करने की इच्छा, धुंधला या तेज गंध वाला पेशाब, और निचले पेट में असुविधा पर ध्यान दें। निर्जलीकरण, यौन गतिविधि के बाद पेशाब न करना, और लंबे समय तक पेशाब रोकना जोखिम बढ़ाते हैं। बचाव के लिए: खूब पानी पिएं, यौन गतिविधि के बाद पेशाब करें, आगे से पीछे की ओर पोंछें, और लंबे समय तक पेशाब रोकने से बचें। पेशाब में जलन या बार-बार इच्छा होने पर डॉक्टर से मिलें — बिना इलाज के संक्रमण किडनी तक फैल सकता है, खासकर यदि बुखार या पीठ दर्द हो।",
  "bn": "মূত্রনালীর সংক্রমণ মূত্রাশয় বা মূত্রনালীর সাধারণ ব্যাকটেরিয়াজনিত সংক্রমণ, যা নারীদের মধ্যে বেশি হয়, এবং সাধারণত অ্যান্টিবায়োটিক দিয়ে চিকিৎসাযোগ্য। প্রস্রাবের সময় জ্বালা, ঘন ঘন প্রস্রাবের তাগিদ, ঘোলাটে বা তীব্র গন্ধযুক্ত প্রস্রাব, এবং নিম্ন পেটে অস্বস্তি লক্ষ্য করুন। পানিশূন্যতা, যৌন কার্যকলাপের পরে প্রস্রাব না করা, এবং দীর্ঘক্ষণ প্রস্রাব আটকে রাখা ঝুঁকি বাড়ায়। প্রতিরোধের জন্য: প্রচুর পানি পান করুন, যৌন কার্যকলাপের পরে প্রস্রাব করুন, সামনে থেকে পেছনে মুছুন, এবং দীর্ঘক্ষণ প্রস্রাব আটকে রাখা এড়িয়ে চলুন। প্রস্রাবে জ্বালা বা ঘন ঘন তাগিদের জন্য ডাক্তার দেখান — চিকিৎসা ছাড়া সংক্রমণ কিডনিতে ছড়াতে পারে, বিশেষত জ্বর বা পিঠে ব্যথা হলে।",
  "ta": "சிறுநீர் பாதை தொற்றுகள் சிறுநீர்ப்பை அல்லது சிறுநீர் பாதையின் பொதுவான பாக்டீரியா தொற்றுகள் ஆகும், இது பெண்களில் அதிகம் காணப்படுகிறது, பொதுவாக நுண்ணுயிர் எதிர்ப்பிகளால் சிகிச்சையளிக்கக்கூடியது. சிறுநீர் கழிக்கும்போது எரிச்சல், அடிக்கடி சிறுநீர் கழிக்க வேண்டிய தூண்டுதல், மங்கலான அல்லது கடுமையான வாசனையுள்ள சிறுநீர், மற்றும் கீழ் வயிற்று அசௌகரியத்தை கவனியுங்கள். நீரிழப்பு, பாலியல் செயல்பாட்டிற்குப் பின் சிறுநீர் கழிக்காமை, மற்றும் நீண்ட நேரம் சிறுநீரை தடுத்து வைத்தல் ஆபத்தை அதிகரிக்கும். தடுக்க: நிறைய தண்ணீர் குடியுங்கள், பாலியல் செயல்பாட்டிற்குப் பின் சிறுநீர் கழியுங்கள், முன்னிலிருந்து பின்னாக துடைக்கவும், நீண்ட நேரம் சிறுநீரை தடுத்து வைப்பதைத் தவிர்க்கவும். சிறுநீர் கழிக்கும்போது எரிச்சல் அல்லது அடிக்கடி தூண்டுதலுக்கு மருத்துவரை அணுகவும் — சிகிச்சையளிக்கப்படாவிட்டால் தொற்று சிறுநீரகங்களுக்கு பரவலாம், குறிப்பாக காய்ச்சல் அல்லது முதுகு வலியுடன்."
 },
 "Breast Cancer Awareness & Self-Exam": {
  "en": "Breast cancer is one of the most common cancers, and early detection through self-awareness and screening greatly improves treatment outcomes. Watch for a new lump or thickening, changes in breast size or shape, skin dimpling or redness, and nipple discharge or inversion. Risk factors include family history, increasing age, and lifestyle factors like obesity and alcohol use. For early detection: do regular self-exams to know what's normal for you, attend recommended screenings for your age, and maintain a healthy weight. See a doctor promptly for any new lump, skin change, or discharge — most lumps aren't cancer, but all deserve to be checked.",
  "hi": "ब्रेस्ट कैंसर सबसे आम कैंसरों में से एक है, और आत्म-जागरूकता व स्क्रीनिंग के माध्यम से जल्दी पता लगाने से उपचार के परिणाम काफी बेहतर होते हैं। एक नई गांठ या मोटापन, स्तन के आकार या रूप में बदलाव, त्वचा में गड्ढा पड़ना या लालिमा, और निप्पल से स्राव या अंदर धंसना पर ध्यान दें। पारिवारिक इतिहास, बढ़ती उम्र, हार्मोनल कारक, और मोटापा व शराब के सेवन जैसे जीवनशैली कारक जोखिम बढ़ाते हैं। जल्दी पता लगाने के लिए: नियमित रूप से आत्म-परीक्षण करें ताकि आपके लिए सामान्य क्या है यह पता चले, अपनी उम्र के लिए अनुशंसित क्लिनिकल स्तन परीक्षण और स्क्रीनिंग करवाएं, और स्वस्थ वजन बनाए रखें व शराब सीमित करें। किसी भी नई गांठ, त्वचा में बदलाव, या निप्पल स्राव के लिए तुरंत डॉक्टर से मिलें — अधिकांश गांठें कैंसर नहीं होतीं, लेकिन सभी की जांच होनी चाहिए।",
  "bn": "স্তন ক্যান্সার সবচেয়ে সাধারণ ক্যান্সারগুলির একটি, এবং আত্ম-সচেতনতা ও স্ক্রিনিংয়ের মাধ্যমে প্রাথমিক শনাক্তকরণ চিকিৎসার ফলাফল উল্লেখযোগ্যভাবে উন্নত করে। একটি নতুন পিণ্ড বা পুরুত্ব, স্তনের আকার বা আকৃতিতে পরিবর্তন, ত্বকে গর্ত পড়া বা লালভাব, এবং স্তনবৃন্ত থেকে স্রাব বা ভেতরে ঢুকে যাওয়া লক্ষ্য করুন। পারিবারিক ইতিহাস, বর্ধিত বয়স, হরমোনজনিত কারণ, এবং স্থূলতা ও অ্যালকোহল সেবনের মতো জীবনযাত্রার কারণ ঝুঁকি বাড়ায়। প্রাথমিক শনাক্তকরণের জন্য: নিয়মিত আত্ম-পরীক্ষা করুন যাতে আপনার জন্য স্বাভাবিক কী তা জানা যায়, আপনার বয়সের জন্য সুপারিশকৃত ক্লিনিক্যাল স্তন পরীক্ষা ও স্ক্রিনিং করান, এবং সুস্থ ওজন বজায় রাখুন ও অ্যালকোহল সীমিত করুন। কোনো নতুন পিণ্ড, ত্বকের পরিবর্তন, বা স্তনবৃন্তের স্রাবের জন্য অবিলম্বে ডাক্তার দেখান — বেশিরভাগ পিণ্ড ক্যান্সার নয়, তবে সবগুলোই পরীক্ষা করা উচিত।",
  "ta": "மார்பக புற்றுநோய் மிகவும் பொதுவான புற்றுநோய்களில் ஒன்றாகும், மேலும் சுய விழிப்புணர்வு மற்றும் பரிசோதனை மூலம் முன்கூட்டிய கண்டறிதல் சிகிச்சை முடிவுகளை பெரிதும் மேம்படுத்துகிறது. ஒரு புதிய கட்டி அல்லது தடிப்பு, மார்பின் அளவு அல்லது வடிவத்தில் மாற்றங்கள், தோல் உள்ளழுத்தம் அல்லது சிவப்பு, மற்றும் முலைக்காம்பு வடிதல் அல்லது உள்நோக்கி திரும்புதலை கவனியுங்கள். குடும்ப வரலாறு, அதிகரிக்கும் வயது, ஹார்மோன் காரணிகள், மற்றும் பருமன் மற்றும் மது பயன்பாடு போன்ற வாழ்க்கை முறை காரணிகள் ஆபத்தை அதிகரிக்கின்றன. முன்கூட்டிய கண்டறிதலுக்கு: உங்களுக்கு இயல்பானது என்ன என்பதை அறிய தொடர்ந்து சுய பரிசோதனைகள் செய்யுங்கள், உங்கள் வயதிற்கு பரிந்துரைக்கப்பட்ட மருத்துவ மார்பக பரிசோதனைகள் மற்றும் ஸ்கிரீனிங்கில் கலந்துகொள்ளுங்கள், ஆரோக்கியமான எடையை பராமரித்து மதுவைக் கட்டுப்படுத்துங்கள். எந்த புதிய கட்டி, தோல் மாற்றம், அல்லது முலைக்காம்பு வடிதலுக்கும் உடனடியாக மருத்துவரை அணுகவும் — பெரும்பாலான கட்டிகள் புற்றுநோய் அல்ல, ஆனால் அனைத்தும் பரிசோதிக்கப்பட வேண்டும்."

 "Erectile Dysfunction": {
  "en": "Erectile dysfunction is the persistent difficulty achieving or maintaining an erection, often linked to underlying physical or psychological causes. It can involve difficulty achieving or maintaining an erection, and sometimes reduced sexual desire. Common causes include cardiovascular disease, diabetes, stress or anxiety, and smoking or excessive alcohol use. Managing it means addressing the underlying condition: exercise regularly, maintain a healthy weight, limit alcohol, avoid smoking, and address stress or relationship concerns. See a doctor if this happens persistently — it can be an early sign of cardiovascular disease, and it's often very treatable.",
  "hi": "इरेक्टाइल डिसफंक्शन इरेक्शन प्राप्त करने या बनाए रखने में लगातार कठिनाई है, जो अक्सर अंतर्निहित शारीरिक या मनोवैज्ञानिक कारणों से जुड़ी होती है। इरेक्शन प्राप्त करने में कठिनाई, इरेक्शन बनाए रखने में कठिनाई, और कुछ मामलों में कम यौन इच्छा शामिल हो सकती है। सामान्य कारणों में हृदय रोग और खराब रक्त प्रवाह, डायबिटीज, तनाव, चिंता, या डिप्रेशन, और धूम्रपान व अत्यधिक शराब का सेवन शामिल है। इसे प्रबंधित करने का मतलब है अंतर्निहित स्थिति को संबोधित करना: डायबिटीज और हृदय रोग जैसी स्थितियों को प्रबंधित करें, नियमित व्यायाम करें और स्वस्थ वजन बनाए रखें, शराब सीमित करें और धूम्रपान से बचें, और तनाव या रिश्ते की चिंताओं को संबोधित करें। यदि यह बार-बार हो तो डॉक्टर से मिलें — यह हृदय रोग का प्रारंभिक संकेत हो सकता है, और यह अक्सर बहुत उपचार योग्य है।",
  "bn": "ইরেক্টাইল ডিসফাংশন হলো ইরেকশন অর্জন বা বজায় রাখতে ক্রমাগত অসুবিধা, যা প্রায়ই অন্তর্নিহিত শারীরিক বা মনস্তাত্ত্বিক কারণের সাথে যুক্ত। ইরেকশন অর্জনে অসুবিধা, ইরেকশন বজায় রাখতে অসুবিধা, এবং কিছু ক্ষেত্রে কম যৌন আকাঙ্ক্ষা জড়িত থাকতে পারে। সাধারণ কারণের মধ্যে রয়েছে হৃদরোগ ও দুর্বল রক্ত প্রবাহ, ডায়াবেটিস, চাপ, উদ্বেগ, বা বিষণ্নতা, এবং ধূমপান ও অতিরিক্ত অ্যালকোহল সেবন। এটি নিয়ন্ত্রণ করার অর্থ অন্তর্নিহিত অবস্থাকে মোকাবেলা করা: ডায়াবেটিস ও হৃদরোগের মতো অবস্থা নিয়ন্ত্রণ করুন, নিয়মিত ব্যায়াম করুন ও সুস্থ ওজন বজায় রাখুন, অ্যালকোহল সীমিত করুন ও ধূমপান এড়িয়ে চলুন, এবং চাপ বা সম্পর্কের উদ্বেগ মোকাবেলা করুন। এটি ক্রমাগত হলে ডাক্তার দেখান — এটি হৃদরোগের প্রাথমিক লক্ষণ হতে পারে, এবং এটি প্রায়ই খুব চিকিৎসাযোগ্য।",
  "ta": "விறைப்புத்தன்மை குறைபாடு என்பது விறைப்பை அடைவதில் அல்லது பராமரிப்பதில் தொடர்ந்த சிரமம் ஆகும், இது பெரும்பாலும் அடிப்படை உடல் அல்லது உளவியல் காரணங்களுடன் தொடர்புடையது. விறைப்பை அடைவதில் சிரமம், விறைப்பை பராமரிப்பதில் சிரமம், மற்றும் சில நேரங்களில் குறைந்த பாலியல் ஆசை ஆகியவை அடங்கலாம். பொதுவான காரணங்களில் இதய நோய் மற்றும் மோசமான இரத்த ஓட்டம், நீரிழிவு, மன அழுத்தம், கவலை, அல்லது மனச்சோர்வு, மற்றும் புகைபிடித்தல் மற்றும் அதிக மது அருந்துதல் அடங்கும். இதை நிர்வகிப்பது என்பது அடிப்படை நிலையை கையாள்வது: நீரிழிவு மற்றும் இதய நோய் போன்ற நிலைகளை நிர்வகிக்கவும், தொடர்ந்த உடற்பயிற்சி செய்து ஆரோக்கியமான எடையை பராமரிக்கவும், மதுவைக் கட்டுப்படுத்தி புகைபிடித்தலைத் தவிர்க்கவும், மன அழுத்தம் அல்லது உறவு கவலைகளை கையாளவும். இது தொடர்ந்து ஏற்பட்டால் மருத்துவரை அணுகவும் — இது இதய நோயின் ஆரம்ப அறிகுறியாக இருக்கலாம், மேலும் இது பெரும்பாலும் மிகவும் சிகிச்சையளிக்கக்கூடியது."
 },
 "Low Testosterone": {
  "en": "Low testosterone can occur with aging or underlying health conditions, affecting energy, mood, and physical health. Watch for fatigue and low energy, reduced muscle mass, low sex drive, and mood changes. Causes include natural aging, obesity, chronic illness, and certain medications. Management starts with maintaining a healthy weight through diet and exercise, getting adequate sleep, and managing any chronic conditions — treatment options can be discussed with a doctor if levels are confirmed low. See a doctor if you experience persistent fatigue, low mood, or reduced sex drive — a simple blood test can check your hormone levels.",
  "hi": "कम टेस्टोस्टेरोन उम्र बढ़ने या अंतर्निहित स्वास्थ्य स्थितियों के साथ हो सकता है, जो ऊर्जा, मूड, और शारीरिक स्वास्थ्य को प्रभावित करता है। थकान और कम ऊर्जा, मांसपेशियों में कमी, कम यौन इच्छा, और मूड में बदलाव पर ध्यान दें। कारणों में प्राकृतिक उम्र बढ़ना, मोटापा, दीर्घकालिक बीमारी, और कुछ दवाएं शामिल हैं। प्रबंधन आहार और व्यायाम के माध्यम से स्वस्थ वजन बनाए रखने, पर्याप्त नींद लेने, और किसी भी दीर्घकालिक स्वास्थ्य स्थिति को प्रबंधित करने से शुरू होता है — यदि स्तर कम पुष्टि हो तो उपचार विकल्पों पर डॉक्टर से चर्चा की जा सकती है। यदि आप लगातार थकान, कम मूड, या कम यौन इच्छा का अनुभव करें तो डॉक्टर से मिलें — एक साधारण रक्त जांच से हार्मोन स्तर जांचा जा सकता है।",
  "bn": "কম টেস্টোস্টেরন বার্ধক্য বা অন্তর্নিহিত স্বাস্থ্য অবস্থার সাথে ঘটতে পারে, যা শক্তি, মেজাজ, এবং শারীরিক স্বাস্থ্যকে প্রভাবিত করে। ক্লান্তি ও কম শক্তি, কমে যাওয়া পেশির ভর, কম যৌন আকাঙ্ক্ষা, এবং মেজাজের পরিবর্তন লক্ষ্য করুন। কারণের মধ্যে রয়েছে স্বাভাবিক বার্ধক্য, স্থূলতা, দীর্ঘস্থায়ী অসুস্থতা, এবং নির্দিষ্ট ওষুধ। ব্যবস্থাপনা শুরু হয় খাদ্য ও ব্যায়ামের মাধ্যমে সুস্থ ওজন বজায় রাখা, পর্যাপ্ত ঘুম পাওয়া, এবং যেকোনো দীর্ঘস্থায়ী স্বাস্থ্য অবস্থা পরিচালনা করা দিয়ে — স্তর কম নিশ্চিত হলে চিকিৎসার বিকল্প নিয়ে ডাক্তারের সাথে আলোচনা করা যেতে পারে। ক্রমাগত ক্লান্তি, কম মেজাজ, বা কম যৌন আকাঙ্ক্ষা অনুভব করলে ডাক্তার দেখান — একটি সাধারণ রক্ত পরীক্ষায় হরমোনের মাত্রা পরীক্ষা করা যায়।",
  "ta": "குறைந்த டெஸ்டோஸ்டிரோன் வயதாதல் அல்லது அடிப்படை சுகாதார நிலைகளுடன் ஏற்படலாம், இது ஆற்றல், மனநிலை, மற்றும் உடல் ஆரோக்கியத்தை பாதிக்கிறது. சோர்வு மற்றும் குறைந்த ஆற்றல், குறைந்த தசை நிறை, குறைந்த பாலியல் ஆசை, மற்றும் மனநிலை மாற்றங்களை கவனியுங்கள். காரணங்களில் இயற்கையான வயதாதல், பருமன், நீண்டகால நோய், மற்றும் சில மருந்துகள் அடங்கும். நிர்வகிப்பது உணவு மற்றும் உடற்பயிற்சி மூலம் ஆரோக்கியமான எடையை பராமரிப்பது, போதிய தூக்கம் பெறுவது, மற்றும் ஏதேனும் நீண்டகால சுகாதார நிலைகளை நிர்வகிப்பதில் தொடங்குகிறது — அளவுகள் குறைவாக உறுதிசெய்யப்பட்டால் சிகிச்சை விருப்பங்களை மருத்துவரிடம் விவாதிக்கலாம். தொடர்ந்த சோர்வு, குறைந்த மனநிலை, அல்லது குறைந்த பாலியல் ஆசையை நீங்கள் அனுபவித்தால் மருத்துவரை அணுகவும் — ஒரு எளிய இரத்த பரிசோதனை ஹார்மோன் அளவுகளை சரிபார்க்கும்."
 },
 "Male Infertility": {
  "en": "Male infertility refers to difficulty conceiving due to factors affecting sperm production or delivery, and many causes are treatable. It often shows no obvious symptoms beyond difficulty conceiving after a year of trying. Common causes include low sperm count or quality, hormonal imbalances, and varicocele — enlarged veins in the scrotum. What helps: maintaining a healthy weight and balanced diet, avoiding smoking and excessive alcohol, avoiding excessive heat exposure to the testicles, and managing stress. See a doctor if conception hasn't occurred after a year of trying — a simple semen analysis can identify many treatable causes.",
  "hi": "पुरुष बांझपन शुक्राणु उत्पादन या वितरण को प्रभावित करने वाले कारकों के कारण गर्भधारण में कठिनाई को संदर्भित करता है, और कई कारण उपचार योग्य हैं। एक साल की कोशिश के बाद गर्भधारण में कठिनाई के अलावा अक्सर कोई स्पष्ट लक्षण नहीं होते। सामान्य कारणों में कम शुक्राणु संख्या या गुणवत्ता, हार्मोनल असंतुलन, और वैरिकोसील (अंडकोष की नसों का बढ़ना) शामिल है। क्या मदद करता है: स्वस्थ वजन और संतुलित आहार बनाए रखना, धूम्रपान, अत्यधिक शराब, और मनोरंजक दवाओं से बचना, अंडकोष पर अत्यधिक गर्मी के संपर्क से बचना, और तनाव का प्रबंधन करना। यदि एक साल की कोशिश के बाद गर्भधारण न हो तो डॉक्टर से मिलें — एक साधारण वीर्य विश्लेषण कई उपचार योग्य कारणों की पहचान कर सकता है।",
  "bn": "পুরুষ বন্ধ্যাত্ব শুক্রাণু উৎপাদন বা বিতরণকে প্রভাবিত করে এমন কারণের জন্য গর্ভধারণে অসুবিধাকে বোঝায়, এবং অনেক কারণ চিকিৎসাযোগ্য। এক বছর চেষ্টার পরে গর্ভধারণে অসুবিধা ছাড়া প্রায়ই কোনো স্পষ্ট লক্ষণ থাকে না। সাধারণ কারণের মধ্যে রয়েছে কম শুক্রাণু সংখ্যা বা মান, হরমোনজনিত ভারসাম্যহীনতা, এবং ভ্যারিকোসিল (অণ্ডকোষের শিরা বৃদ্ধি)। যা সাহায্য করে: সুস্থ ওজন ও সুষম খাদ্য বজায় রাখা, ধূমপান, অতিরিক্ত অ্যালকোহল, এবং বিনোদনমূলক ওষুধ এড়িয়ে চলা, অণ্ডকোষে অতিরিক্ত তাপের সংস্পর্শ এড়ানো, এবং চাপ নিয়ন্ত্রণ করা। এক বছর চেষ্টার পরেও গর্ভধারণ না হলে ডাক্তার দেখান — একটি সাধারণ বীর্য বিশ্লেষণ অনেক চিকিৎসাযোগ্য কারণ চিহ্নিত করতে পারে।",
  "ta": "ஆண் மலட்டுத்தன்மை என்பது விந்து உற்பத்தி அல்லது விநியோகத்தை பாதிக்கும் காரணிகளால் கர்ப்பம் தரிப்பதில் சிரமத்தைக் குறிக்கிறது, மேலும் பல காரணங்கள் சிகிச்சையளிக்கக்கூடியவை. ஒரு வருடம் முயற்சித்த பிறகு கர்ப்பம் தரிப்பதில் சிரமம் தவிர பெரும்பாலும் தெளிவான அறிகுறிகள் இல்லை. பொதுவான காரணங்களில் குறைந்த விந்து எண்ணிக்கை அல்லது தரம், ஹார்மோன் ஏற்றத்தாழ்வுகள், மற்றும் வெரிகோசீல் (விதை பைகளில் நரம்புகள் பெரிதாதல்) அடங்கும். உதவுவது: ஆரோக்கியமான எடை மற்றும் சமச்சீர் உணவை பராமரித்தல், புகைபிடித்தல், அதிக மது, மற்றும் பொழுதுபோக்கு மருந்துகளைத் தவிர்த்தல், விதை பைகளில் அதிக வெப்ப வெளிப்பாட்டைத் தவிர்த்தல், மற்றும் மன அழுத்தத்தை நிர்வகித்தல். ஒரு வருடம் முயற்சித்த பிறகும் கர்ப்பம் ஏற்படவில்லை என்றால் மருத்துவரை அணுகவும் — ஒரு எளிய விந்து பகுப்பாய்வு பல சிகிச்சையளிக்கக்கூடிய காரணங்களை அடையாளம் காணும்."
 },
 "Dementia and Memory Loss": {
  "en": "Dementia is a decline in memory and thinking abilities that interferes with daily life, most commonly affecting older adults. Watch for memory loss that disrupts daily routines, difficulty with familiar tasks, confusion about time or place, and changes in mood or personality. Risk factors include increasing age, family history, and cardiovascular risk factors like high blood pressure. What may help: staying mentally and socially active, managing cardiovascular risk factors, eating well, and getting enough sleep. See a doctor if memory loss is affecting daily functioning — early diagnosis allows for better planning, and some causes are treatable.",
  "hi": "डिमेंशिया स्मृति और सोचने की क्षमताओं में गिरावट है जो दैनिक जीवन में बाधा डालती है, जो सबसे आम तौर पर वृद्ध वयस्कों को प्रभावित करती है। दैनिक जीवन को बाधित करने वाली स्मृति हानि, परिचित कार्यों में कठिनाई, समय या स्थान के बारे में भ्रम, और मूड या व्यक्तित्व में बदलाव पर ध्यान दें। जोखिम कारकों में बढ़ती उम्र, पारिवारिक इतिहास, उच्च रक्तचाप जैसे हृदय संबंधी जोखिम कारक, और कम सामाजिक व मानसिक जुड़ाव शामिल हैं। क्या मदद कर सकता है: मानसिक और सामाजिक रूप से सक्रिय रहें, हृदय संबंधी जोखिम कारकों को प्रबंधित करें, स्वस्थ आहार और नियमित व्यायाम बनाए रखें, और पर्याप्त नींद लें। यदि स्मृति हानि दैनिक कामकाज को प्रभावित कर रही हो तो डॉक्टर से मिलें — शीघ्र निदान बेहतर योजना और सहायता की अनुमति देता है, और कुछ कारण उपचार योग्य हैं।",
  "bn": "ডিমেনশিয়া হলো স্মৃতি ও চিন্তাশক্তির অবনতি যা দৈনন্দিন জীবনে বাধা সৃষ্টি করে, যা সবচেয়ে বেশি বয়স্ক প্রাপ্তবয়স্কদের প্রভাবিত করে। দৈনন্দিন জীবনে বাধা সৃষ্টিকারী স্মৃতিভ্রংশ, পরিচিত কাজে অসুবিধা, সময় বা স্থান নিয়ে বিভ্রান্তি, এবং মেজাজ বা ব্যক্তিত্বে পরিবর্তন লক্ষ্য করুন। ঝুঁকির কারণের মধ্যে রয়েছে বর্ধিত বয়স, পারিবারিক ইতিহাস, উচ্চ রক্তচাপের মতো হৃদযন্ত্র সংক্রান্ত ঝুঁকির কারণ, এবং হ্রাসপ্রাপ্ত সামাজিক ও মানসিক সম্পৃক্ততা। যা সাহায্য করতে পারে: মানসিক ও সামাজিকভাবে সক্রিয় থাকুন, হৃদযন্ত্র সংক্রান্ত ঝুঁকির কারণ নিয়ন্ত্রণ করুন, সুস্থ খাদ্য ও নিয়মিত ব্যায়াম বজায় রাখুন, এবং পর্যাপ্ত ঘুম নিন। স্মৃতিভ্রংশ দৈনন্দিন কার্যক্রমকে প্রভাবিত করলে ডাক্তার দেখান — প্রাথমিক নির্ণয় ভালো পরিকল্পনা ও সহায়তার সুযোগ দেয়, এবং কিছু কারণ চিকিৎসাযোগ্য।",
  "ta": "டிமென்ஷியா என்பது அன்றாட வாழ்க்கையில் தலையிடும் நினைவாற்றல் மற்றும் சிந்தனை திறன்களின் சரிவு ஆகும், இது பொதுவாக வயதான பெரியவர்களை பாதிக்கிறது. அன்றாட வாழ்க்கையை சீர்குலைக்கும் நினைவாற்றல் இழப்பு, பழக்கமான பணிகளில் சிரமம், நேரம் அல்லது இடம் பற்றிய குழப்பம், மற்றும் மனநிலை அல்லது ஆளுமையில் மாற்றங்களை கவனியுங்கள். ஆபத்து காரணிகளில் அதிகரிக்கும் வயது, குடும்ப வரலாறு, உயர் இரத்த அழுத்தம் போன்ற இருதய ஆபத்து காரணிகள், மற்றும் குறைந்த சமூக மற்றும் மன ஈடுபாடு அடங்கும். என்ன உதவக்கூடும்: மன மற்றும் சமூக ரீதியாக சுறுசுறுப்பாக இருங்கள், இருதய ஆபத்து காரணிகளை நிர்வகிக்கவும், ஆரோக்கியமான உணவு மற்றும் தொடர்ந்த உடற்பயிற்சியை பராமரிக்கவும், போதிய தூக்கம் பெறவும். நினைவாற்றல் இழப்பு அன்றாட செயல்பாட்டை பாதித்தால் மருத்துவரை அணுகவும் — முன்கூட்டிய கண்டறிதல் சிறந்த திட்டமிடல் மற்றும் ஆதரவை அனுமதிக்கிறது, மேலும் சில காரணங்கள் சிகிச்சையளிக்கக்கூடியவை."
 }
};
const TITLES = Object.keys(ARTICLE_DATA);
const results = {}; // cache for `show` / `export`

const out = document.getElementById('output');
const input = document.getElementById('cmd');
const LANGS = [['hi','Hindi'], ['bn','Bangla'], ['ta','Tamil']];

function scrollDown(){ out.scrollTop = out.scrollHeight; }

function line(text, cls){
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  d.textContent = text;
  out.appendChild(d);
  scrollDown();
  return d;
}

function block(text, cls){
  const d = document.createElement('div');
  d.className = 'block' + (cls ? ' ' + cls : '');
  d.textContent = text;
  out.appendChild(d);
  scrollDown();
  return d;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function articleBlock(data, langLabel){
  const d = document.createElement('div');
  d.className = 'block article';
  let html = '';
  if(langLabel) html += `<div class="lang-tag">${langLabel}</div>`;
  html += `<h4>Overview</h4><p>${esc(data.overview)}</p>`;
  html += `<h4>Symptoms</h4><ul>${data.symptoms.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
  html += `<h4>${esc(data.causesLabel)}</h4><ul>${data.causes.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
  html += `<h4>${esc(data.preventionLabel)}</h4><ul>${data.prevention.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
  html += `<h4>When to See a Doctor</h4><p>${esc(data.doctor)}</p>`;
  d.innerHTML = html;
  out.appendChild(d);
  scrollDown();
  return d;
}

function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

function findDisease(query){
  if(!query) return null;
  query = query.trim();
  const n = parseInt(query, 10);
  if(!isNaN(n) && n >= 1 && n <= TITLES.length) return TITLES[n-1];
  const q = query.toLowerCase();
  const exact = TITLES.find(t => t.toLowerCase() === q);
  if(exact) return exact;
  const matches = TITLES.filter(t => t.toLowerCase().includes(q));
  if(matches.length === 1) return matches[0];
  if(matches.length > 1) return { ambiguous: matches };
  return null;
}

async function runPipeline(title, quiet){
  const article = ARTICLE_DATA[title];
  const script = SCRIPT_DATA[title];
  if(!quiet){
    line(`[1/4] Fetching source data: "${title}"...`);
    await delay(350);
    line(`      note: WHO's public data API (GHO OData) serves numeric health indicators only —`, 'dim');
    line(`      there is no official WHO endpoint that returns fact-sheet article text.`, 'dim');
    line(`      Using our team's pre-reviewed draft (compiled from WHO Fact Sheets + national`, 'dim');
    line(`      health portals, per our source-feasibility review).`, 'dim');
    line(`      [OK] source content loaded`, 'ok');
    await delay(250);

    line(`[2/4] Generating plain-language article (EN)...`);
    await delay(400);
    articleBlock(article.en);
    const wc = article.en.overview.split(' ').length;
    line(`      [OK] article generated`, 'ok');
    await delay(250);

    line(`[3/4] Translating article into Hindi, Bangla, Tamil...`);
    await delay(250);
    for(const [code, name] of LANGS){
      line(`      -> ${name}...`, 'dim');
      await delay(350);
      articleBlock(article[code], name);
      line(`      [OK] ${name} article ready`, 'ok');
      await delay(150);
    }

    line(`[4/4] Generating 30-60s video script...`);
    await delay(350);
    line('English script:', 'dim');
    block(script.en);
    for(const [code, name] of LANGS){
      line(name + ' script:', 'dim');
      block(script[code]);
    }
    line(`      [OK] scripts finalized — ready for ElevenLabs TTS in each language`, 'ok');
    line(`[DONE] Pipeline complete for "${title}". Video generation (ElevenLabs) deferred — see 'about'.`, 'amber');
  }
  results[title] = { article, script };
}

async function runAll(){
  line(`Running pipeline for all ${TITLES.length} diseases (condensed view)...`, 'cyan');
  await delay(200);
  for(let i = 0; i < TITLES.length; i++){
    const title = TITLES[i];
    await runPipeline(title, true);
    line(`  [${i+1}/${TITLES.length}] ${title} ... done (article + script, EN/HI/BN/TA)`, 'ok');
    await delay(60);
  }
  line(`\n${TITLES.length}/${TITLES.length} diseases processed.`, 'cyan');
  line(`Use "show <number|name>" to view a full result, or "export" to download all as JSON.`, 'dim');
}

function showResult(title){
  if(!results[title]){
    line(`"${title}" hasn't been run yet. Use "run ${title}" first.`, 'err');
    return;
  }
  const { article, script } = results[title];
  line(`== ${title} ==`, 'cyan');
  line('Article (EN):', 'dim');
  articleBlock(article.en);
  LANGS.forEach(([code, name]) => {
    line(`Article (${name}):`, 'dim');
    articleBlock(article[code]);
  });
  line('Video script (EN):', 'dim');
  block(script.en);
  LANGS.forEach(([code, name]) => {
    line(`Video script (${name}):`, 'dim');
    block(script[code]);
  });
}

function listDiseases(){
  line(`${TITLES.length} diseases loaded. Click one, or type "run <number>":`, 'cyan');
  const wrap = document.createElement('div');
  wrap.className = 'line';
  TITLES.forEach((t, i) => {
    const span = document.createElement('span');
    span.className = 'list-item';
    span.textContent = `  ${String(i+1).padStart(2,'0')}. ${t}`;
    span.onclick = () => { input.value = 'run ' + (i+1); handleCommand(); };
    wrap.appendChild(span);
    wrap.appendChild(document.createElement('br'));
  });
  out.appendChild(wrap);
  scrollDown();
}

function printAbout(){
  line('ABOUT THIS PIPELINE', 'cyan');
  block(
`What's real vs. simulated:
- This page runs entirely offline, in your browser. There are no live network
  calls — all 47 diseases' content is pre-generated and bundled into this file.

On the WHO API:
- WHO's public Global Health Observatory (GHO) OData API only serves numeric
  health-indicator data (mortality rates, coverage %, etc). There is no
  official WHO API that returns ready-to-use fact-sheet article text.
- A real pipeline would need to fetch descriptive content by scraping WHO
  Fact Sheets (permitted non-commercially under their CC BY-NC-SA licence,
  with attribution — see our source-feasibility notes) or an equivalently
  licensed source, then still run it through AI drafting + human review.

On translation:
- The full article (overview, symptoms, causes, prevention, when to see a
  doctor) and the condensed video script are both translated into Hindi,
  Bangla and Tamil. Tamil is new for this pipeline. All of it is AI-drafted
  and has NOT been checked by a native speaker or medical professional yet
  -- same caveat as every other AI-drafted article in this project.

On video:
- ElevenLabs video/voice generation is intentionally not wired up here, per
  instruction -- this tool stops at the finished, translated script. The
  scripts above are formatted and ready to feed into ElevenLabs next, in
  any of the four languages.`, 'white');
}

function printHelp(){
  line('Commands:', 'cyan');
  block(
`list                 show all 47 diseases (click any to run it)
run <number|name>    run fetch -> article -> translate -> script for one disease
run all              run the pipeline for all 47 (condensed output)
show <number|name>   view a result again without re-running the animation
export               download all 47 results as a JSON file
about                what's real vs. simulated in this demo, incl. WHO API notes
clear                clear the screen
help                 this message`);
}

function exportData(){
  const payload = {};
  TITLES.forEach(t => {
    payload[t] = { article: ARTICLE_DATA[t], script: SCRIPT_DATA[t] };
  });
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pipeline-output-47-diseases.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  line('Downloaded pipeline-output-47-diseases.json (all 47 diseases, articles + scripts, EN/HI/BN/TA).', 'ok');
}

async function handleCommand(){
  const raw = input.value;
  input.value = '';
  line('pipeline@sprint> ' + raw, 'dim');
  const parts = raw.trim().split(/\s+/);
  const cmd = (parts[0] || '').toLowerCase();

  if(cmd === ''){ return; }
  else if(cmd === 'help'){ printHelp(); }
  else if(cmd === 'about'){ printAbout(); }
  else if(cmd === 'list'){ listDiseases(); }
  else if(cmd === 'clear'){ out.innerHTML = ''; }
  else if(cmd === 'export'){ exportData(); }
  else if(cmd === 'run'){
    const arg = parts.slice(1).join(' ');
    if(arg.toLowerCase() === 'all'){ await runAll(); return; }
    const found = findDisease(arg);
    if(!found){ line(`No match for "${arg}". Try "list" to see all diseases.`, 'err'); }
    else if(found.ambiguous){ line(`Multiple matches: ${found.ambiguous.join(', ')}. Be more specific or use a number.`, 'err'); }
    else { await runPipeline(found, false); }
  }
  else if(cmd === 'show'){
    const arg = parts.slice(1).join(' ');
    const found = findDisease(arg);
    if(!found){ line(`No match for "${arg}". Try "list".`, 'err'); }
    else if(found.ambiguous){ line(`Multiple matches: ${found.ambiguous.join(', ')}. Be more specific.`, 'err'); }
    else { showResult(found); }
  }
  else{
    line(`Unknown command: "${cmd}". Type "help" for a list of commands.`, 'err');
  }
}

input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') handleCommand();
});
document.addEventListener('click', () => input.focus());

(async function boot(){
  line('health-pipeline terminal v1.1', 'cyan');
  line('WHO fetch -> AI article -> translate (HI/BN/TA) -> video script', 'dim');
  line('');
  await delay(200);
  line(`Loaded ${TITLES.length} diseases from our Sprint 2 reviewed content.`, 'ok');
  line('Type "help" for commands, or "list" to see all diseases.', 'white');
  line('');
})();
</script>
